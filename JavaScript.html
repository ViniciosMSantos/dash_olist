        { label: 'Insatisfeitas (1–3★)', num: true, render: function (x) { return formatNum(x.insatisfeitas); } },
        { label: '% insatisfeitas no nível', num: true, render: function (x) { return formatPct(x.avaliacoes > 0 ? x.insatisfeitas / x.avaliacoes : 0); } },
        { label: '% das insatisfeitas', num: true, render: function (x) { return formatPct(totI > 0 ? x.insatisfeitas / totI : 0); } },
        { label: 'Nota média', num: true, render: function (x) { return formatNum(x.nota, 2); } }
      ],

  // Bloco 4B — temas dos comentários das avaliações insatisfeitas (palavras-chave).

  // Bloco 5 — tamanho do problema: clientes, pedidos, faturamento e retorno.
  function renderSatisfacaoImpacto(data) {
    const k = data.kpis, j = (data.janela || []).filter(function (r) { return r.mes === data.periodo; })[0] || {};
    const card = function (dim, valor, texto, ref) {
      return '<div class="sinal-card sinal-card--grande"><div class="sinal-card-topo"><span class="sinal-card-dim">' + dim + '</span></div>' +
        '<div class="sinal-card-valor">' + valor + '</div><div class="sinal-card-texto">' + texto + '</div><div class="sinal-card-ref">' + ref + '</div></div>';
    };

    document.getElementById('satisfacao-impacto-cards').innerHTML =
      card('Clientes', formatNum(k.clientesInsatisfeitos.valor), 'clientes insatisfeitos no mês', k.clientesInsatisfeitos.delta == null ? '' : formatMoM(k.clientesInsatisfeitos.delta) + ' vs. ' + rotuloMesAnt_()) +
      card('Base', formatPct(k.avaliadores.valor > 0 ? k.clientesInsatisfeitos.valor / k.avaliadores.valor : 0), 'dos clientes avaliadores', formatNum(k.avaliadores.valor) + ' clientes avaliadores no mês') +
      card('Pedidos', formatNum(j.pedidosInsatisfeitos || 0), 'pedidos com avaliação insatisfeita', formatNum(j.avaliacoes || 0) + ' avaliações no mês') +
      card('Faturamento', formatBRL(j.faturamentoInsatisfeitos || 0), 'associado a pedidos insatisfeitos', 'valor dos produtos, não é receita perdida') +
      card('Voltou a comprar', formatPct(r.insatisfeitos.pct) + ' × ' + formatPct(r.satisfeitos.pct), 'insatisfeitos × satisfeitos', 'últimos 12 meses · ' + formatNum(r.insatisfeitos.clientes) + ' e ' + formatNum(r.satisfeitos.clientes) + ' clientes');
  }

  // Bloco 6 — sinais (cards + tabela com a coluna "Responsável / ação").
  function montarSinaisSatisfacao_(data) {
    const k = data.kpis, s = SATISFACAO_SINAIS, sinais = [];
    const add = function (dimensao, sinal, indicador, referencia, status) { sinais.push({ dimensao: dimensao, sinal: sinal, indicador: indicador, referencia: referencia, status: status }); };

    const gap = (data.meta - k.pctPositivas.valor) * 100;
    add('Meta', '% de avaliações positivas (4–5★) vs. a meta', formatPct(k.pctPositivas.valor), 'Meta: ' + formatPct(data.meta) + (gap > 0 ? ' · faltam ' + formatNum(gap, 1) + ' p.p.' : ' · meta atingida'), gap <= 0 ? 'ok' : statusLogisticaNivel_(gap, s.metaGapPP));

    const queda = k.notaMedia.valorAnterior == null ? null : k.notaMedia.valorAnterior - k.notaMedia.valor;
    add('Tendência', 'Nota média vs. ' + rotuloMesAnt_(), formatNum(k.notaMedia.valor, 2), queda == null ? 'Sem mês anterior' : '' + capMesAnt_() + ': ' + formatNum(k.notaMedia.valorAnterior, 2) + ' (' + (queda > 0 ? '−' : '+') + formatNum(Math.abs(queda), 2) + ')', queda == null ? 'ok' : statusLogisticaNivel_(queda, s.notaQueda));
    const ppIns = k.pctInsatisfeitas.valorAnterior == null ? null : (k.pctInsatisfeitas.valor - k.pctInsatisfeitas.valorAnterior) * 100;
    add('Tendência', '% de avaliações insatisfeitas (1–3★) vs. ' + rotuloMesAnt_(), formatPct(k.pctInsatisfeitas.valor), ppIns == null ? 'Sem mês anterior' : '' + capMesAnt_() + ': ' + formatPct(k.pctInsatisfeitas.valorAnterior) + ' (' + formatPP(ppIns) + ')', ppIns == null ? 'ok' : statusLogisticaNivel_(ppIns, s.insatisfeitasPP));
    add('Impacto', 'Clientes insatisfeitos vs. ' + rotuloMesAnt_(), formatNum(k.clientesInsatisfeitos.valor), k.clientesInsatisfeitos.delta == null ? 'Sem mês anterior' : '' + capMesAnt_() + ': ' + formatNum(k.clientesInsatisfeitos.valorAnterior) + ' (' + formatMoM(k.clientesInsatisfeitos.delta) + ')', k.clientesInsatisfeitos.delta == null ? 'ok' : statusLogisticaNivel_(k.clientesInsatisfeitos.delta, s.clientesAlta));

    // Segmentos com maior % de insatisfeitas
    const geral = k.pctInsatisfeitas.valor, min = data.onde.minAvaliacoes;
    [['estado', 'Estado'], ['cidade', 'Cidade'], ['categoria', 'Categoria']].forEach(function (par) {
      const l = (data.onde[par[0]] || []).filter(function (g) { return g.avaliacoes >= min; }).map(function (g) { return { nome: g.nome, taxa: g.insatisfeitas / g.avaliacoes, av: g.avaliacoes }; }).sort(function (a, b) { return b.taxa - a.taxa; });
      if (!l.length) return;
      const pp = (l[0].taxa - geral) * 100;
      add('Segmento', par[1] + ' com maior % de insatisfeitas', l[0].nome + ': ' + formatPct(l[0].taxa), 'Geral: ' + formatPct(geral) + ' (' + formatPP(pp) + ') · ' + formatNum(l[0].av) + ' avaliações', statusLogisticaNivel_(pp, s.segmentoPP));
    });

    // Insatisfeitas em pedidos atrasados
    const p = data.prazo || [];
    const totA = p.reduce(function (t, x) { return t + x.avaliacoes; }, 0), totI = p.reduce(function (t, x) { return t + x.insatisfeitas; }, 0);
    if (totA > 0 && totI > 0) {
      const atrA = p.slice(1).reduce(function (t, x) { return t + x.avaliacoes; }, 0) / totA;
      const atrI = p.slice(1).reduce(function (t, x) { return t + x.insatisfeitas; }, 0) / totI;
      const razao = atrA > 0 ? atrI / atrA : 0;
      add('Experiência', 'Avaliações insatisfeitas de pedidos entregues com atraso', formatPct(atrI), formatPct(atrA) + ' dos pedidos avaliados são atrasados · ' + formatNum(razao, 1) + '× a sua participação', statusLogisticaNivel_(razao, s.atrasoRazao));
    }

    // Tema mais frequente
    const t = data.temas;
    const temas = (t.itens || []).filter(function (x) { return x.nome !== 'Sem tema identificado'; }).sort(function (a, b) { return b.comentarios - a.comentarios; });
    if (t.comentarios > 0 && temas.length) {
      const pt = temas[0].comentarios / t.comentarios;
      add('Voz do cliente', 'Tema mais citado nos comentários das avaliações insatisfeitas', formatPct(pt), temas[0].nome + ' · base de ' + formatNum(t.comentarios) + ' comentários', statusLogisticaNivel_(pt, s.tema));
    }

    // Retenção
    const r = data.retencao;
    if (r.insatisfeitos.clientes > 0 && r.satisfeitos.clientes > 0) {
      const dif = (r.satisfeitos.pct - r.insatisfeitos.pct) * 100;
      add('Retenção', 'Clientes insatisfeitos que voltaram a comprar × satisfeitos', formatPct(r.insatisfeitos.pct) + ' × ' + formatPct(r.satisfeitos.pct), 'Diferença de ' + formatNum(dif, 1) + ' p.p. · últimos 12 meses', statusLogisticaNivel_(dif, s.retencaoPP));
    }
    return sinais.sort(function (a, b) { return LOGISTICA_STATUS[a.status].ordem - LOGISTICA_STATUS[b.status].ordem; });
  }

  function renderSatisfacaoSinais(data) {
    const sinais = montarSinaisSatisfacao_(data);
    document.getElementById('satisfacao-sinais-cards').innerHTML = sinais.slice(0, 6).map(function (x) {
      return '<div class="sinal-card sinal-card--' + x.status + '">' +
        '<div class="sinal-card-topo"><span class="sinal-card-dim">' + x.dimensao + '</span><span class="sinal sinal--' + x.status + '">' + LOGISTICA_STATUS[x.status].rotulo + '</span></div>' +
        '<div class="sinal-card-valor">' + x.indicador + '</div>' +
        '<div class="sinal-card-texto">' + x.sinal + '</div>' +
        '<div class="sinal-card-ref">' + x.referencia + '</div></div>';
    }).join('');
    renderTable('table-satisfacao-sinais',
      [
        { label: 'Dimensão', render: function (x) { return x.dimensao; } },
        { label: 'Sinal', render: function (x) { return x.sinal; } },
        { label: 'Indicador', num: true, render: function (x) { return x.indicador; } },
        { label: 'Referência', render: function (x) { return x.referencia; } },
        { label: 'Status', render: function (x) { return '<span class="sinal sinal--' + x.status + '">' + LOGISTICA_STATUS[x.status].rotulo + '</span>'; } },
        { label: 'Responsável / ação (preencher fora do dash)', render: function () { return '—'; } }
      ],
      sinais
    );
  }

  function ligarToggleSatisfacao_(toggleId, atributo, definir, redesenhar) {
    document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!satisfacaoAtual) return;
        document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        definir(btn.dataset[atributo]);
        redesenhar(satisfacaoAtual);
      });
    });
  }
  ligarToggleSatisfacao_('satisfacao-evolucao-toggle', 'modo', function (v) { satisfacaoEvolucaoModo = v; }, renderSatisfacaoEvolucao);
  ligarToggleSatisfacao_('satisfacao-onde-dim-toggle', 'dim', function (v) { satisfacaoOndeDim = v; }, renderSatisfacaoOnde);
  ligarToggleSatisfacao_('satisfacao-onde-metrica-toggle', 'metrica', function (v) { satisfacaoOndeMetrica = v; }, renderSatisfacaoOnde);

  function carregarSatisfacao(valor) {
    const fimRpc = tempoRpc_("getSatisfacaoData");
    google.script.run
      .withSuccessHandler(function (data) {
        fimRpc();
        satisfacaoAtual = data;
        comparacaoAtual = data.comparacao || null;
        renderSatisfacaoKpis(data);
        renderSatisfacaoEvolucao(data);
        renderSatisfacaoDistribuicao(data);
        renderSatisfacaoOnde(data);
        renderSatisfacaoPrazo(data);
        renderSatisfacaoTemas(data);
        renderSatisfacaoImpacto(data);
        renderSatisfacaoSinais(data);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] getSatisfacaoData falhou', err);
        document.getElementById('satisfacao-kpi-row').innerHTML = '<p class="error">Erro ao carregar satisfação: ' + err.message + '</p>';
      })
      .getSatisfacaoData(valor, false);
  }

  function iniciarSatisfacao() {
    if (satisfacaoIniciado) return;
    satisfacaoIniciado = true;
    mesesDisponiveis_(function (opcoes) {
        document.getElementById('satisfacao-mes-selector').innerHTML = opcoes.map(function (v) {
          return '<option value="' + v + '">' + formatMesLabel(v) + '</option>';
        }).join('');
        carregarSatisfacao(opcoes[0]);
      }, function (err) {
        satisfacaoIniciado = false;
        console.error('[dash] getMesesDisponiveis (satisfação) falhou', err);
        document.getElementById('satisfacao-kpi-row').innerHTML = '<p class="error">Erro ao carregar períodos: ' + err.message + '</p>';
      });
  }

  document.getElementById('satisfacao-mes-selector').addEventListener('change', function (e) {
    carregarSatisfacao(e.target.value);
  });

  // ===== Carregamento =====

  // Tempo de cada chamada ao servidor no console do navegador (F12): "[dash] getVendasData: 1830 ms".
  function tempoRpc_(nome) {
    const inicio = Date.now();
    return function () { console.log('[dash] ' + nome + ': ' + (Date.now() - inicio) + ' ms'); };
  }

  // A lista de meses é a mesma em todas as páginas: busca uma vez (a Visão Geral já traz na abertura) e reaproveita.
  let mesesCompartilhados = null;
  function mesesDisponiveis_(ok, falha) {
    if (mesesCompartilhados) { setTimeout(function () { ok(mesesCompartilhados); }, 0); return; }
    const fim = tempoRpc_('getMesesDisponiveis');
    google.script.run
      .withSuccessHandler(function (m) { fim(); mesesCompartilhados = m; ok(m); })
      .withFailureHandler(falha)
      .getMesesDisponiveis();
  }

  function aplicarOverview_(data) {
    comparacaoAtual = data.comparacao || null;
    renderKpis(data);
    renderCharts(data);
    document.getElementById('sidebar-footer').textContent = 'Atualizado em ' + formatDataHora(data.atualizadoEm);
  }

  function carregarPeriodo(valor) {
    const rpc = periodoTipoAtual === 'ano' ? 'getOverviewDataAnual' : 'getOverviewData';
    const fimRpc = tempoRpc_(rpc);
    google.script.run
      .withSuccessHandler(function (data) {
        fimRpc();
        aplicarOverview_(data);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] ' + rpc + ' falhou', err);
        document.getElementById('kpi-row').innerHTML = '<p class="error">Erro ao carregar dados: ' + err.message + '</p>';
      })
      [rpc](valor, false);
  }

  function carregarOpcoesPeriodo() {
    if (periodoTipoAtual !== 'ano') {
      // abertura: lista de meses + dados do mês mais recente numa chamada só
      const fimInicial = tempoRpc_('getOverviewInicial');
      google.script.run
        .withSuccessHandler(function (res) {
          fimInicial();
          mesesCompartilhados = res.meses;
          document.getElementById('mes-selector').innerHTML = res.meses.map(function (v) {
            return '<option value="' + v + '">' + formatMesLabel(v) + '</option>';
          }).join('');
          aplicarOverview_(res.data);
        })
        .withFailureHandler(function (err) {
          console.error('[dash] getOverviewInicial falhou', err);
          document.getElementById('kpi-row').innerHTML = '<p class="error">Erro ao carregar dados: ' + err.message + '</p>';
        })
        .getOverviewInicial();
      return;
    }
    const rpc = 'getAnosDisponiveis';
    google.script.run
      .withSuccessHandler(function (opcoes) {
        const select = document.getElementById('mes-selector');
        select.innerHTML = opcoes.map(function (v) {
          return '<option value="' + v + '">' + (periodoTipoAtual === 'ano' ? v : formatMesLabel(v)) + '</option>';
        }).join('');
        carregarPeriodo(opcoes[0]);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] ' + rpc + ' falhou', err);
        document.getElementById('kpi-row').innerHTML = '<p class="error">Erro ao carregar períodos: ' + err.message + '</p>';
      })
      [rpc]();
  }

  document.getElementById('mes-selector').addEventListener('change', function (e) {
    carregarPeriodo(e.target.value);
  });

  function carregarUsuario() {
    google.script.run
      .withSuccessHandler(function (usuario) {
        document.getElementById('sidebar-user').innerHTML =
          '<div class="sidebar-user-avatar">' + usuario.iniciais + '</div>' +
          '<div class="sidebar-user-info">' +
          '<div class="sidebar-user-name">' + usuario.nome + '</div>' +
          '<div class="sidebar-user-email">' + usuario.email + '</div>' +
          '</div>';
      })
      .withFailureHandler(function (err) {
        console.error('[dash] getUsuarioAtual falhou', err);
      })
      .getUsuarioAtual();
  }

  habilitarLegendaClicavel_('evolucao-margem-legend', 'evolucaoMargem');

  document.getElementById('area-resumo-lista').addEventListener('click', function (e) {
    const botao = e.target.closest('.area-resumo');
    if (!botao) return;
    const nav = document.querySelector('.nav-item[data-view="' + botao.dataset.view + '"]');
    if (nav) nav.click();
  });

  (function () {
    const wrap = document.querySelector('.perguntas-wrap');
    const barra = document.querySelector('.perguntas-barra');
    document.querySelectorAll('.page-header').forEach(function (h) {
      const slot = document.createElement('div');
      slot.className = 'perguntas-slot';
      h.insertBefore(slot, h.children[1] || null);
    });
    function posicionar() {
      const slot = document.querySelector('.view.active .perguntas-slot');
      if (wrap && slot && wrap.parentNode !== slot) slot.appendChild(wrap);
    }
    posicionar();
    if (barra && wrap && wrap.parentNode !== barra) barra.remove();
    document.querySelectorAll('.nav-item').forEach(function (n) { n.addEventListener('click', function () { setTimeout(posicionar, 0); }); });
    const btn = document.getElementById('perguntas-btn');
    const painel = document.getElementById('perguntas-painel');
    if (!btn || !painel) return;
    function fechar() { painel.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      painel.hidden = !painel.hidden;
      btn.setAttribute('aria-expanded', String(!painel.hidden));
    });
    document.addEventListener('click', function (e) { if (!painel.contains(e.target)) fechar(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechar(); });
    painel.querySelectorAll('.pergunta-item').forEach(function (it) {
      it.addEventListener('click', function () {
        const view = it.dataset.view;
        const nav = document.querySelector('.nav-item[data-view="' + view + '"]');
        if (nav && !nav.classList.contains('active')) nav.click();
        fechar();
        setTimeout(function () {
          let el = document.querySelector('#view-' + view + ' ' + it.dataset.alvo);
          if (el && el.closest('.chart-card')) el = el.closest('.chart-card');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      });
    });
  })();

  carregarOpcoesPeriodo();
  carregarUsuario();
</script>
