      'Participação no faturamento: ' + formatPct(x.participacao)
    ];
  }

  function colunasVariacaoReceita_(rotuloNome, nomeFn) {
    return [
      { label: rotuloNome, render: nomeFn },
      { label: 'Faturamento atual', num: true, render: function (x) { return formatBRLCheio(x.atual); } },
      { label: 'Faturamento anterior', num: true, render: function (x) { return formatBRLCheio(x.anterior); } },
      { label: 'Variação (R$)', num: true, render: function (x) { return formatBRLSinal(x.delta); } },
      { label: 'Variação (%)', num: true, render: function (x) { return x.variacao == null ? 'novo' : formatMoM(x.variacao); } },
      { label: 'Participação', num: true, render: function (x) { return formatPct(x.participacao); } }
    ];
  }

  // Etapa 02: categorias com maiores altas/quedas em R$ (os dados não têm nome de produto).
  // Sempre 10 categorias: por padrão metade altas e metade quedas (5+5); "Só altas" / "Só quedas" mostram
  // as 10 maiores de um lado. Se um lado tiver menos de 5, o outro completa até 10.
  function selecionarAltasQuedas_(lista, modo, valor) {
    const altas = lista.filter(function (x) { return valor(x) > 0; });   // da maior alta para a menor
    const quedas = lista.filter(function (x) { return valor(x) < 0; });  // da menor queda para a maior (mais negativa por último)
    if (modo === 'altas') return altas.slice(0, 10);
    if (modo === 'quedas') return quedas.slice(Math.max(quedas.length - 10, 0));
    let nAltas = Math.min(altas.length, 5);
    let nQuedas = Math.min(quedas.length, 5);
    nAltas = Math.min(altas.length, nAltas + (5 - nQuedas));
    nQuedas = Math.min(quedas.length, nQuedas + (5 - Math.min(altas.length, 5)));
    return altas.slice(0, nAltas).concat(quedas.slice(quedas.length - nQuedas));
  }

  function descricaoModoAltasQuedas_(modo, substantivo) {
    if (modo === 'altas') return 'as 10 maiores altas';
    if (modo === 'quedas') return 'as 10 maiores quedas';
    return 'as 5 maiores altas e as 5 maiores quedas';
  }

  // Liga os 3 botões (Altas e quedas / Só altas / Só quedas) de um gráfico: guarda o modo escolhido e redesenha.
  function ligarFiltroAltasQuedas_(toggleId, definirModo, redesenhar) {
    document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!receitaAtual) return;
        document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        definirModo(btn.dataset.modo);
        redesenhar(receitaAtual);
      });
    });
  }

  // O que a altura da coluna representa: variação em R$, em % ou em participação (p.p.). `rotuloPct` explica o
  // corte de relevância aplicado ao ranking em % (categorias/cidades pequenas oscilam demais).
  function metricaVariacaoReceita_(metrica, rotuloPct) {
    if (metrica === 'pct') {
      return { valor: function (x) { return x.variacao; }, texto: function (v) { return formatMoM(v); }, unidade: 'variação em %, ' + rotuloPct };
    }
    if (metrica === 'pp') {
      return { valor: function (x) { return x.deltaPP; }, texto: function (v) { return formatPP(v); }, unidade: 'ganho ou perda de participação no faturamento, em pontos percentuais' };
    }
    return { valor: function (x) { return x.delta; }, texto: function (v) { return formatBRLSinal(v); }, unidade: 'variação em R$' };
  }

  function tooltipVariacaoReceita_(x) {
    return {
      titulo: x.nome,
      linhas: [
        'Faturamento: ' + formatBRLCheio(x.anterior) + ' → ' + formatBRLCheio(x.atual),
        'Variação: ' + formatBRLSinal(x.delta) + (x.variacao == null ? ' (novo: sem vendas no mês anterior)' : ' (' + formatMoM(x.variacao) + ')'),
        'Participação: ' + formatPct(x.participacaoAnterior) + ' → ' + formatPct(x.participacao) + ' (' + formatPP(x.deltaPP) + ')'
      ]
    };
  }

  function colunasVariacaoCompletas_(rotulo) {
    return [
      { label: rotulo, render: function (x) { return x.nome; } },
      { label: 'Faturamento atual', num: true, render: function (x) { return formatBRLCheio(x.atual); } },
      { label: 'Faturamento anterior', num: true, render: function (x) { return formatBRLCheio(x.anterior); } },
      { label: 'Variação (R$)', num: true, render: function (x) { return formatBRLSinal(x.delta); } },
      { label: 'Variação (%)', num: true, render: function (x) { return x.variacao == null ? 'novo' : formatMoM(x.variacao); } },
      { label: 'Participação atual', num: true, render: function (x) { return formatPct(x.participacao); } },
      { label: 'Participação anterior', num: true, render: function (x) { return formatPct(x.participacaoAnterior); } },
      { label: 'Variação (p.p.)', num: true, render: function (x) { return formatPP(x.deltaPP); } }
    ];
  }

  function renderReceitaCategoriasVariacao(data) {
    const metrica = receitaCategoriasMetrica;
    let base = data.categorias.itens || [];
    let valor, texto, unidade;
    if (metrica === 'pct') {
      // % relativo só faz sentido com base > 0 e sem categorias minúsculas (oscilam demais)
      base = base.filter(function (x) { return x.variacao != null && Math.max(x.participacao, x.participacaoAnterior) >= 0.01; });
      valor = function (x) { return x.variacao; };
      texto = function (v) { return formatMoM(v); };
      unidade = 'variação em %, categorias com pelo menos 1% do faturamento em um dos dois meses';
    } else if (metrica === 'pp') {
      valor = function (x) { return x.deltaPP; };
      texto = function (v) { return formatPP(v); };
      unidade = 'ganho ou perda de participação no faturamento, em pontos percentuais';
    } else {
      valor = function (x) { return x.delta; };
      texto = function (v) { return formatBRLSinal(v); };
      unidade = 'variação em R$';
    }
    const ordenada = base.slice().sort(function (a, b) { return valor(b) - valor(a); });
    const itens = selecionarAltasQuedas_(ordenada, receitaCategoriasModo, valor);
    document.getElementById('receita-categorias-variacao-caption').textContent =
      formatMesLabel(data.periodo) + ' vs. ' + formatMesLabel(data.periodoAnterior) + sufixoParcial_(data.comparacao) + ' — ' + descricaoModoAltasQuedas_(receitaCategoriasModo) + '; ' + unidade +
      '; considera apenas pedidos entregues/faturados';
    renderColunasDivergentes_({
      chartKey: 'receitaCategoriasVariacao', canvasId: 'chart-receita-categorias-variacao', tableId: 'table-receita-categorias-variacao',
      itens: itens,
      valor: valor,
      rotulo: function (x) { return x.nome; },
      texto: texto,
      tooltip: function (x) {
        return {
          titulo: x.nome,
          linhas: [
            'Faturamento: ' + formatBRLCheio(x.anterior) + ' → ' + formatBRLCheio(x.atual),
            'Variação: ' + formatBRLSinal(x.delta) + (x.variacao == null ? ' (novo: sem vendas no mês anterior)' : ' (' + formatMoM(x.variacao) + ')'),
            'Participação: ' + formatPct(x.participacaoAnterior) + ' → ' + formatPct(x.participacao) + ' (' + formatPP(x.deltaPP) + ')'
          ]
        };
      },
      colunas: [
        { label: 'Categoria', render: function (x) { return x.nome; } },
        { label: 'Faturamento atual', num: true, render: function (x) { return formatBRLCheio(x.atual); } },
        { label: 'Faturamento anterior', num: true, render: function (x) { return formatBRLCheio(x.anterior); } },
        { label: 'Variação (R$)', num: true, render: function (x) { return formatBRLSinal(x.delta); } },
        { label: 'Variação (%)', num: true, render: function (x) { return x.variacao == null ? 'novo' : formatMoM(x.variacao); } },
        { label: 'Participação atual', num: true, render: function (x) { return formatPct(x.participacao); } },
        { label: 'Participação anterior', num: true, render: function (x) { return formatPct(x.participacaoAnterior); } },
        { label: 'Variação (p.p.)', num: true, render: function (x) { return formatPP(x.deltaPP); } }
      ]
    });
  }

  document.querySelectorAll('#receita-categorias-metrica-toggle .toggle-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!receitaAtual) return;
      document.querySelectorAll('#receita-categorias-metrica-toggle .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      receitaCategoriasMetrica = btn.dataset.metrica;
      renderReceitaCategoriasVariacao(receitaAtual);
    });
  });

  ligarFiltroAltasQuedas_('receita-categorias-variacao-toggle', function (m) { receitaCategoriasModo = m; }, renderReceitaCategoriasVariacao);

  // Etapa 03: Pareto — barras (faturamento) + linha (% acumulada de todos os produtos).
  // Por que a categoria sustenta o faturamento: compara o ticket dela com o ticket médio das categorias.
  // razaoTicket > 1 = a fatia dela no faturamento é maior que a fatia nos pedidos (ticket alto);
  // < 1 = sustenta por ter muitos pedidos, com ticket menor (volume).
  const PARETO_TICKET_ALTO = 1.2;
  const PARETO_TICKET_BAIXO = 0.8;
  function perfilParetoReceita_(x) {
    if (x.razaoTicket >= PARETO_TICKET_ALTO) return { chave: 'ticket', rotulo: 'Sustenta por ticket alto', cor: cssVar('--perfil-ticket') };
    if (x.razaoTicket <= PARETO_TICKET_BAIXO) return { chave: 'volume', rotulo: 'Sustenta por volume de pedidos', cor: cssVar('--perfil-volume') };
    return { chave: 'media', rotulo: 'Ticket na média', cor: cssVar('--perfil-media') };
  }

  function renderReceitaPareto(data) {
    if (charts.receitaPareto) charts.receitaPareto.destroy();
    const p = data.categorias.pareto;
    const lista = p.itens || [];
    // Resposta direta: entre as categorias que somam 80% do faturamento, quantas sustentam por ticket, por volume ou "na média".
    const nucleo = lista.slice(0, Math.min(p.n80 || lista.length, lista.length));
    const contagem = { ticket: 0, volume: 0, media: 0 };
    nucleo.forEach(function (x) { contagem[perfilParetoReceita_(x).chave]++; });
    const partes = [];
    if (contagem.ticket) partes.push(contagem.ticket + ' por ticket alto');
    if (contagem.volume) partes.push(contagem.volume + ' por volume de pedidos');
    if (contagem.media) partes.push(contagem.media + ' com ticket na média');
    const resumoPerfil = 'Das ' + nucleo.length + ' que somam 80%: ' + partes.join(', ') + ' (ticket médio de referência: ' + formatBRLCheio(p.ticketBase) + ').';
    document.getElementById('receita-pareto-caption').textContent =
      formatMesLabel(data.periodo) + ' — ' + formatNum(p.n50) + ' categorias somam 50% do faturamento e ' + formatNum(p.n80) +
      ' somam 80% (de ' + formatNum(p.totalCategorias) + ' categorias com venda no mês); mostrando as ' + lista.length + ' maiores. ' + resumoPerfil;

    const corBarra = cssVar('--chart-evolucao-bar');
    const corLinha = cssVar('--series-2');
    const maxFat = Math.max.apply(null, lista.map(function (x) { return x.faturamento; }).concat([1]));
    const acumMax = Math.max.apply(null, lista.map(function (x) { return x.acumulado; }).concat([0.01]));
    const acumMin = Math.min.apply(null, lista.map(function (x) { return x.acumulado; }).concat([acumMax]));
    const y1Max = acumMax + ((acumMax - acumMin) || 0.02) * 0.15;
    const y1Min = y1Max - ((acumMax - acumMin) || 0.02) / 0.2; // a linha ocupa ~20% do topo do eixo
    const indicesRotulo = {};
    indicesRotulo[0] = true;
    indicesRotulo[lista.length - 1] = true;
    for (let k = 0; k < lista.length; k++) {
      if (lista[k].acumulado >= 0.5) { indicesRotulo[k] = true; break; }
    }

    charts.receitaPareto = new Chart(document.getElementById('chart-receita-pareto'), {
      type: 'bar',
      data: {
        labels: lista.map(function (x) { return x.nome; }),
        datasets: [
          {
            type: 'bar',
            label: 'Faturamento',
            data: lista.map(function (x) { return x.faturamento; }),
            backgroundColor: lista.map(function (x) { return perfilParetoReceita_(x).cor; }),
            maxBarThickness: 36,
            yAxisID: 'y',
            order: 2,
            datalabels: {
              display: true, anchor: 'end', align: 'top', offset: 3,
              color: cssVar('--text-primary'), font: { size: 10, weight: '600' },
              formatter: function (value, ctx) { return formatPct(lista[ctx.dataIndex].participacao); }
            }
          },
          {
            type: 'line',
            label: '% acumulada',
            data: lista.map(function (x) { return x.acumulado; }),
            borderColor: corLinha,
            backgroundColor: corLinha,
            borderWidth: 2,
            pointRadius: 3,
            tension: 0,
            yAxisID: 'y1',
            order: 1,
            datalabels: {
              display: function (ctx) { return !!indicesRotulo[ctx.dataIndex]; },
              anchor: 'end', align: 'top', offset: 6, clamp: true,
              color: corLinha, font: { size: 10, weight: '600' },
              formatter: function (value) { return formatPct(value); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return lista[items[0].dataIndex].nome; },
              label: function (ctx) {
                const x = lista[ctx.dataIndex];
                if (ctx.datasetIndex !== 0) return '% acumulada: ' + formatPct(x.acumulado);
                const vs = x.razaoTicket - 1;
                return [
                  'Faturamento: ' + formatBRLCheio(x.faturamento) + ' (' + formatPct(x.participacao) + ' do total)',
                  'Pedidos: ' + formatNum(x.pedidos) + ' (' + formatPct(x.participacaoPedidos) + ' dos pedidos)',
                  'Ticket médio: ' + formatBRLCheio(x.ticket) + ' (' + (vs >= 0 ? '+' : '') + formatPct(vs) + ' vs. a média)',
                  perfilParetoReceita_(x).rotulo
                ];
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') },
            ticks: {
              minRotation: 45, maxRotation: 45, autoSkip: false, font: { size: 9 }, color: cssVar('--text-secondary'),
              callback: function (value) {
                const nome = this.getLabelForValue(value);
                return nome.length > 24 ? nome.slice(0, 23) + '…' : nome;
              }
            }
          },
          y: {
            position: 'left', beginAtZero: true, max: maxFat * 1.75,
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { display: false },
            ticks: { display: false, count: 3 }
          },
          y1: {
            type: 'linear', position: 'right', min: y1Min, max: y1Max,
            grid: { display: false }, border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    renderTable('table-receita-pareto',
      [
        { label: '#', num: true, render: function (x) { return lista.indexOf(x) + 1; } },
        { label: 'Categoria', render: function (x) { return x.nome; } },
        { label: 'Faturamento', num: true, render: function (x) { return formatBRLCheio(x.faturamento); } },
        { label: 'Participação', num: true, render: function (x) { return formatPct(x.participacao); } },
        { label: '% acumulada', num: true, render: function (x) { return formatPct(x.acumulado); } },
        { label: 'Pedidos', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: 'Ticket médio', num: true, render: function (x) { return formatBRLCheio(x.ticket); } },
        { label: 'Ticket vs. média', num: true, render: function (x) { const v = x.razaoTicket - 1; return (v >= 0 ? '+' : '') + formatPct(v); } },
        { label: 'Por que sustenta', render: function (x) { return perfilParetoReceita_(x).rotulo; } }
      ],
      lista
    );
  }

  // Etapa 04: cidades (do cliente) com maiores altas/quedas em R$.
  function renderReceitaCidadesVariacao(data) {
    const m = metricaVariacaoReceita_(receitaCidadesMetrica, 'cidades com pelo menos ' + formatPct(data.cidades.minParticipacao) + ' do faturamento em um dos dois meses');
    const lista = data.cidades.variacoes[receitaCidadesMetrica] || [];
    const itens = selecionarAltasQuedas_(lista, receitaCidadesModo, m.valor);
    document.getElementById('receita-cidades-variacao-caption').textContent =
      formatMesLabel(data.periodo) + ' vs. ' + formatMesLabel(data.periodoAnterior) + sufixoParcial_(data.comparacao) + ' — cidade do cliente; ' + descricaoModoAltasQuedas_(receitaCidadesModo) + '; ' + m.unidade + '; ' +
      formatNum(data.cidades.quantidade) + ' cidades com venda no mês';
    renderColunasDivergentes_({
      chartKey: 'receitaCidadesVariacao', canvasId: 'chart-receita-cidades-variacao', tableId: 'table-receita-cidades-variacao',
      itens: itens,
      valor: m.valor,
      rotulo: function (x) { return x.nome; },
      texto: m.texto,
      tooltip: tooltipVariacaoReceita_,
      colunas: colunasVariacaoCompletas_('Cidade')
    });
  }

  document.querySelectorAll('#receita-cidades-metrica-toggle .toggle-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (!receitaAtual) return;
      document.querySelectorAll('#receita-cidades-metrica-toggle .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      receitaCidadesMetrica = btn.dataset.metrica;
      renderReceitaCidadesVariacao(receitaAtual);
    });
  });

  ligarFiltroAltasQuedas_('receita-cidades-variacao-toggle', function (m) { receitaCidadesModo = m; }, renderReceitaCidadesVariacao);

  // Etapa 05: como está a composição do faturamento — barras (top 10 + Outros) por categoria e por cidade,
  // coloridas pelo mesmo perfil do Pareto: ticket alto, volume de pedidos ou ticket na média. A cor responde
  // "pesa por valor ou por volume?" comparando o ticket do item com o ticket médio geral.
  function renderReceitaComposicaoBarras_(o) {
    if (charts[o.chartKey]) charts[o.chartKey].destroy();
    const dados = o.dados;
    const ticketBase = dados.totalPedidos > 0 ? dados.totalFaturamento / dados.totalPedidos : 0;
    const lista = dados.faturamento.map(function (i) {
      const ticket = i.pedidos > 0 ? i.faturamento / i.pedidos : 0;
      return Object.assign({}, i, { ticket: ticket, razaoTicket: ticketBase > 0 ? ticket / ticketBase : 0 });
    });
    const perfilDe = perfilParetoReceita_;

    const top3 = lista.filter(function (i) { return !i.outros; }).slice(0, 3)
      .reduce(function (s, i) { return s + i.participacaoFaturamento; }, 0);
    const individuais = lista.filter(function (i) { return !i.outros; });
    const contagem = { ticket: 0, volume: 0, media: 0 };
    individuais.forEach(function (i) { contagem[perfilDe(i).chave]++; });
    const partes = [];
    if (contagem.ticket) partes.push(contagem.ticket + ' por ticket alto');
    if (contagem.volume) partes.push(contagem.volume + ' por volume de pedidos');
    if (contagem.media) partes.push(contagem.media + ' com ticket na média');
    document.getElementById(o.chave + '-caption').textContent =
      'As 3 maiores respondem por ' + formatPct(top3) + ' do faturamento · ' + formatNum(dados.quantidade) + ' ' + o.plural + ' com venda no mês. ' +
      'Das ' + individuais.length + ' maiores: ' + partes.join(', ') + ' (ticket de referência: ' + formatBRLCheio(ticketBase) + ').';

    const maxFat = Math.max.apply(null, lista.map(function (i) { return i.faturamento; }).concat([1]));
    charts[o.chartKey] = new Chart(document.getElementById('chart-' + o.chave), {
      type: 'bar',
      data: {
        labels: lista.map(function (i) { return i.nome; }),
        datasets: [{
          data: lista.map(function (i) { return i.faturamento; }),
          backgroundColor: lista.map(function (i) { return perfilDe(i).cor; }),
          borderRadius: 4,
          maxBarThickness: 22,
          datalabels: {
            display: true, anchor: 'end', align: 'end', offset: 4,
            color: cssVar('--text-primary'), font: { size: 10, weight: '600' },
            formatter: function (value, ctx) { return formatBRL(value) + ' · ' + formatPct(lista[ctx.dataIndex].participacaoFaturamento); }
          }
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 8 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return lista[items[0].dataIndex].nome; },
              label: function (ctx) {
                const i = lista[ctx.dataIndex];
                const vs = i.razaoTicket - 1;
                return [
                  'Faturamento: ' + formatBRLCheio(i.faturamento) + ' (' + formatPct(i.participacaoFaturamento) + ' do total)',
                  'Pedidos: ' + formatNum(i.pedidos) + ' (' + formatPct(i.participacaoPedidos) + ' do total)',
                  'Ticket médio: ' + formatBRLCheio(i.ticket) + ' (' + (vs >= 0 ? '+' : '') + formatPct(vs) + ' vs. a média)',
                  perfilDe(i).rotulo
                ];
              }
            }
          }
        },
        scales: {
          x: { display: false, beginAtZero: true, max: maxFat * 1.6 },
          y: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') },
            ticks: {
              font: { size: 10 },
              callback: function (value) {
                const nome = this.getLabelForValue(value);
                return nome.length > 22 ? nome.slice(0, 21) + '…' : nome;
              }
            }
          }
        }
      }
    });

    renderTable('table-' + o.chave,
      [
        { label: o.coluna, render: function (i) { return i.nome; } },
        { label: 'Faturamento', num: true, render: function (i) { return formatBRLCheio(i.faturamento); } },
        { label: 'Participação (faturamento)', num: true, render: function (i) { return formatPct(i.participacaoFaturamento); } },
        { label: 'Pedidos', num: true, render: function (i) { return formatNum(i.pedidos); } },
        { label: 'Participação (pedidos)', num: true, render: function (i) { return formatPct(i.participacaoPedidos); } },
        { label: 'Ticket médio', num: true, render: function (i) { return formatBRLCheio(i.ticket); } },
        { label: 'Ticket vs. média', num: true, render: function (i) { const v = i.razaoTicket - 1; return (v >= 0 ? '+' : '') + formatPct(v); } },
        { label: 'Perfil', render: function (i) { return perfilDe(i).rotulo; } }
      ],
      lista
    );
  }

  function renderReceitaComposicao(data) {
    renderReceitaComposicaoBarras_({ chartKey: 'receitaCompCategorias', chave: 'receita-comp-categorias', dados: data.categorias.composicao, plural: 'categorias', coluna: 'Categoria' });
    renderReceitaComposicaoBarras_({ chartKey: 'receitaCompCidades', chave: 'receita-comp-cidades', dados: data.cidades.composicao, plural: 'cidades', coluna: 'Cidade (UF)' });
  }

  // Etapa 06: bolhas = categorias; X = pedidos (log), Y = ticket médio, tamanho = faturamento.
  // Medianas dividem o gráfico em 4 áreas (volume × valor por pedido).
  function renderReceitaScatter(data) {
    if (charts.receitaScatter) charts.receitaScatter.destroy();
    const c = data.categorias;
    const pontos = c.pontos || [];
    const maxFat = Math.max.apply(null, pontos.map(function (x) { return x.faturamento; }).concat([1]));
    const cor = cssVar('--chart-evolucao-bar');
    const corMediana = cssVar('--text-muted');
    const maxTicket = Math.max.apply(null, pontos.map(function (x) { return x.ticket; }).concat([1]));
    const minPedidos = Math.min.apply(null, pontos.map(function (x) { return x.pedidos; }).concat([1]));
    const maxPedidos = Math.max.apply(null, pontos.map(function (x) { return x.pedidos; }).concat([1]));

    const medianas = {
      id: 'receitaMedianas',
      afterDatasetsDraw: function (chart) {
        const ctx = chart.ctx, a = chart.chartArea, sx = chart.scales.x, sy = chart.scales.y;
        const px = sx.getPixelForValue(c.medianaPedidos), py = sy.getPixelForValue(c.medianaTicket);
        ctx.save();
        ctx.strokeStyle = corMediana;
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = corMediana;
        ctx.font = '10px Inter, sans-serif';
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
        ctx.fillText('Baixo volume · alto ticket', a.left + 8, a.top + 6);
        ctx.textAlign = 'right';
        ctx.fillText('Alto volume · alto ticket', a.right - 8, a.top + 6);
        ctx.textBaseline = 'bottom';
        ctx.textAlign = 'left';
        ctx.fillText('Baixo volume · baixo ticket', a.left + 8, a.bottom - 6);

    renderTable('table-receita-categorias-scatter',

        { label: 'Faturamento', num: true, render: function (x) { return formatBRLCheio(x.faturamento); } },
        { label: 'Participação', num: true, render: function (x) { return formatPct(x.participacao); } },
        { label: 'Pedidos', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: 'Ticket médio', num: true, render: function (x) { return formatBRLCheio(x.ticket); } },
        { label: 'Área', render: function (x) {

        } }

    );
  }

  function carregarReceita(valor) {
    const fimRpc = tempoRpc_("getReceitaData");
    google.script.run
      .withSuccessHandler(function (data) {
        fimRpc();
        receitaAtual = data;
        comparacaoAtual = data.comparacao || null;
        renderReceitaKpis(data);
        renderReceitaSerieMoM_(data, { chartKey: 'receitaFaturamento', chave: 'receita-faturamento', campo: 'faturamento', rotulo: 'Faturamento (produtos)', cor: '--chart-faturamento-bar' });
        renderReceitaSerieMoM_(data, { chartKey: 'receitaCusto', chave: 'receita-custo', campo: 'custoFrete', rotulo: 'Custo (frete)', cor: '--chart-custo-bar' });
        renderReceitaMargem(data);
        renderReceitaCategoriasVariacao(data);
        renderReceitaPareto(data);
        renderReceitaCidadesVariacao(data);
        renderReceitaComposicao(data);
        renderReceitaScatter(data);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] getReceitaData falhou', err);
        document.getElementById('receita-kpi-row').innerHTML = '<p class="error">Erro ao carregar receita: ' + err.message + '</p>';
      })
      .getReceitaData(valor, false);
  }

  function iniciarReceita() {
    if (receitaIniciado) return;
    receitaIniciado = true;
    mesesDisponiveis_(function (opcoes) {
        document.getElementById('receita-mes-selector').innerHTML = opcoes.map(function (v) {
          return '<option value="' + v + '">' + formatMesLabel(v) + '</option>';
        }).join('');
        carregarReceita(opcoes[0]);
      }, function (err) {
        receitaIniciado = false;
        console.error('[dash] getMesesDisponiveis (receita) falhou', err);
        document.getElementById('receita-kpi-row').innerHTML = '<p class="error">Erro ao carregar períodos: ' + err.message + '</p>';
      });
  }

  document.getElementById('receita-mes-selector').addEventListener('change', function (e) {
    carregarReceita(e.target.value);
  });

  // ===== Logística =====
  // Narrativa: resultado → evolução → promessa → gargalo → onde/rotas → custo e impacto → pedidos parados → sinais.
  // Tempos e cumprimento consideram só pedidos entregues. Só carrega na primeira vez que a aba é aberta.

  const LOGISTICA_KPI_CONFIG = [
    { key: 'entregues', label: 'Pedidos entregues', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'pctNoPrazo', label: '% no prazo', format: 'pct', positiveIsGood: true, labelSmall: true },
    { key: 'tempoMediano', label: 'Tempo total (mediana)', format: 'dias', positiveIsGood: false, labelSmall: true },
    { key: 'tempoP90', label: 'Tempo total (P90)', format: 'dias', positiveIsGood: false, labelSmall: true },
    { key: 'freteMedio', label: 'Frete por pedido', format: 'brl', positiveIsGood: false, labelSmall: true },
    { key: 'emAndamento', label: 'Pedidos em andamento', format: 'num', positiveIsGood: false, labelSmall: true }
  ];

  // Limiares PROVISÓRIOS do painel de sinais (bloco 7), até o time de logística definir as metas. Em todos, valor maior = pior.
  // "queda" = queda do cumprimento em p.p. vs. o mês anterior; "alta" = alta relativa de um tempo vs. o mês anterior.
  const LOGISTICA_SINAIS = {
    quedaPrazoPP: { investigar: 2, atencao: 1 },            // queda da % no prazo vs. mês anterior, em p.p.
    tempoAlta: { investigar: 0.10, atencao: 0.05 },         // alta da mediana / do P90 vs. mês anterior
    parados30d: { atencao: 0.25, monitorar: 0.10 },         // % dos pedidos em andamento com mais de 30 dias
    etapaDias: { atencao: 5, monitorar: 2 },                // dias a mais na etapa dos atrasados vs. no prazo
    mercadoPP: { investigar: 8, atencao: 4, monitorar: 2 }, // taxa de atraso do mercado acima da geral, em p.p.
    rotaDias: { atencao: 10, monitorar: 5 },                // dias a mais entre estados vs. dentro do mesmo estado
    notaDiff: { atencao: 1.0, monitorar: 0.5 },             // diferença de nota: no prazo − atraso de 8+ dias
    perdidos: { atencao: 0.05, monitorar: 0.03 }            // % de pedidos cancelados ou indisponíveis no mês
  };

  let logisticaIniciado = false;
  let logisticaAtual = null;
  let sparklineChartsLogistica = {};
  let logisticaEvolucaoModo = 'tempo';
  let logisticaOndeModo = 'mercado';
  let logisticaOndeDim = 'estado';
  let logisticaOndeMetrica = 'tempo';
  let logisticaParadosModo = 'andamento';

  function renderLogisticaKpis(data) {
    const janela = data.janela || [];
    const rotulos = janela.map(function (m) { return formatMesLabel(m.mes); });
    document.getElementById('logistica-kpi-row').innerHTML = LOGISTICA_KPI_CONFIG.map(function (cfg) {
      return htmlKpiCard(cfg, data.kpis[cfg.key], 'spark-logistica-' + cfg.key);
    }).join('');
    ajustarTamanhosKpi('logistica-kpi-row');
    Object.keys(sparklineChartsLogistica).forEach(function (k) { sparklineChartsLogistica[k].destroy(); });
    sparklineChartsLogistica = {};
    LOGISTICA_KPI_CONFIG.forEach(function (cfg) {
      const serie = janela.map(function (m) { return m[cfg.key]; });
      criarSparkline('spark-logistica-' + cfg.key, cfg.key, rotulos, serie, cfg, data.kpis[cfg.key].delta, sparklineChartsLogistica);
    });
  }

  function legendaDinamicaLogistica_(id, itens) {
    document.getElementById(id).innerHTML = itens.map(function (i) {
      return '<div class="chart-legend-item"><span class="chart-legend-swatch" style="background:' + i[0] + '"></span>' + i[1] + '</div>';
    }).join('');
  }

  // Colunas (uma série, eixo esquerdo) + linhas (eixo direito, numa faixa própria no topo para não cruzar as colunas).
  //   o: chartKey, canvasId, tableId, labels, barra { label, dados, cor, texto(v, i) | null }, linhas [{ label, dados, cor, texto(v), rotulos: 'todos'|'ativo'|'nenhum', tracejada }],
  //      ativo (índice do ponto em destaque), tooltip(i) → linhas, colunas, linhasTabela, tetoBarra
  function graficoComboLogistica_(o) {
    if (charts[o.chartKey]) charts[o.chartKey].destroy();
    const todosLinha = [].concat.apply([], o.linhas.map(function (l) { return l.dados; }));
    const minL = Math.min.apply(null, todosLinha.concat([Infinity]).filter(function (v) { return isFinite(v); }));
    const maxL = Math.max.apply(null, todosLinha.concat([0]));
    const faixa = (maxL - minL) || Math.max(maxL * 0.2, 0.01);
    const y1Max = maxL + faixa * 0.14;
    const y1Min = y1Max - faixa / 0.36;
    const maxB = Math.max.apply(null, o.barra.dados.concat([0.0001]));
    const datasets = [{
      type: 'bar', label: o.barra.label, data: o.barra.dados, backgroundColor: o.barra.cor, maxBarThickness: 44, yAxisID: 'y', order: 2,
      datalabels: o.barra.texto
        ? { display: true, anchor: 'end', align: o.barra.dentro ? 'start' : 'top', offset: o.barra.dentro ? 4 : 3, color: o.barra.dentro ? '#ffffff' : cssVar('--text-primary'), font: { size: 9, weight: '600' }, formatter: function (v, ctx) { return o.barra.texto(v, ctx.dataIndex); } }
        : { display: false }
    }].concat(o.linhas.map(function (l) {
      return {
        type: 'line', label: l.label, data: l.dados, borderColor: l.cor, backgroundColor: l.cor, borderWidth: l.tracejada ? 1.5 : 2, borderDash: l.tracejada ? [5, 4] : [],
        pointRadius: function (ctx) { return ctx.dataIndex === o.ativo ? 5 : 3; }, tension: 0, yAxisID: 'y1', order: 1,
        datalabels: l.rotulos === 'nenhum' ? { display: false } : {
          display: function (ctx) { return l.rotulos === 'todos' || ctx.dataIndex === o.ativo; },
          anchor: 'end', align: l.alinhamento || 'top', offset: 5, clamp: true, color: l.cor, font: { size: 10, weight: '600' }, formatter: function (v) { return l.texto(v); }
        }
      };
    }));
    charts[o.chartKey] = new Chart(document.getElementById(o.canvasId), {
      type: 'bar',
      data: { labels: o.labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18, right: 8 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              title: function (items) { return o.labels[items[0].dataIndex]; },
              label: function (ctx) { return ctx.datasetIndex === 0 ? o.tooltip(ctx.dataIndex) : ''; }
            },
            filter: function (item) { return item.datasetIndex === 0; }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { font: { size: 10 }, callback: function (v) { const n = this.getLabelForValue(v); return n.length > 22 ? n.slice(0, 21) + '…' : n; } } },
          y: { position: 'left', beginAtZero: true, max: maxB * (o.tetoBarra || 2.3), grid: { color: cssVar('--gridline'), borderDash: [4, 4] }, border: { display: false }, ticks: { display: false, count: 3 } },
          y1: { type: 'linear', position: 'right', min: y1Min, max: y1Max, grid: { display: false }, border: { display: false }, ticks: { display: false } }
        }
      }
    });
    renderTable(o.tableId, o.colunas, o.linhasTabela);
  }

  const diasTxt_ = function (v) { return formatNum(v, 1) + ' d'; };
  const difTxt_ = function (a, b) { return (b - a >= 0 ? '+' : '−') + formatNum(Math.abs(b - a), 1); };

  // Bloco 1 — volume (colunas) + tempo (mediana e P90) ou cumprimento (% no prazo).
  function renderLogisticaEvolucao(data) {
    const j = data.janela || [];
    const rot = j.map(function (r) { return formatMesLabel(r.mes); });
    const ativo = j.map(function (r) { return r.mes; }).indexOf(data.periodo);
    const navy = cssVar('--chart-evolucao-bar'), laranja = cssVar('--series-2'), claro = cssVar('--perfil-media');
    const tempo = logisticaEvolucaoModo === 'tempo';
    legendaDinamicaLogistica_('logistica-evolucao-legenda', [[claro, 'Pedidos do mês']].concat(tempo
      ? [[navy, 'Mediana do tempo total (dias)'], [laranja, 'P90 do tempo total (dias)']]
      : [[navy, '% de pedidos entregues no prazo']]));
    graficoComboLogistica_({
      chartKey: 'logisticaEvolucao', canvasId: 'chart-logistica-evolucao', tableId: 'table-logistica-evolucao', labels: rot, ativo: ativo,
      barra: { label: 'Pedidos', dados: j.map(function (r) { return r.pedidos; }), cor: claro, texto: function (v) { return formatNum(v); }, dentro: true },
      linhas: tempo
        ? [{ label: 'Mediana (dias)', dados: j.map(function (r) { return r.tempoMediano; }), cor: navy, texto: diasTxt_, rotulos: 'todos', alinhamento: 'bottom' },
           { label: 'P90 (dias)', dados: j.map(function (r) { return r.tempoP90; }), cor: laranja, texto: diasTxt_, rotulos: 'todos' }]
        : [{ label: '% no prazo', dados: j.map(function (r) { return r.pctNoPrazo; }), cor: navy, texto: function (v) { return formatPct(v); }, rotulos: 'todos' }],
      tooltip: function (i) {
        const r = j[i];
        return ['Pedidos: ' + formatNum(r.pedidos) + ' (entregues: ' + formatNum(r.entregues) + ')', 'Tempo total: mediana ' + diasTxt_(r.tempoMediano) + ' · P90 ' + diasTxt_(r.tempoP90), '% no prazo: ' + formatPct(r.pctNoPrazo)];
      },
      colunas: [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Pedidos', num: true, render: function (r) { return formatNum(r.pedidos); } },
        { label: 'Entregues', num: true, render: function (r) { return formatNum(r.entregues); } },
        { label: '% no prazo', num: true, render: function (r) { return formatPct(r.pctNoPrazo); } },
        { label: 'Mediana (dias)', num: true, render: function (r) { return formatNum(r.tempoMediano, 1); } },
        { label: 'P90 (dias)', num: true, render: function (r) { return formatNum(r.tempoP90, 1); } }
      ],
      linhasTabela: j
    });
  }

  // Bloco 2A — desvio entre a entrega real e a data estimada, com a % acumulada dos pedidos (linha verde).
  function renderLogisticaDesvio(data) {
    const f = data.prazo.faixas || [];
    const navy = cssVar('--chart-evolucao-bar'), medio = cssVar('--perfil-volume'), claro = cssVar('--perfil-media'), verde = cssVar('--chart-faturamento-bar');
    let ac = 0;
    const acumulado = f.map(function (x) { ac += x.pct; return Math.min(ac, 1); });
    graficoComboLogistica_({
      chartKey: 'logisticaDesvio', canvasId: 'chart-logistica-desvio', tableId: 'table-logistica-desvio', labels: f.map(function (x) { return x.nome; }), ativo: -1,
      barra: { label: 'Pedidos', dados: f.map(function (x) { return x.pedidos; }), cor: f.map(function (_, i) { return i < 3 ? claro : (i === 3 ? medio : navy); }),
        texto: function (v, i) { return formatNum(v) + ' · ' + formatPct(f[i].pct); } },
      linhas: [{ label: '% acumulada', dados: acumulado, cor: verde, texto: function (v) { return formatPct(v); }, rotulos: 'todos' }],
      tooltip: function (i) { return ['Pedidos: ' + formatNum(f[i].pedidos) + ' (' + formatPct(f[i].pct) + ' dos entregues)', 'Acumulado até esta faixa: ' + formatPct(acumulado[i])]; },
      colunas: [
        { label: 'Desvio (entrega real − data estimada)', render: function (x) { return x.nome; } },
        { label: 'Pedidos', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: '% dos entregues', num: true, render: function (x) { return formatPct(x.pct); } },
        { label: '% acumulada', num: true, render: function (x) { return formatPct(acumulado[f.indexOf(x)]); } }
      ],
      linhasTabela: f
    });
  }

  // Bloco 2B — folga do prazo: prometido × realizado por região.
  function renderLogisticaFolga(data) {
    const r = data.prazo.folgaRegiao || [];
    graficoBarrasAgrupadasVendas_({
      chartKey: 'logisticaFolga', canvasId: 'chart-logistica-folga', tableId: 'table-logistica-folga',
      labels: r.map(function (x) { return x.nome; }),
      series: [
        { label: 'Prometido', data: r.map(function (x) { return x.prometido; }), cor: cssVar('--perfil-media'), texto: diasTxt_ },
        { label: 'Realizado', data: r.map(function (x) { return x.realizado; }), cor: cssVar('--chart-evolucao-bar'), texto: diasTxt_ }
      ],
      tooltip: function (i) { const x = r[i]; return ['Prometido: ' + diasTxt_(x.prometido), 'Realizado: ' + diasTxt_(x.realizado), 'Folga: ' + formatNum(x.prometido - x.realizado, 1) + ' dias', 'Pedidos entregues: ' + formatNum(x.pedidos)]; },
      colunas: [
        { label: 'Região do cliente', render: function (x) { return x.nome; } },
        { label: 'Pedidos entregues', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: 'Prazo prometido (dias)', num: true, render: function (x) { return formatNum(x.prometido, 1); } },
        { label: 'Tempo realizado (dias)', num: true, render: function (x) { return formatNum(x.realizado, 1); } },
        { label: 'Folga (dias)', num: true, render: function (x) { return formatNum(x.prometido - x.realizado, 1); } }
      ],
      linhas: r
    });
  }

  // Bloco 3A — tempo médio em cada etapa: pedidos no prazo × atrasados.
  function renderLogisticaEtapas(data) {
    const e = data.gargalo.etapas;
    const etapas = [{ nome: 'Aprovação do pedido', campo: 'aprovacao' }, { nome: 'Processamento até o envio', campo: 'processamento' }, { nome: 'Transporte até o cliente', campo: 'transporte' }];
    graficoBarrasAgrupadasVendas_({
      chartKey: 'logisticaEtapas', canvasId: 'chart-logistica-etapas', tableId: 'table-logistica-etapas', horizontal: true,
      labels: etapas.map(function (x) { return x.nome; }),
      series: [
        { label: 'No prazo', data: etapas.map(function (x) { return e.noPrazo[x.campo]; }), cor: cssVar('--perfil-media'), texto: diasTxt_ },
        { label: 'Atrasados', data: etapas.map(function (x) { return e.atrasados[x.campo]; }), cor: cssVar('--chart-evolucao-bar'), texto: diasTxt_ }
      ],
      tooltip: function (i) {
        const x = etapas[i], a = e.noPrazo[x.campo], b = e.atrasados[x.campo];
        return ['No prazo: ' + diasTxt_(a) + ' (' + formatNum(e.noPrazo.pedidos) + ' pedidos)', 'Atrasados: ' + diasTxt_(b) + ' (' + formatNum(e.atrasados.pedidos) + ' pedidos)', 'Diferença: ' + difTxt_(a, b) + ' dias'];
      },
      colunas: [
        { label: 'Etapa', render: function (x) { return x.nome; } },
        { label: 'No prazo (dias)', num: true, render: function (x) { return formatNum(x.a, 1); } },
        { label: 'Atrasados (dias)', num: true, render: function (x) { return formatNum(x.b, 1); } },
        { label: 'Diferença (dias)', num: true, render: function (x) { return difTxt_(x.a, x.b); } }
      ],
      linhas: etapas.map(function (x) { return { nome: x.nome, a: e.noPrazo[x.campo], b: e.atrasados[x.campo] }; })
        .concat([{ nome: 'Total (pedido → cliente)', a: e.noPrazo.total, b: e.atrasados.total }, { nome: 'Prazo prometido (médio)', a: e.noPrazo.prometido, b: e.atrasados.prometido }])
    });
  }

  // Bloco 3B — distribuição do tempo total, com a faixa da mediana e do P90 marcadas e a % acumulada (linha verde).
  function renderLogisticaTempo(data) {
    const g = data.gargalo, f = g.distribuicao || [];
    const faixaDe = function (d) { return d <= 7 ? 0 : (d <= 14 ? 1 : (d <= 21 ? 2 : (d <= 30 ? 3 : 4))); };
    const iMed = faixaDe(g.mediana), iP90 = faixaDe(g.p90);
    const navy = cssVar('--chart-evolucao-bar'), verde = cssVar('--chart-faturamento-bar');
    let ac = 0;
    const acumulado = f.map(function (x) { ac += x.pct; return Math.min(ac, 1); });
    graficoComboLogistica_({
      chartKey: 'logisticaTempo', canvasId: 'chart-logistica-tempo', tableId: 'table-logistica-tempo', labels: f.map(function (x) { return x.nome; }), ativo: -1,
      barra: { label: 'Pedidos', dados: f.map(function (x) { return x.pedidos; }), cor: f.map(function (_, i) { return i === iMed || i === iP90 ? navy : cssVar('--perfil-media'); }),
        texto: function (v, i) { return formatNum(v) + ' · ' + formatPct(f[i].pct) + (i === iMed ? ' · mediana' : '') + (i === iP90 ? ' · P90' : ''); } },
      linhas: [{ label: '% acumulada', dados: acumulado, cor: verde, texto: function (v) { return formatPct(v); }, rotulos: 'todos' }],
      tooltip: function (i) { return ['Pedidos: ' + formatNum(f[i].pedidos) + ' (' + formatPct(f[i].pct) + ' dos entregues)', 'Acumulado até esta faixa: ' + formatPct(acumulado[i]), 'Mediana do mês: ' + diasTxt_(g.mediana), 'P90 do mês: ' + diasTxt_(g.p90)]; },
      colunas: [
        { label: 'Tempo total (pedido → cliente)', render: function (x) { return x.nome; } },
        { label: 'Pedidos', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: '% dos entregues', num: true, render: function (x) { return formatPct(x.pct); } },
        { label: '% acumulada', num: true, render: function (x) { return formatPct(acumulado[f.indexOf(x)]); } }
      ],
      linhasTabela: f
    });
  }

  // Bloco 4 — mercado (colunas de volume + linha da métrica) ou rotas (matriz origem → destino).
  function renderLogisticaOnde(data) {
    const rotas = logisticaOndeModo === 'rotas';
    document.getElementById('logistica-onde-dim').hidden = rotas;
    document.getElementById('logistica-onde-legenda').hidden = rotas;
    const visual = document.querySelector('.chart-visual[data-visual="logistica-onde"]');
    visual.classList.toggle('chart-visual--auto', rotas);
    document.getElementById('chart-logistica-onde').hidden = rotas;
    document.getElementById('logistica-rotas-visual').hidden = !rotas;
    document.getElementById('logistica-onde-chips').hidden = !rotas;
    if (rotas) renderLogisticaRotas_(data); else renderLogisticaMercado_(data);
  }

  const LOGISTICA_METRICA_ROTULO = { tempo: 'Tempo total médio (dias)', prazo: '% entregue no prazo' };
  function valorMetricaLogistica_(g, metrica) { return metrica === 'tempo' ? g.total : (g.pedidos > 0 ? 1 - g.atrasados / g.pedidos : 0); }
  function textoMetricaLogistica_(v, metrica) { return metrica === 'tempo' ? diasTxt_(v) : formatPct(v); }

  function renderLogisticaMercado_(data) {
    const m = data.mercados, metrica = logisticaOndeMetrica;
    const nomes = { estado: 'Estado do cliente', cidade: 'Cidade do cliente', regiao: 'Região do cliente', categoria: 'Categoria', valor: 'Faixa de valor do pedido', itens: 'Itens no pedido' };
    const naturais = { valor: true, itens: true };
    let lista = (m[logisticaOndeDim] || []).filter(function (g) { return g.pedidos >= m.minPedidos; });
    if (!naturais[logisticaOndeDim]) lista = lista.slice().sort(function (a, b) { return b.pedidos - a.pedidos; }).slice(0, 10);
    const laranja = cssVar('--series-2');
    legendaDinamicaLogistica_('logistica-onde-legenda', [[cssVar('--perfil-media'), 'Pedidos entregues (volume)'], [laranja, LOGISTICA_METRICA_ROTULO[metrica]]]);
    document.getElementById('logistica-onde-legenda').hidden = false;
    graficoComboLogistica_({
      chartKey: 'logisticaOnde', canvasId: 'chart-logistica-onde', tableId: 'table-logistica-onde', labels: lista.map(function (g) { return g.nome; }), ativo: -1,
      barra: { label: 'Pedidos', dados: lista.map(function (g) { return g.pedidos; }), cor: cssVar('--perfil-media'), texto: function (v) { return formatNum(v); } },
      linhas: [{ label: LOGISTICA_METRICA_ROTULO[metrica], dados: lista.map(function (g) { return valorMetricaLogistica_(g, metrica); }), cor: laranja, texto: function (v) { return textoMetricaLogistica_(v, metrica); }, rotulos: 'todos' }],
      tooltip: function (i) {
        const g = lista[i];
        return ['Pedidos entregues: ' + formatNum(g.pedidos), 'Tempo total médio: ' + diasTxt_(g.total) + ' (transporte ' + diasTxt_(g.transporte) + ')', '% no prazo: ' + formatPct(g.pedidos > 0 ? 1 - g.atrasados / g.pedidos : 0), 'Atrasados: ' + formatNum(g.atrasados)];
      },
      colunas: [
        { label: nomes[logisticaOndeDim], render: function (g) { return g.nome; } },
        { label: 'Pedidos entregues', num: true, render: function (g) { return formatNum(g.pedidos); } },
        { label: '% no prazo', num: true, render: function (g) { return formatPct(g.pedidos > 0 ? 1 - g.atrasados / g.pedidos : 0); } },
        { label: 'Tempo total (dias)', num: true, render: function (g) { return formatNum(g.total, 1); } },
        { label: 'Transporte (dias)', num: true, render: function (g) { return formatNum(g.transporte, 1); } },
        { label: 'Frete médio (R$)', num: true, render: function (g) { return formatBRLCheio(g.frete); } }
      ],
      linhasTabela: lista
    });
    document.getElementById('logistica-onde-chips').innerHTML = '';
  }

  function renderLogisticaRotas_(data) {
    if (charts.logisticaOnde) { charts.logisticaOnde.destroy(); charts.logisticaOnde = null; }
    const r = data.rotas, metrica = logisticaOndeMetrica;
    const celula = function (o, d) { return r.celulas.filter(function (c) { return c.origem === o && c.destino === d; })[0]; };
    const valorDe = function (c) { return c && c.pedidos >= r.minPedidos ? (metrica === 'tempo' ? c.total : 1 - c.atrasados / c.pedidos) : 0; };
    const linhas = r.origens.map(function (o) { return { rotulo: o, valores: r.destinos.map(function (d) { return valorDe(celula(o, d)); }), origem: o }; });
    document.getElementById('logistica-rotas-visual').innerHTML = htmlMapaCalor_(linhas, r.destinos,
      function (v) { return textoMetricaLogistica_(v, metrica); },
      function (l, i) { const c = celula(l.origem, r.destinos[i]); return c && c.pedidos >= r.minPedidos ? formatNum(c.pedidos) + ' pedidos' : ''; });
    const chip = function (rotulo, valor, sub) { return '<div class="conc-chip"><span class="conc-chip-rotulo">' + rotulo + '</span><span class="conc-chip-valor">' + valor + '</span><span class="conc-chip-sub">' + sub + '</span></div>'; };
    const linhaChip = function (nome, a) {
      return chip(nome, diasTxt_(a.total), formatNum(a.pedidos) + ' pedidos · ' + formatPct(a.pedidos > 0 ? 1 - a.atrasados / a.pedidos : 0) + ' no prazo');
    };
    document.getElementById('logistica-onde-chips').innerHTML = linhaChip('Dentro do mesmo estado', r.mesmoEstado) + linhaChip('Entre estados', r.entreEstados);
    const celulas = r.celulas.filter(function (c) { return c.pedidos >= r.minPedidos; });
    renderTable('table-logistica-onde',
      [
        { label: 'Estado do vendedor (origem)', render: function (c) { return c.origem; } },
        { label: 'Estado do cliente (destino)', render: function (c) { return c.destino; } },
        { label: 'Pedidos entregues', num: true, render: function (c) { return formatNum(c.pedidos); } },
        { label: '% no prazo', num: true, render: function (c) { return formatPct(1 - c.atrasados / c.pedidos); } },
        { label: 'Tempo total (dias)', num: true, render: function (c) { return formatNum(c.total, 1); } }
      ],
      celulas
    );
  }

  // Bloco 5A — frete médio (colunas) e tempo total (linha) por região.
  function renderLogisticaCusto(data) {
    const c = data.custo || [];
    const laranja = cssVar('--series-2');
    graficoComboLogistica_({
      chartKey: 'logisticaCusto', canvasId: 'chart-logistica-custo', tableId: 'table-logistica-custo', labels: c.map(function (x) { return x.nome; }), ativo: -1,
      barra: { label: 'Frete médio', dados: c.map(function (x) { return x.frete; }), cor: cssVar('--perfil-media'), texto: function (v) { return 'R$ ' + formatNum(v, 2); } },
      linhas: [{ label: 'Tempo total (dias)', dados: c.map(function (x) { return x.total; }), cor: laranja, texto: diasTxt_, rotulos: 'todos' }],
      tooltip: function (i) { const x = c[i]; return ['Frete médio: ' + formatBRLCheio(x.frete), 'Tempo total médio: ' + diasTxt_(x.total), 'Transporte médio: ' + diasTxt_(x.transporte), 'Pedidos entregues: ' + formatNum(x.pedidos)]; },
      colunas: [
        { label: 'Região do cliente', render: function (x) { return x.nome; } },
        { label: 'Pedidos entregues', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: 'Frete médio (R$)', num: true, render: function (x) { return formatBRLCheio(x.frete); } },
        { label: 'Tempo total (dias)', num: true, render: function (x) { return formatNum(x.total, 1); } },
        { label: 'Transporte (dias)', num: true, render: function (x) { return formatNum(x.transporte, 1); } }
      ],
      linhasTabela: c
    });
  }

  // Bloco 5B — nota média (colunas) e % de notas 1 ou 2 (linha) por nível de cumprimento.
  function renderLogisticaImpacto(data) {
    const n = data.impacto || [];
    graficoComboLogistica_({
      chartKey: 'logisticaImpacto', canvasId: 'chart-logistica-impacto', tableId: 'table-logistica-impacto', labels: n.map(function (x) { return x.nome; }), ativo: -1,
      barra: { label: 'Nota média', dados: n.map(function (x) { return x.nota; }), cor: cssVar('--chart-evolucao-bar'), texto: function (v) { return formatNum(v, 2); } },
      linhas: [{ label: '% notas 1 ou 2', dados: n.map(function (x) { return x.baixas; }), cor: cssVar('--series-2'), texto: function (v) { return formatPct(v); }, rotulos: 'todos' }],
      tooltip: function (i) { const x = n[i]; return ['Nota média: ' + formatNum(x.nota, 2) + ' / 5', '% de notas 1 ou 2: ' + formatPct(x.baixas), 'Avaliações: ' + formatNum(x.avaliacoes) + ' (últimos 12 meses)']; },
      colunas: [
        { label: 'Nível de cumprimento', render: function (x) { return x.nome; } },
        { label: 'Avaliações', num: true, render: function (x) { return formatNum(x.avaliacoes); } },
        { label: 'Nota média', num: true, render: function (x) { return formatNum(x.nota, 2); } },
        { label: '% de notas 1 ou 2', num: true, render: function (x) { return formatPct(x.baixas); } }
      ],
      linhasTabela: n
    });
  }

  // Bloco 6 — pedidos em andamento por idade e status, ou pedidos cancelados e indisponíveis mês a mês (barras empilhadas).
  function renderLogisticaParados(data) {
    if (charts.logisticaParados) charts.logisticaParados.destroy();
    const andamento = logisticaParadosModo === 'andamento';
    const navy = cssVar('--chart-evolucao-bar');
    let labels, series, colunas, linhasTabela;
    if (andamento) {
      const a = data.andamento;
      labels = a.faixas;
      series = a.status.map(function (s, k) {
        return { nome: s, cor: hexParaRgba_(navy, [0.3, 0.5, 0.7, 0.85, 1][k % 5]), dados: a.faixas.map(function (_, f) {
          return a.celulas.filter(function (c) { return c.status === s && c.faixa === f; }).reduce(function (t, c) { return t + c.pedidos; }, 0);
        }) };
      }).filter(function (s) { return s.dados.some(function (v) { return v > 0; }); });
      colunas = [{ label: 'Idade do pedido', render: function (l) { return l.nome; } }].concat(series.map(function (s, k) { return { label: s.nome, num: true, render: function (l) { return formatNum(l.v[k]); } }; }))
        .concat([{ label: 'Total', num: true, render: function (l) { return formatNum(l.v.reduce(function (t, x) { return t + x; }, 0)); } }]);
      linhasTabela = labels.map(function (nome, i) { return { nome: nome, v: series.map(function (s) { return s.dados[i]; }) }; });
    } else {
      const j = data.janela || [];
      labels = j.map(function (r) { return formatMesLabel(r.mes); });
      series = [
        { nome: 'Cancelados', cor: navy, dados: j.map(function (r) { return r.cancelados; }) },
        { nome: 'Indisponíveis', cor: cssVar('--perfil-media'), dados: j.map(function (r) { return r.indisponiveis; }) }
      ];
      colunas = [{ label: 'Mês', render: function (l) { return l.nome; } }, { label: 'Cancelados', num: true, render: function (l) { return formatNum(l.v[0]); } },
        { label: 'Indisponíveis', num: true, render: function (l) { return formatNum(l.v[1]); } }, { label: '% dos pedidos do mês', num: true, render: function (l) { return formatPct(l.pct); } }];
      linhasTabela = labels.map(function (nome, i) { return { nome: nome, v: [j[i].cancelados, j[i].indisponiveis], pct: j[i].pedidos > 0 ? (j[i].cancelados + j[i].indisponiveis) / j[i].pedidos : 0 }; });
    }
    legendaDinamicaLogistica_('logistica-parados-legenda', series.map(function (s) { return [s.cor, s.nome]; }));
    const totais = labels.map(function (_, i) { return series.reduce(function (t, s) { return t + s.dados[i]; }, 0); });
    charts.logisticaParados = new Chart(document.getElementById('chart-logistica-parados'), {
      type: 'bar',
      data: { labels: labels, datasets: series.map(function (s) { return { label: s.nome, data: s.dados, backgroundColor: s.cor, maxBarThickness: 56, datalabels: { display: false } }; }) },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: { mode: 'index', intersect: false, callbacks: { label: function (ctx) { return ctx.dataset.label + ': ' + formatNum(ctx.parsed.y); }, footer: function (items) { return 'Total: ' + formatNum(totais[items[0].dataIndex]); } } }
        },
        scales: { x: { stacked: true, grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { font: { size: 10 } } }, y: { stacked: true, display: false, beginAtZero: true } }
      },
      plugins: [{
        id: 'logisticaParadosTotais',
        afterDatasetsDraw: function (chart) {
          const ctx = chart.ctx;
          ctx.save(); ctx.fillStyle = cssVar('--text-primary'); ctx.font = '600 10px Inter, sans-serif'; ctx.textAlign = 'center';
          labels.forEach(function (_, i) {
            const topo = Math.min.apply(null, chart.data.datasets.map(function (__, k) { return chart.getDatasetMeta(k).data[i].y; }));
            ctx.fillText(formatNum(totais[i]), chart.getDatasetMeta(0).data[i].x, topo - 5);
          });
          ctx.restore();
        }
      }]
    });
    renderTable('table-logistica-parados', colunas, linhasTabela);
  }

  // Bloco 7 — painel de sinais logísticos (cards + tabela).
  const LOGISTICA_STATUS = {
    investigar: { rotulo: 'Investigar', ordem: 0 }, atencao: { rotulo: 'Atenção', ordem: 1 },
    monitorar: { rotulo: 'Monitorar', ordem: 2 }, ok: { rotulo: 'Sem alerta', ordem: 3 }
  };
  function statusLogisticaNivel_(v, cfg) {
    return cfg.investigar !== undefined && v >= cfg.investigar ? 'investigar' : (cfg.atencao !== undefined && v >= cfg.atencao ? 'atencao' : (cfg.monitorar !== undefined && v >= cfg.monitorar ? 'monitorar' : 'ok'));
  }

  function montarSinaisLogistica_(data) {
    const k = data.kpis, sinais = [];
    const add = function (dimensao, sinal, indicador, referencia, status) { sinais.push({ dimensao: dimensao, sinal: sinal, indicador: indicador, referencia: referencia, status: status }); };

    // Evolução
    const quedaPP = k.pctNoPrazo.valorAnterior == null ? null : (k.pctNoPrazo.valorAnterior - k.pctNoPrazo.valor) * 100;
    add('Cumprimento', '% entregue no prazo vs. ' + rotuloMesAnt_(), formatPct(k.pctNoPrazo.valor), quedaPP == null ? 'Sem mês anterior' : '' + capMesAnt_() + ': ' + formatPct(k.pctNoPrazo.valorAnterior) + ' (' + formatPP(-quedaPP) + ')',
      quedaPP == null ? 'ok' : statusLogisticaNivel_(quedaPP, LOGISTICA_SINAIS.quedaPrazoPP));
    [['tempoMediano', 'Tempo total (mediana)'], ['tempoP90', 'Tempo total (P90)']].forEach(function (par) {
      const x = k[par[0]];
      add('Velocidade', par[1] + ' vs. ' + rotuloMesAnt_(), diasTxt_(x.valor), x.valorAnterior == null ? 'Sem mês anterior' : '' + capMesAnt_() + ': ' + diasTxt_(x.valorAnterior) + ' (' + formatMoM(x.delta) + ')',
        x.delta == null ? 'ok' : statusLogisticaNivel_(x.delta, LOGISTICA_SINAIS.tempoAlta));
    });

    // Etapa que mais acompanha o atraso
    const e = data.gargalo.etapas;
    const etapas = [['Aprovação', 'aprovacao'], ['Processamento até o envio', 'processamento'], ['Transporte', 'transporte']]
      .map(function (x) { return { nome: x[0], dif: e.atrasados[x[1]] - e.noPrazo[x[1]] }; }).sort(function (a, b) { return b.dif - a.dif; });
    add('Gargalo', 'Etapa em que os pedidos atrasados mais se afastam dos pedidos no prazo', etapas[0].nome + ': ' + difTxt_(0, etapas[0].dif) + ' dias',
      'Atrasados: ' + diasTxt_(e.atrasados.total) + ' no total · no prazo: ' + diasTxt_(e.noPrazo.total), statusLogisticaNivel_(etapas[0].dif, LOGISTICA_SINAIS.etapaDias));

    // Mercado com pior cumprimento
    const min = data.mercados.minPedidos;
    const geral = 1 - k.pctNoPrazo.valor;
    const estados = (data.mercados.estado || []).filter(function (g) { return g.pedidos >= min; })
      .map(function (g) { return { nome: g.nome, taxa: g.atrasados / g.pedidos, pedidos: g.pedidos }; }).sort(function (a, b) { return b.taxa - a.taxa; });
    if (estados.length) {
      const pp = (estados[0].taxa - geral) * 100;
      add('Mercado', 'Estado com maior taxa de atraso', estados[0].nome + ': ' + formatPct(estados[0].taxa), 'Geral: ' + formatPct(geral) + ' (' + formatPP(pp) + ') · ' + formatNum(estados[0].pedidos) + ' pedidos', statusLogisticaNivel_(pp, LOGISTICA_SINAIS.mercadoPP));
    }

    // Rotas: entre estados × dentro do mesmo estado
    const r = data.rotas;
    if (r.mesmoEstado.pedidos >= min && r.entreEstados.pedidos >= min) {
      const dif = r.entreEstados.total - r.mesmoEstado.total;
      add('Rotas', 'Tempo total entre estados vs. dentro do mesmo estado', '+' + formatNum(dif, 1) + ' dias', 'Entre estados: ' + diasTxt_(r.entreEstados.total) + ' · mesmo estado: ' + diasTxt_(r.mesmoEstado.total), statusLogisticaNivel_(dif, LOGISTICA_SINAIS.rotaDias));
    }

    // Custo: informativo (frete)
    // Impacto na nota: no prazo × atraso de 8 dias ou mais
    const n = data.impacto;
    const av = n[2].avaliacoes + n[3].avaliacoes;
    if (n[0].avaliacoes > 0 && av > 0) {
      const notaAtraso = (n[2].nota * n[2].avaliacoes + n[3].nota * n[3].avaliacoes) / av;
      const dif = n[0].nota - notaAtraso;
      add('Cliente', 'Nota média: entregas no prazo × atrasos de 8 dias ou mais', formatNum(notaAtraso, 2) + ' vs. ' + formatNum(n[0].nota, 2), 'Diferença de ' + formatNum(dif, 2) + ' pontos · ' + formatNum(av) + ' avaliações de pedidos muito atrasados (12 meses)', statusLogisticaNivel_(dif, LOGISTICA_SINAIS.notaDiff));
    }

    // Pedidos parados
    const a = data.andamento;
    const totalA = a.celulas.reduce(function (t, c) { return t + c.pedidos; }, 0);
    const velhos = a.celulas.filter(function (c) { return c.faixa === 3; }).reduce(function (t, c) { return t + c.pedidos; }, 0);
    if (totalA > 0) add('Parados', 'Pedidos em andamento há mais de 30 dias', formatNum(velhos), formatPct(velhos / totalA) + ' dos ' + formatNum(totalA) + ' pedidos em andamento', statusLogisticaNivel_(velhos / totalA, LOGISTICA_SINAIS.parados30d));

    // Perdidos
    const ult = (data.janela || []).filter(function (x) { return x.mes === data.periodo; })[0];
    if (ult && ult.pedidos > 0) {
      const p = (ult.cancelados + ult.indisponiveis) / ult.pedidos;
      add('Pedidos', 'Pedidos cancelados ou indisponíveis no mês', formatPct(p), formatNum(ult.cancelados + ult.indisponiveis) + ' de ' + formatNum(ult.pedidos) + ' pedidos', statusLogisticaNivel_(p, LOGISTICA_SINAIS.perdidos));
    }
    return sinais.sort(function (a, b) { return LOGISTICA_STATUS[a.status].ordem - LOGISTICA_STATUS[b.status].ordem; });
  }

  // Cards grandes: em cada dimensão (estado, cidade, categoria, faixa de valor e rota), o mercado com a maior taxa de atraso do mês.
  function renderLogisticaAtrasoCards(data) {
    const min = data.mercados.minPedidos, geral = 1 - data.kpis.pctNoPrazo.valor;
    const cards = [];
    const pior = function (lista) {
      return (lista || []).filter(function (g) { return g.pedidos >= min; })
        .map(function (g) { return { nome: g.nome, taxa: g.atrasados / g.pedidos, pedidos: g.pedidos, atrasados: g.atrasados }; })
        .sort(function (a, b) { return b.taxa - a.taxa; })[0];
    };
    [['estado', 'Estado do cliente'], ['cidade', 'Cidade do cliente'], ['categoria', 'Categoria'], ['valor', 'Faixa de valor do pedido']].forEach(function (par) {
      const p = pior(data.mercados[par[0]]);
      if (p) cards.push({ dim: par[1], nome: p.nome, taxa: p.taxa, pedidos: p.pedidos, atrasados: p.atrasados });
    });
    const rota = pior((data.rotas.celulas || []).map(function (c) { return { nome: c.origem + ' → ' + c.destino, pedidos: c.pedidos, atrasados: c.atrasados }; }));
    if (rota) cards.push({ dim: 'Rota (vendedor → cliente)', nome: rota.nome, taxa: rota.taxa, pedidos: rota.pedidos, atrasados: rota.atrasados });
    document.getElementById('logistica-atraso-cards').innerHTML = cards.map(function (x) {
      const pp = (x.taxa - geral) * 100;
      const status = statusLogisticaNivel_(pp, LOGISTICA_SINAIS.mercadoPP);
      return '<div class="sinal-card sinal-card--grande sinal-card--' + status + '">' +
        '<div class="sinal-card-topo"><span class="sinal-card-dim">' + x.dim + '</span><span class="sinal sinal--' + status + '">' + LOGISTICA_STATUS[status].rotulo + '</span></div>' +
        '<div class="sinal-card-valor">' + formatPct(x.taxa) + '</div>' +
        '<div class="sinal-card-texto">' + x.nome + '</div>' +
        '<div class="sinal-card-ref">' + formatNum(x.atrasados) + ' de ' + formatNum(x.pedidos) + ' pedidos atrasados · taxa geral ' + formatPct(geral) + ' (' + formatPP(pp) + ')</div></div>';
    }).join('');
  }

  const LOGISTICA_SINAIS_CARDS = 6;
  function renderLogisticaSinais(data) {
    const sinais = montarSinaisLogistica_(data);
    document.getElementById('logistica-sinais-cards').innerHTML = sinais.slice(0, LOGISTICA_SINAIS_CARDS).map(function (s) {

        '<div class="sinal-card-valor">' + s.indicador + '</div>' +
        '<div class="sinal-card-texto">' + s.sinal + '</div>' +
        '<div class="sinal-card-ref">' + s.referencia + '</div></div>';
    }).join('');
    renderTable('table-logistica-sinais',
      [
        { label: 'Dimensão', render: function (s) { return s.dimensao; } },
        { label: 'Sinal', render: function (s) { return s.sinal; } },

  }

  function ligarToggleLogistica_(toggleId, atributo, definir, redesenhar) {
    document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!logisticaAtual) return;
        document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        definir(btn.dataset[atributo]);
        redesenhar(logisticaAtual);
      });
    });
  }
  ligarToggleLogistica_('logistica-evolucao-toggle', 'modo', function (v) { logisticaEvolucaoModo = v; }, renderLogisticaEvolucao);
  ligarToggleLogistica_('logistica-onde-modo-toggle', 'modo', function (v) { logisticaOndeModo = v; }, renderLogisticaOnde);
  ligarToggleLogistica_('logistica-onde-dim-toggle', 'dim', function (v) { logisticaOndeDim = v; }, renderLogisticaOnde);
  ligarToggleLogistica_('logistica-onde-metrica-toggle', 'metrica', function (v) { logisticaOndeMetrica = v; }, renderLogisticaOnde);
  ligarToggleLogistica_('logistica-parados-toggle', 'modo', function (v) { logisticaParadosModo = v; }, renderLogisticaParados);

  function carregarLogistica(valor) {
    const fimRpc = tempoRpc_("getLogisticaData");
    google.script.run
      .withSuccessHandler(function (data) {
        fimRpc();
        logisticaAtual = data;
        comparacaoAtual = data.comparacao || null;
        renderLogisticaKpis(data);
        renderLogisticaEvolucao(data);
        renderLogisticaDesvio(data);
        renderLogisticaFolga(data);
        renderLogisticaEtapas(data);
        renderLogisticaTempo(data);
        renderLogisticaOnde(data);
        renderLogisticaCusto(data);
        renderLogisticaImpacto(data);
        renderLogisticaParados(data);
        renderLogisticaSinais(data);
        renderLogisticaAtrasoCards(data);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] getLogisticaData falhou', err);
        document.getElementById('logistica-kpi-row').innerHTML = '<p class="error">Erro ao carregar logística: ' + err.message + '</p>';
      })
      .getLogisticaData(valor, false);
  }

  function iniciarLogistica() {
    if (logisticaIniciado) return;
    logisticaIniciado = true;
    mesesDisponiveis_(function (opcoes) {
        document.getElementById('logistica-mes-selector').innerHTML = opcoes.map(function (v) {
          return '<option value="' + v + '">' + formatMesLabel(v) + '</option>';
        }).join('');
        carregarLogistica(opcoes[0]);
      }, function (err) {
        logisticaIniciado = false;
        console.error('[dash] getMesesDisponiveis (logística) falhou', err);
        document.getElementById('logistica-kpi-row').innerHTML = '<p class="error">Erro ao carregar períodos: ' + err.message + '</p>';
      });
  }

  document.getElementById('logistica-mes-selector').addEventListener('change', function (e) {
    carregarLogistica(e.target.value);
  });

  // ===== Satisfação =====
  // Positiva = nota 4 ou 5; insatisfeita = nota 1, 2 ou 3; mês de referência = mês do pedido. Meta: mais de 95% de avaliações
  // positivas (vem do backend, data.meta). Só carrega na primeira vez que a aba é aberta.

  const SATISFACAO_KPI_CONFIG = [
    { key: 'notaMedia', label: 'Nota média', format: 'nota', positiveIsGood: true },
    { key: 'pctPositivas', label: '% positivas (4–5★)', format: 'pct', positiveIsGood: true, labelSmall: true },
    { key: 'pctInsatisfeitas', label: '% insatisfeitas (1–3★)', format: 'pct', positiveIsGood: false, labelSmall: true },
    { key: 'clientesInsatisfeitos', label: 'Clientes insatisfeitos', format: 'num', positiveIsGood: false, labelSmall: true },
    { key: 'avaliadores', label: 'Clientes avaliadores', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'pctComentario', label: '% com comentário', format: 'pct', positiveIsGood: true, labelSmall: true }
  ];

  // Limiares PROVISÓRIOS do painel de sinais (bloco 6); a meta de positivas (95%) é a combinada. Em todos, valor maior = pior.
  const SATISFACAO_SINAIS = {
    metaGapPP: { investigar: 10, atencao: 2, monitorar: 0.05 },   // quantos p.p. a % de positivas está abaixo da meta
    notaQueda: { investigar: 0.15, atencao: 0.05 },               // queda da nota média vs. mês anterior (pontos)
    insatisfeitasPP: { investigar: 2, atencao: 1 },               // alta da % de insatisfeitas vs. mês anterior, em p.p.
    clientesAlta: { investigar: 0.10, atencao: 0.05 },            // alta de clientes insatisfeitos vs. mês anterior
    segmentoPP: { investigar: 10, atencao: 5, monitorar: 2 },     // % de insatisfeitas do segmento acima da geral, em p.p.
    atrasoRazao: { atencao: 4, monitorar: 2 },                    // participação nas insatisfeitas ÷ participação nas avaliações (pedidos atrasados)
    tema: { atencao: 0.40, monitorar: 0.25 },                     // % dos comentários insatisfeitos que citam o tema
    retencaoPP: { atencao: 2, monitorar: 1 }                      // quantos p.p. os insatisfeitos voltam a comprar menos que os satisfeitos
  };

  let satisfacaoIniciado = false;
  let satisfacaoAtual = null;
  let sparklineChartsSatisfacao = {};
  let satisfacaoEvolucaoModo = 'nota';
  let satisfacaoOndeDim = 'regiao';
  let satisfacaoOndeMetrica = 'insatisfeitas';

  function renderSatisfacaoKpis(data) {
    const janela = data.janela || [];
    const rotulos = janela.map(function (m) { return formatMesLabel(m.mes); });
    document.getElementById('satisfacao-kpi-row').innerHTML = SATISFACAO_KPI_CONFIG.map(function (cfg) {
      return htmlKpiCard(cfg, data.kpis[cfg.key], 'spark-satisfacao-' + cfg.key);
    }).join('');
    ajustarTamanhosKpi('satisfacao-kpi-row');
    Object.keys(sparklineChartsSatisfacao).forEach(function (k) { sparklineChartsSatisfacao[k].destroy(); });
    sparklineChartsSatisfacao = {};
    SATISFACAO_KPI_CONFIG.forEach(function (cfg) {
      criarSparkline('spark-satisfacao-' + cfg.key, cfg.key, rotulos, janela.map(function (m) { return m[cfg.key]; }), cfg, data.kpis[cfg.key].delta, sparklineChartsSatisfacao);
    });
  }

  // Bloco 1 — avaliações do mês (colunas) + nota média ou % de positivas com a meta (linha tracejada).
  function renderSatisfacaoEvolucao(data) {
    const j = data.janela || [];
    const rot = j.map(function (r) { return formatMesLabel(r.mes); });
    const ativo = j.map(function (r) { return r.mes; }).indexOf(data.periodo);

    const nota = satisfacaoEvolucaoModo === 'nota';

    graficoComboLogistica_({
      chartKey: 'satisfacaoEvolucao', canvasId: 'chart-satisfacao-evolucao', tableId: 'table-satisfacao-evolucao', labels: rot, ativo: ativo,
      barra: { label: 'Avaliações', dados: j.map(function (r) { return r.avaliacoes; }), cor: claro, texto: function (v) { return formatNum(v); }, dentro: true },

        : [{ label: '% positivas', dados: j.map(function (r) { return r.pctPositivas; }), cor: navy, texto: function (v) { return formatPct(v); }, rotulos: 'todos', alinhamento: 'bottom' },
           { label: 'Meta', dados: j.map(function () { return data.meta; }), cor: cinza, texto: function (v) { return formatPct(v); }, rotulos: 'nenhum', tracejada: true }],
      tooltip: function (i) {
        const r = j[i];
        return ['Avaliações: ' + formatNum(r.avaliacoes), 'Nota média: ' + formatNum(r.notaMedia, 2), '% positivas (4–5★): ' + formatPct(r.pctPositivas), '% insatisfeitas (1–3★): ' + formatPct(r.pctInsatisfeitas)];
      },
      colunas: [
        { label: 'Mês do pedido', render: function (r) { return formatMesLabel(r.mes); } },

        { label: 'Nota média', num: true, render: function (r) { return formatNum(r.notaMedia, 2); } },
        { label: '% positivas (4–5★)', num: true, render: function (r) { return formatPct(r.pctPositivas); } },
        { label: '% neutras (3★)', num: true, render: function (r) { return formatPct(r.pctNeutras); } },
        { label: '% negativas (1–2★)', num: true, render: function (r) { return formatPct(r.pctNegativas); } },
        { label: '% insatisfeitas (1–3★)', num: true, render: function (r) { return formatPct(r.pctInsatisfeitas); } },
        { label: 'Meta de positivas', num: true, render: function () { return formatPct(data.meta); } }
      ],
      linhasTabela: j
    });
  }

  // Bloco 2 — distribuição das notas: mês selecionado × mês anterior.
  function renderSatisfacaoDistribuicao(data) {
    const d = data.distribuicao;
    const total = function (v) { return v.reduce(function (s, x) { return s + x; }, 0); };
    const tm = total(d.mes), ta = total(d.anterior);
    const rotulos = ['1★', '2★', '3★', '4★', '5★'];
    document.getElementById('satisfacao-distribuicao-legenda-anterior').textContent = capMesAnt_();
    graficoBarrasAgrupadasVendas_({
      chartKey: 'satisfacaoDistribuicao', canvasId: 'chart-satisfacao-distribuicao', tableId: 'table-satisfacao-distribuicao', labels: rotulos,
      series: [
        { label: 'Mês', data: d.mes.map(function (v) { return tm > 0 ? v / tm : 0; }), cor: cssVar('--chart-evolucao-bar'), texto: function (v) { return formatPct(v); } },
        { label: capMesAnt_(), data: d.anterior.map(function (v) { return ta > 0 ? v / ta : 0; }), cor: cssVar('--perfil-media'), texto: function (v) { return formatPct(v); } }
      ],
      tooltip: function (i) { return [rotulos[i] + ' no mês: ' + formatNum(d.mes[i]) + ' avaliações (' + formatPct(tm > 0 ? d.mes[i] / tm : 0) + ')', rotulos[i] + ' no mês anterior: ' + formatNum(d.anterior[i]) + ' (' + formatPct(ta > 0 ? d.anterior[i] / ta : 0) + ')']; },
      colunas: [
        { label: 'Nota', render: function (x) { return x.nota; } },
        { label: 'Avaliações (mês)', num: true, render: function (x) { return formatNum(x.a); } },
        { label: '% (mês)', num: true, render: function (x) { return formatPct(x.pa); } },
        { label: 'Avaliações (mês anterior)', num: true, render: function (x) { return formatNum(x.b); } },
        { label: '% (mês anterior)', num: true, render: function (x) { return formatPct(x.pb); } }
      ],
      linhas: rotulos.map(function (n, i) { return { nota: n, a: d.mes[i], pa: tm > 0 ? d.mes[i] / tm : 0, b: d.anterior[i], pb: ta > 0 ? d.anterior[i] / ta : 0 }; })
    });
  }

  // Bloco 3 — segmentos: volume de avaliações (colunas) + % de insatisfeitas ou nota média (linha).
  function renderSatisfacaoOnde(data) {
    const o = data.onde, metrica = satisfacaoOndeMetrica;
    const nomes = { regiao: 'Região do cliente', estado: 'Estado do cliente', cidade: 'Cidade do cliente', categoria: 'Categoria', valor: 'Faixa de valor do pedido', itens: 'Itens no pedido' };
    const naturais = { valor: true, itens: true };
    let lista = (o[satisfacaoOndeDim] || []).filter(function (g) { return g.avaliacoes >= o.minAvaliacoes; });
    if (!naturais[satisfacaoOndeDim]) lista = lista.slice().sort(function (a, b) { return b.avaliacoes - a.avaliacoes; }).slice(0, 10);
    const laranja = cssVar('--series-2'), cinza = cssVar('--text-muted');
    const taxa = function (g) { return g.avaliacoes > 0 ? g.insatisfeitas / g.avaliacoes : 0; };
    const isTaxa = metrica === 'insatisfeitas';
    legendaDinamicaLogistica_('satisfacao-onde-legenda', [[cssVar('--perfil-media'), 'Avaliações (volume)'], [laranja, isTaxa ? '% de avaliações insatisfeitas (1–3★)' : 'Nota média']].concat(isTaxa ? [[cinza, 'Meta: no máximo ' + formatPct(1 - data.meta)]] : []));
    graficoComboLogistica_({
      chartKey: 'satisfacaoOnde', canvasId: 'chart-satisfacao-onde', tableId: 'table-satisfacao-onde', labels: lista.map(function (g) { return g.nome; }), ativo: -1,
      barra: { label: 'Avaliações', dados: lista.map(function (g) { return g.avaliacoes; }), cor: cssVar('--perfil-media'), texto: function (v) { return formatNum(v); } },
      linhas: [{ label: isTaxa ? '% insatisfeitas' : 'Nota média', dados: lista.map(function (g) { return isTaxa ? taxa(g) : g.nota; }), cor: laranja, texto: function (v) { return isTaxa ? formatPct(v) : formatNum(v, 2); }, rotulos: 'todos' }]
        .concat(isTaxa ? [{ label: 'Meta', dados: lista.map(function () { return 1 - data.meta; }), cor: cinza, texto: function (v) { return formatPct(v); }, rotulos: 'nenhum', tracejada: true }] : []),
      tooltip: function (i) {
        const g = lista[i];
        return ['Avaliações: ' + formatNum(g.avaliacoes), '% insatisfeitas (1–3★): ' + formatPct(taxa(g)) + ' (' + formatNum(g.insatisfeitas) + ')', '% positivas (4–5★): ' + formatPct(g.avaliacoes > 0 ? g.positivas / g.avaliacoes : 0), 'Nota média: ' + formatNum(g.nota, 2)];
      },
      colunas: [
        { label: nomes[satisfacaoOndeDim], render: function (g) { return g.nome; } },
        { label: 'Avaliações', num: true, render: function (g) { return formatNum(g.avaliacoes); } },
        { label: 'Insatisfeitas (1–3★)', num: true, render: function (g) { return formatNum(g.insatisfeitas); } },
        { label: '% insatisfeitas', num: true, render: function (g) { return formatPct(taxa(g)); } },
        { label: '% positivas', num: true, render: function (g) { return formatPct(g.avaliacoes > 0 ? g.positivas / g.avaliacoes : 0); } },
        { label: 'Nota média', num: true, render: function (g) { return formatNum(g.nota, 2); } }
      ],
      linhasTabela: lista
    });
  }

  // Bloco 4A — onde estão as avaliações insatisfeitas, por nível de prazo (vs. onde estão todas as avaliações).
  function renderSatisfacaoPrazo(data) {
    const p = data.prazo || [];
    const totA = p.reduce(function (s, x) { return s + x.avaliacoes; }, 0), totI = p.reduce(function (s, x) { return s + x.insatisfeitas; }, 0);
    graficoBarrasAgrupadasVendas_({

      series: [
        { label: '% das insatisfeitas', data: p.map(function (x) { return totI > 0 ? x.insatisfeitas / totI : 0; }), cor: cssVar('--chart-evolucao-bar'), texto: function (v) { return formatPct(v); } },

      ],

          '% insatisfeitas neste nível: ' + formatPct(x.avaliacoes > 0 ? x.insatisfeitas / x.avaliacoes : 0), 'Nota média: ' + formatNum(x.nota, 2)];
