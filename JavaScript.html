    charts.volumeRetencao = new Chart(document.getElementById('chart-volume-retencao'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            type: 'bar',
            label: 'Pedidos',
            data: pedidos,
            backgroundColor: corPedidos,
            maxBarThickness: 32,
            yAxisID: 'y',
            order: 2,
            datalabels: {
              display: true,
              anchor: 'end', align: 'top', offset: 3,
              color: cssVar('--text-primary'), font: { size: 8, weight: '600' },
              formatter: function (value) { return formatValor(value, 'num'); }
            }
          },
          {
            type: 'line',
            label: 'Taxa de recompra',
            data: recompra,
            borderColor: corRecompra,
            backgroundColor: corRecompra,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: corRecompra,
            tension: 0,
            yAxisID: 'y1',
            order: 1,
            datalabels: {
              display: true,
              anchor: 'end', align: 'top', offset: 5,
              color: corRecompra, font: { size: 8, weight: '600' },
              formatter: function (value) { return formatPct(value); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: Object.assign({}, TOOLTIP_FATURAMENTO_CALLBACKS, {
              label: function (ctx) {
                const mom = momPorDataset[ctx.datasetIndex][ctx.dataIndex];
                const valor = ctx.datasetIndex === 0 ? formatNum(ctx.parsed.y) : formatPct(ctx.parsed.y);
                return ctx.dataset.label + ': ' + valor + ' (variação: ' + formatMoM(mom) + ')';
              }
            })
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { maxRotation: 0 } },
          y: {
            position: 'left',
            beginAtZero: true,
            max: maxBarra * 1.7,
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { color: cssVar('--chart-eixo') },
            ticks: { display: false, count: 3 }
          },
          y1: {
            type: 'linear',
            position: 'right',
            min: escalaRecompra.min,
            max: escalaRecompra.max,
            grid: { display: false },
            border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    const momPedidosPorMes = mapearSeriePorMes(data.janelaMensal, momPorDataset[0]);
    const momRecompraPorMes = mapearSeriePorMes(data.janelaMensal, momPorDataset[1]);
    renderTable('table-volume-retencao',
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Pedidos', num: true, render: function (r) { return formatNum(r.pedidos); } },
        { label: 'Variação pedidos (MoM)', num: true, render: function (r) { return formatMoM(momPedidosPorMes[r.mes]); } },
        { label: 'Taxa de recompra', num: true, render: function (r) { return formatPct(r.taxaRecompra); } },
        { label: 'Variação recompra (MoM)', num: true, render: function (r) { return formatMoM(momRecompraPorMes[r.mes]); } }
      ],
      data.janelaMensal
    );
  }

  // Experiência do cliente: taxa de atraso (logística) × nota média (satisfação) no mesmo gráfico,
  // duas linhas em eixos separados e faixas verticais separadas (atraso embaixo, nota em cima) pra
  // não se atropelarem. É o cruzamento que nenhuma das duas visões mostra sozinha.
  function renderExperienciaClienteChart(data) {
    if (charts.experienciaCliente) charts.experienciaCliente.destroy();
    if (!data.janelaMensal) return;
    const labels = data.janelaMensal.map(function (r) { return formatMesLabel(r.mes); });
    const atraso = data.janelaMensal.map(function (r) { return r.taxaAtraso || 0; });
    // Mês sem nenhuma avaliação vem 0 do Code.gs — vira lacuna em vez de derrubar a linha a zero.
    const nota = data.janelaMensal.map(function (r) { return r.notaMedia > 0 ? r.notaMedia : null; });
    const momPorDataset = [calcularSerieMoM(atraso), calcularSerieMoM(nota)];

    const corAtraso = cssVar('--chart-custo-bar');
    const corNota = cssVar('--brand');
    const escalaAtraso = escalaEmFaixa_(atraso, 0.08, 0.42);
    const escalaNota = escalaEmFaixa_(nota, 0.58, 0.9);

    function datasetLinha(label, serie, cor, eixo, formatter) {
      return {
        label: label,
        data: serie,
        borderColor: cor,
        backgroundColor: cor,
        borderWidth: 2,
        pointRadius: 3,
        pointBackgroundColor: cor,
        tension: 0,
        spanGaps: false,
        yAxisID: eixo,
        datalabels: {
          display: true,
          anchor: 'end', align: 'top', offset: 5,
          color: cor, font: { size: 10, weight: '600' },
          formatter: formatter
        }
      };
    }

    charts.experienciaCliente = new Chart(document.getElementById('chart-experiencia-cliente'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          datasetLinha('Taxa de atraso', atraso, corAtraso, 'y', function (v) { return formatPct(v); }),
          datasetLinha('Nota média', nota, corNota, 'y1', function (v) { return v == null ? '' : formatNum(v, 2); })
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const mom = momPorDataset[ctx.datasetIndex][ctx.dataIndex];
                const valor = ctx.datasetIndex === 0 ? formatPct(ctx.parsed.y) : formatNum(ctx.parsed.y, 2) + ' / 5';
                return ctx.dataset.label + ': ' + valor + ' (variação: ' + formatMoM(mom) + ')';
              }
            }
          }
        },
        scales: {
          x: { offset: true, grid: { display: false }, border: { color: cssVar('--chart-eixo') } },
          y: {
            position: 'left',
            min: escalaAtraso.min,
            max: escalaAtraso.max,
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { color: cssVar('--chart-eixo') },
            ticks: { display: false, count: 3 }
          },
          y1: {
            type: 'linear',
            position: 'right',
            min: escalaNota.min,
            max: escalaNota.max,
            grid: { display: false },
            border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    const momAtrasoPorMes = mapearSeriePorMes(data.janelaMensal, momPorDataset[0]);
    const momNotaPorMes = mapearSeriePorMes(data.janelaMensal, momPorDataset[1]);
    renderTable('table-experiencia-cliente',
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Taxa de atraso', num: true, render: function (r) { return formatPct(r.taxaAtraso); } },
        { label: 'Variação atraso (MoM)', num: true, render: function (r) { return formatMoM(momAtrasoPorMes[r.mes]); } },
        { label: 'Nota média', num: true, render: function (r) { return r.notaMedia > 0 ? formatNum(r.notaMedia, 2) : '—'; } },
        { label: 'Variação nota (MoM)', num: true, render: function (r) { return formatMoM(momNotaPorMes[r.mes]); } }
      ],
      data.janelaMensal
    );
  }

  function renderCharts(data) {
    renderPreocupacoesChart(data);
    renderEvolucaoFaturamentoCustoMargemChart(data);
    renderOverviewVolumeTicket(data);
    renderVolumeRetencaoChart(data);
    renderOperacaoChart(data);
    renderClienteKpis(data);
    renderExperienciaClienteChart(data);
    renderAreasResumo(data);
  }

  // ===== Volume × ticket (usado pela Visão Geral) =====

  // R$ com sinal explícito (+R$ 12 mil / −R$ 8 mil) — variações em valor absoluto.
  function formatBRLSinal(value) {
    return (value >= 0 ? '+' : '−') + formatBRL(Math.abs(value));
  }

  // Separa a variação do faturamento vs. o mês anterior em dois efeitos que somam exatamente o
  // total: volume (mais/menos pedidos, ao ticket antigo) e ticket (mudança do ticket sobre os
  // pedidos atuais). F = pedidos × ticket, então (P1−P0)·T0 + (T1−T0)·P1 = F1 − F0.
  function decomporVolumeTicket_(janela) {
    return janela.map(function (r, i) {
      if (i === 0) return { mes: r.mes, volume: null, ticket: null, total: null };
      const a = janela[i - 1];
      const ticketAnt = a.pedidos > 0 ? a.faturamento / a.pedidos : 0;
      const ticketAtual = r.pedidos > 0 ? r.faturamento / r.pedidos : 0;
      return {
        mes: r.mes,
        volume: (r.pedidos - a.pedidos) * ticketAnt,
        ticket: (ticketAtual - ticketAnt) * r.pedidos,
        total: r.faturamento - a.faturamento
      };
    });
  }

  // Barras empilhadas (volume + ticket) divergindo de zero, com a variação total em linha por cima.
  // Sai da série de 12 meses que já veio com os KPIs — não precisa de query própria.
  function renderVolumeTicketChart(cfg) {
    if (charts[cfg.chartKey]) charts[cfg.chartKey].destroy();
    const janela = cfg.janela || [];
    const dec = decomporVolumeTicket_(janela);
    const labels = janela.map(function (r) { return formatMesLabel(r.mes); });
    const volume = dec.map(function (d) { return d.volume; });
    const ticket = dec.map(function (d) { return d.ticket; });
    const total = dec.map(function (d) { return d.total; });

    const valores = volume.concat(ticket, total).filter(function (v) { return v != null; });
    const maxAbs = Math.max.apply(null, valores.map(Math.abs).concat([1]));
    const folga = maxAbs * 0.3;
    const corLinha = cssVar('--chart-evolucao-linha');
    const rotuloEfeito = {
      display: function (ctx) { return ctx.dataset.data[ctx.dataIndex] != null; },
      // Nas barras negativas o plugin inverte "start"/"end": 'start' é a ponta (parte de baixo). Com a direção
      // explícita, o rótulo fica acima da ponta nas positivas e abaixo da ponta nas negativas.
      anchor: function (ctx) { return ctx.dataset.data[ctx.dataIndex] < 0 ? 'start' : 'end'; },
      align: function (ctx) { return ctx.dataset.data[ctx.dataIndex] < 0 ? 'bottom' : 'top'; },
      offset: 9,
      color: cssVar('--text-primary'),
      font: { size: 9, weight: '600' },
      // fundo na cor da página: a linha tracejada do total passa por trás do texto sem atrapalhar a leitura
      backgroundColor: 'rgba(245, 244, 241, 0.92)',
      borderRadius: 3,
      padding: { top: 1, bottom: 1, left: 2, right: 2 },
      formatter: function (value) { return formatMilSinal(value); }
    };

    charts[cfg.chartKey] = new Chart(document.getElementById(cfg.canvasId), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { type: 'bar', label: 'Efeito volume', data: volume, backgroundColor: cssVar('--chart-evolucao-bar'), maxBarThickness: 44, barPercentage: 0.95, categoryPercentage: 0.9, order: 2, datalabels: rotuloEfeito },
          { type: 'bar', label: 'Efeito ticket', data: ticket, backgroundColor: cssVar('--series-2'), maxBarThickness: 44, barPercentage: 0.95, categoryPercentage: 0.9, order: 2, datalabels: rotuloEfeito },
          {
            type: 'line',
            label: 'Variação total',
            data: total,
            borderColor: corLinha,
            backgroundColor: corLinha,
            borderWidth: 2,
            borderDash: [5, 4],
            pointRadius: 3,
            pointBackgroundColor: corLinha,
            tension: 0,
            spanGaps: false,
            order: 1,
            datalabels: {
              display: false,
              anchor: 'end',
              align: function (ctx) { const v = ctx.dataset.data[ctx.dataIndex]; return v != null && v < 0 ? 'bottom' : 'top'; },
              offset: 4,
              color: cssVar('--text-primary'),
              font: { size: 9, weight: '600' },
              backgroundColor: 'rgba(255, 255, 255, 0.85)',
              borderRadius: 3,
              padding: { top: 1, bottom: 1, left: 3, right: 3 },
              formatter: function (value) { return value == null ? '' : formatBRLSinal(value); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18, bottom: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: Object.assign({}, TOOLTIP_FATURAMENTO_CALLBACKS, {
              label: function (ctx) { return ctx.dataset.label + ': ' + formatBRLSinal(ctx.parsed.y); }
            })
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') },
            // 2ª linha de cada mês = variação total (o valor de cada efeito fica acima/abaixo das barras)
            ticks: {
              maxRotation: 0,
              callback: function (value) {
                const t = total[value];
                return [this.getLabelForValue(value), t == null ? '—' : formatBRLSinal(t)];
              }
            }
          },
          y: {
            min: -maxAbs - folga,
            max: maxAbs + folga,
            afterBuildTicks: function (scale) {
              if (!scale.ticks.some(function (t) { return t.value === 0; })) {
                scale.ticks.push({ value: 0 });
                scale.ticks.sort(function (a, b) { return a.value - b.value; });
              }
            },
            grid: {
              color: cssVar('--chart-eixo'),
              lineWidth: function (ctx) { return ctx.tick.value === 0 ? 1.5 : 0; }
            },
            border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    renderTable(cfg.tableId,
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Faturamento', num: true, render: function (r) { return formatBRLCheio(r.faturamento); } },
        { label: 'Pedidos', num: true, render: function (r) { return formatNum(r.pedidos); } },
        { label: 'Efeito volume', num: true, render: function (r) { return r.volume == null ? '—' : formatBRLSinal(r.volume); } },
        { label: 'Efeito ticket', num: true, render: function (r) { return r.ticket == null ? '—' : formatBRLSinal(r.ticket); } },
        { label: 'Variação total', num: true, render: function (r) { return r.total == null ? '—' : formatBRLSinal(r.total); } }
      ],
      dec.map(function (d, i) { return Object.assign({}, d, { faturamento: janela[i].faturamento, pedidos: janela[i].pedidos }); })
    );
  }

  // Valor compacto com sinal, sem "R$", sempre em mil/mi (cabe ao lado da barra vizinha): +33,4 mil / −8,5 mil
  function formatMilSinal(value) {
    const abs = Math.abs(value);
    const txt = abs >= 1e6 ? (abs / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'
      : abs >= 1000 ? (abs / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil'
      : abs.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
    return (value >= 0 ? '+' : '−') + txt;
  }

  // Na Visão Geral a série vem de janelaMensal (faturamento = receita de produtos).
  function renderOverviewVolumeTicket(data) {
    const janela = (data.janelaMensal || []).map(function (r) { return { mes: r.mes, faturamento: r.receitaProdutos, pedidos: r.pedidos }; });
    renderVolumeTicketChart({ chartKey: 'ovVolumeTicket', canvasId: 'chart-ov-volume-ticket', tableId: 'table-ov-volume-ticket', janela: janela });
  }

  // ===== Vendas (estrutura da máquina comercial) =====
  // Narrativa: força comercial (Q1–Q3) → mercado (Q4–Q6) → estrutura/risco (Q7) → diagnóstico (Q8). As perguntas
  // são abertas: os gráficos mostram a distribuição e quem lê encontra o padrão. Só carrega na primeira vez
  // que a aba é aberta.

  const VENDAS_KPI_CONFIG = [
    { key: 'vendedores', label: 'Vendedores ativos', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'clientes', label: 'Clientes ativos', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'novos', label: 'Novos clientes', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'recorrentes', label: 'Clientes recorrentes', format: 'num', positiveIsGood: true, labelSmall: true },
    { key: 'pedidos', label: 'Pedidos', format: 'num', positiveIsGood: true },
    { key: 'pedidosPorVendedor', label: 'Pedidos por vendedor', format: 'dec', positiveIsGood: true, labelSmall: true }
  ];

  // Limiares do painel de sinais (Q8). Ajuste aqui para mudar quando um indicador vira "Atenção", "Monitorar"
  // ou "Investigar". Indicadores em fração (0,6 = 60%); "queda" é a variação vs. o mês anterior.
  const VENDAS_SINAIS = {
    topVendedores: { atencao: 0.60, monitorar: 0.50 },         // fatia do faturamento dos 10% maiores vendedores
    carteiraConcentrada: { atencao: 0.20, monitorar: 0.10 },   // % dos vendedores (2+ clientes) com o maior cliente acima de 50%
    clienteUnico: { atencao: 0.40, monitorar: 0.25 },          // % dos vendedores com um cliente só
    compraUnica: { atencao: 0.90, monitorar: 0.80 },           // % dos clientes que compraram uma única vez em 12 meses
    concentracaoClientes: { atencao: 0.30, monitorar: 0.20 },  // fatia do faturamento dos 10% maiores clientes
    estadoLider: { atencao: 0.50, monitorar: 0.35 },           // participação do estado líder nos pedidos
    categoriasLideres: { atencao: 0.60, monitorar: 0.45 },     // as 3 maiores categorias ÷ soma de todas (em pedidos)
    queda: { investigar: -0.10, atencao: -0.05 }               // variação de um KPI vs. o mês anterior
  };

  let vendasIniciado = false;
  let vendasAtual = null;
  let sparklineChartsVendas = {};
  let vendasDistribuicaoModo = 'faixa';
  let vendasPadroesModo = 'grade';
  let vendasMercadoDim = 'estado';
  let vendasMercadoMetrica = 'pedidos';
  let vendasPerfilDim = 'regiao';
  let vendasConcentracaoDim = 'vendedor';

  function renderVendasKpis(data) {
    const janela = data.janela || [];
    const rotulos = janela.map(function (m) { return formatMesLabel(m.mes); });
    document.getElementById('vendas-kpi-row').innerHTML = VENDAS_KPI_CONFIG.map(function (cfg) {
      return htmlKpiCard(cfg, data.kpis[cfg.key], 'spark-vendas-' + cfg.key);
    }).join('');
    ajustarTamanhosKpi('vendas-kpi-row');

    Object.keys(sparklineChartsVendas).forEach(function (k) { sparklineChartsVendas[k].destroy(); });
    sparklineChartsVendas = {};
    VENDAS_KPI_CONFIG.forEach(function (cfg) {
      const serie = janela.map(function (m) { return m[cfg.key]; });
      criarSparkline('spark-vendas-' + cfg.key, cfg.key, rotulos, serie, cfg, data.kpis[cfg.key].delta, sparklineChartsVendas);
    });
  }

  function hexParaRgba_(hex, alpha) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  // Barras (uma ou mais séries), vertical ou horizontal, com rótulo em cada barra.
  //   o: chartKey, canvasId, tableId, labels, series [{ label, data, cor, texto(valor, i) }], horizontal, tooltip(i) → linhas, colunas, linhas
  function graficoBarrasAgrupadasVendas_(o) {
    if (charts[o.chartKey]) charts[o.chartKey].destroy();
    const maxV = Math.max.apply(null, [].concat.apply([], o.series.map(function (s) { return s.data; })).concat([0.0001]));
    charts[o.chartKey] = new Chart(document.getElementById(o.canvasId), {
      type: 'bar',
      data: {
        labels: o.labels,
        datasets: o.series.map(function (s) {
          return {
            label: s.label,
            data: s.data,
            backgroundColor: s.cor,
            borderRadius: 3,
            maxBarThickness: o.horizontal ? 16 : 40,
            datalabels: {
              display: true, anchor: 'end', align: o.horizontal ? 'end' : 'top', offset: 3, clamp: true,
              color: cssVar('--text-primary'), font: { size: 10, weight: '600' },
              formatter: function (value, ctx) { return s.texto(value, ctx.dataIndex); }
            }
          };
        })
      },
      options: {
        indexAxis: o.horizontal ? 'y' : 'x',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18, right: o.horizontal ? 56 : 8 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return o.labels[items[0].dataIndex]; },
              label: function (ctx) { return ctx.datasetIndex === 0 ? o.tooltip(ctx.dataIndex) : ''; }
            },
            filter: function (item) { return item.datasetIndex === 0; }
          }
        },
        scales: {
          x: o.horizontal
            ? { display: false, beginAtZero: true, max: maxV * 1.3 }
            : { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { font: { size: 10 } } },
          y: o.horizontal
            ? { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { font: { size: 10 }, callback: function (v) { const n = this.getLabelForValue(v); return n.length > 30 ? n.slice(0, 29) + '…' : n; } } }
            : { display: false, beginAtZero: true, max: maxV * 1.25 }
        }
      }
    });
    renderTable(o.tableId, o.colunas, o.linhas);
  }

  // Q1 — distribuição da geração de vendas: por faixa de faturamento ou por grupo de posição.
  function renderVendasDistribuicao(data) {
    const grupo = vendasDistribuicaoModo === 'grupo';
    document.getElementById('vendas-distribuicao-legenda').hidden = !grupo;
    if (grupo) renderVendasGrupos_(data); else renderVendasFaixas_(data);
  }

  function renderVendasFaixas_(data) {
    const d = data.distribuicao;
    const faixas = d.faixas;
    document.getElementById('vendas-distribuicao-caption').textContent =
      formatMesLabel(data.periodo) + ' — ' + formatNum(d.vendedores) + ' vendedores com venda no mês · mediana de ' + formatBRLCheio(d.mediana) +
      ' por vendedor · média de ' + formatBRLCheio(d.media) + '; considera apenas pedidos entregues/faturados';
    graficoBarrasAgrupadasVendas_({
      chartKey: 'vendasDistribuicao', canvasId: 'chart-vendas-distribuicao', tableId: 'table-vendas-distribuicao',
      labels: faixas.map(function (f) { return f.rotulo; }),
      series: [{ label: 'Vendedores', data: faixas.map(function (f) { return f.vendedores; }), cor: cssVar('--chart-evolucao-bar'),
        texto: function (v, i) { return formatNum(v) + ' · ' + formatPct(faixas[i].pctVendedores); } }],
      tooltip: function (i) {
        const f = faixas[i];
        return ['Vendedores: ' + formatNum(f.vendedores) + ' (' + formatPct(f.pctVendedores) + ' do total)',
          'Faturamento da faixa: ' + formatBRLCheio(f.faturamento) + ' (' + formatPct(f.pctFaturamento) + ' do total)'];
      },
      colunas: [
        { label: 'Faixa de faturamento no mês', render: function (f) { return f.rotulo; } },
        { label: 'Vendedores', num: true, render: function (f) { return formatNum(f.vendedores); } },
        { label: '% dos vendedores', num: true, render: function (f) { return formatPct(f.pctVendedores); } },
        { label: 'Faturamento da faixa', num: true, render: function (f) { return formatBRLCheio(f.faturamento); } },
        { label: '% do faturamento', num: true, render: function (f) { return formatPct(f.pctFaturamento); } }
      ],
      linhas: faixas
    });
  }

  // Q1 (modo "Grupos de vendedores") — barras por grupo de posição (faturamento e vendedores) + linhas de acumulado
  // do grupo dos 5% maiores até 100%: faturamento, pedidos e (referência) vendedores.
  function renderVendasGrupos_(data) {
    if (charts.vendasDistribuicao) charts.vendasDistribuicao.destroy();
    const grupos = data.percentis;
    const acumular = function (campo) {
      let s = 0;
      return grupos.map(function (g) { s += g[campo]; return s; });
    };
    const acVend = acumular('pctVendedores'), acFat = acumular('pctFaturamento'), acPed = acumular('pctPedidos');
    const topo = grupos[0], base = grupos[grupos.length - 1];
    document.getElementById('vendas-distribuicao-caption').textContent =
      formatMesLabel(data.periodo) + ' — os ' + topo.rotulo.replace('Top ', '') + ' de vendedores que mais venderam geraram ' + formatPct(topo.pctFaturamento) + ' do faturamento e ' + formatPct(topo.pctPedidos) +
      ' dos pedidos; os 20% que mais venderam, ' + formatPct(acFat[2]) + ' do faturamento e ' + formatPct(acPed[2]) + ' dos pedidos; os demais 50%, ' + formatPct(base.pctFaturamento) +
      ' do faturamento; considera apenas pedidos entregues/faturados';

    const corFat = cssVar('--chart-evolucao-bar'), corVend = cssVar('--perfil-volume');
    const corAcFat = cssVar('--series-2'), corAcPed = cssVar('--chart-faturamento-bar'), corRef = cssVar('--text-muted');
    const maxBarra = Math.max.apply(null, grupos.map(function (g) { return Math.max(g.pctFaturamento, g.pctVendedores); }).concat([0.05]));
    const minLinha = Math.min.apply(null, acVend.concat(acFat, acPed));
    const maxLinha = Math.max.apply(null, acVend.concat(acFat, acPed).concat([1]));
    const y1Max = maxLinha + (maxLinha - minLinha) * 0.08;
    const y1Min = y1Max - (maxLinha - minLinha) / 0.36; // as linhas ocupam ~36% do topo do gráfico
    const rotuloBarra = function (cor) {
      return { display: true, anchor: 'end', align: 'top', offset: 2, color: cssVar('--text-primary'), font: { size: 9, weight: '600' }, formatter: function (v) { return formatPct(v); } };
    };
    const linha = function (label, dados, cor, tracejada, rotulos, alinhamento) {
      return {
        type: 'line', label: label, data: dados, borderColor: cor, backgroundColor: cor, borderWidth: tracejada ? 1.5 : 2, borderDash: tracejada ? [5, 4] : [],
        pointRadius: tracejada ? 0 : 3, tension: 0, yAxisID: 'y1', order: 1,
        datalabels: rotulos
          ? { display: true, anchor: 'end', align: alinhamento || 'top', offset: 6, clamp: true, color: cor, font: { size: 10, weight: '600' }, formatter: function (v) { return formatPct(v); } }
          : { display: false }
      };
    };
    charts.vendasDistribuicao = new Chart(document.getElementById('chart-vendas-distribuicao'), {
      type: 'bar',
      data: {
        labels: grupos.map(function (g) { return g.rotulo; }),
        datasets: [
          { type: 'bar', label: 'Faturamento do grupo', data: grupos.map(function (g) { return g.pctFaturamento; }), backgroundColor: corFat, maxBarThickness: 36, yAxisID: 'y', order: 2, datalabels: rotuloBarra() },
          { type: 'bar', label: 'Vendedores do grupo', data: grupos.map(function (g) { return g.pctVendedores; }), backgroundColor: corVend, maxBarThickness: 36, yAxisID: 'y', order: 2, datalabels: rotuloBarra() },
          linha('Faturamento acumulado', acFat, corAcFat, false, true),
          linha('Pedidos acumulados', acPed, corAcPed, false, true, 'bottom'),
          linha('Vendedores acumulados (referência)', acVend, corRef, true, false)
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              title: function (items) { const i = items[0].dataIndex; return grupos[i].rotulo + ' · acumulado até ' + formatPct(acVend[i]) + ' dos vendedores'; },
              label: function (ctx) {
                const i = ctx.dataIndex, g = grupos[i];
                if (ctx.datasetIndex === 0) return 'Faturamento do grupo: ' + formatBRLCheio(g.faturamento) + ' (' + formatPct(g.pctFaturamento) + ')';
                if (ctx.datasetIndex === 1) return 'Vendedores do grupo: ' + formatNum(g.vendedores) + ' (' + formatPct(g.pctVendedores) + ')';
                if (ctx.datasetIndex === 2) return 'Faturamento acumulado: ' + formatPct(acFat[i]);
                if (ctx.datasetIndex === 3) return 'Pedidos acumulados: ' + formatPct(acPed[i]) + ' (grupo: ' + formatNum(g.pedidos) + ' pedidos, ' + formatPct(g.pctPedidos) + ')';
                return 'Vendedores acumulados: ' + formatPct(acVend[i]);
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { font: { size: 10 } } },
          y: { position: 'left', beginAtZero: true, max: maxBarra * 1.9, grid: { color: cssVar('--gridline'), borderDash: [4, 4] }, border: { display: false }, ticks: { display: false, count: 3 } },
          y1: { type: 'linear', position: 'right', min: y1Min, max: y1Max, grid: { display: false }, border: { display: false }, ticks: { display: false } }
        }
      }
    });
    renderTable('table-vendas-distribuicao',
      [
        { label: 'Grupo de vendedores', render: function (g) { return g.rotulo; } },
        { label: 'Vendedores', num: true, render: function (g) { return formatNum(g.vendedores); } },
        { label: '% dos vendedores', num: true, render: function (g) { return formatPct(g.pctVendedores); } },
        { label: 'Pedidos', num: true, render: function (g) { return formatNum(g.pedidos); } },
        { label: '% dos pedidos', num: true, render: function (g) { return formatPct(g.pctPedidos); } },
        { label: 'Faturamento', num: true, render: function (g) { return formatBRLCheio(g.faturamento); } },
        { label: '% do faturamento', num: true, render: function (g) { return formatPct(g.pctFaturamento); } },
        { label: 'Vendedores acumulados', num: true, render: function (g) { return formatPct(acVend[grupos.indexOf(g)]); } },
        { label: 'Pedidos acumulados', num: true, render: function (g) { return formatPct(acPed[grupos.indexOf(g)]); } },
        { label: 'Faturamento acumulado', num: true, render: function (g) { return formatPct(acFat[grupos.indexOf(g)]); } }
      ],
      grupos
    );
  }

  // Q2 (modo "Maiores vendedores") — Pareto dos vendedores que mais faturaram: barra = faturamento do vendedor
  // (rótulo = % do faturamento do mês), linha = % acumulada do faturamento do mês. Mostra quanto os N maiores geram juntos.
  const VENDAS_TOP_VENDEDORES = 20;

  function renderVendasPadroesTop_(data) {
    if (charts.vendasPadroes) charts.vendasPadroes.destroy();
    const visual = document.querySelector('.chart-visual[data-visual="vendas-padroes"]');
    visual.classList.remove('chart-visual--auto');
    document.getElementById('chart-vendas-padroes').hidden = false;
    document.getElementById('vendas-padroes-grade').hidden = true;
    document.getElementById('vendas-padroes-legenda').hidden = false;
    document.getElementById('vendas-padroes-caption').hidden = false;
    const p = data.padroes;
    const total = p.faturamento > 0 ? p.faturamento : 1;
    const todos = data.vendedoresPontos || [];
    let acum = 0;
    const lista = todos.map(function (x) {
      acum += x[2];
      return { clientes: x[0], pedidos: x[1], faturamento: x[2], id: x[3], estado: x[4], part: x[2] / total, acumulado: acum / total };
    });
    const topo = lista.slice(0, VENDAS_TOP_VENDEDORES);
    const somaTopo = topo.length ? topo[topo.length - 1].acumulado : 0;
    document.getElementById('vendas-padroes-caption').textContent =
      formatMesLabel(data.periodo) + ' — os ' + topo.length + ' vendedores que mais faturaram (' + formatPct(p.total > 0 ? topo.length / p.total : 0) + ' dos ' + formatNum(p.total) + ') geram ' +
      formatPct(somaTopo) + ' do faturamento do mês' + (topo.length ? '; o maior sozinho gera ' + formatPct(topo[0].part) : '') + '; considera apenas pedidos entregues/faturados';

    const corBarra = cssVar('--chart-evolucao-bar');
    const corLinha = cssVar('--series-2');
    const maxFat = Math.max.apply(null, topo.map(function (x) { return x.faturamento; }).concat([1]));
    const acMax = Math.max.apply(null, topo.map(function (x) { return x.acumulado; }).concat([0.01]));
    const acMin = Math.min.apply(null, topo.map(function (x) { return x.acumulado; }).concat([acMax]));
    const y1Max = acMax + ((acMax - acMin) || 0.02) * 0.15;
    const y1Min = y1Max - ((acMax - acMin) || 0.02) / 0.2;
    const rotulosLinha = {};
    rotulosLinha[0] = true; rotulosLinha[4] = true; rotulosLinha[9] = true; rotulosLinha[topo.length - 1] = true;
    const nome = function (x) { return x.id + ' · ' + (x.estado || '—'); };

    charts.vendasPadroes = new Chart(document.getElementById('chart-vendas-padroes'), {
      type: 'bar',
      data: {
        labels: topo.map(nome),
        datasets: [
          {
            type: 'bar', label: 'Faturamento', data: topo.map(function (x) { return x.faturamento; }),
            backgroundColor: corBarra, maxBarThickness: 36, yAxisID: 'y', order: 2,
            datalabels: {
              display: true, anchor: 'end', align: 'top', offset: 3,
              color: cssVar('--text-primary'), font: { size: 10, weight: '600' },
              formatter: function (v, ctx) { return formatPct(topo[ctx.dataIndex].part); }
            }
          },
          {
            type: 'line', label: '% acumulada', data: topo.map(function (x) { return x.acumulado; }),
            borderColor: corLinha, backgroundColor: corLinha, borderWidth: 2, pointRadius: 3, tension: 0, yAxisID: 'y1', order: 1,
            datalabels: {
              display: function (ctx) { return !!rotulosLinha[ctx.dataIndex]; },
              anchor: 'end', align: 'top', offset: 6, clamp: true,
              color: corLinha, font: { size: 10, weight: '600' },
              formatter: function (v) { return formatPct(v); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { const x = topo[items[0].dataIndex]; return (items[0].dataIndex + 1) + 'º · Vendedor ' + nome(x); },
              label: function (ctx) {
                const x = topo[ctx.dataIndex];
                if (ctx.datasetIndex === 1) return '% acumulada do faturamento do mês: ' + formatPct(x.acumulado);
                return ['Faturamento: ' + formatBRLCheio(x.faturamento) + ' (' + formatPct(x.part) + ' do mês)', 'Clientes: ' + formatNum(x.clientes), 'Pedidos: ' + formatNum(x.pedidos),
                  'Ticket médio: ' + formatBRLCheio(x.pedidos > 0 ? x.faturamento / x.pedidos : 0)];
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cssVar('--chart-eixo') }, ticks: { minRotation: 40, maxRotation: 40, autoSkip: false, font: { size: 9 }, color: cssVar('--text-secondary') } },
          y: { position: 'left', beginAtZero: true, max: maxFat * 1.8, grid: { color: cssVar('--gridline'), borderDash: [4, 4] }, border: { display: false }, ticks: { display: false, count: 3 } },
          y1: { type: 'linear', position: 'right', min: y1Min, max: y1Max, grid: { display: false }, border: { display: false }, ticks: { display: false } }
        }
      }
    });
    renderTable('table-vendas-padroes',
      [
        { label: 'Posição', num: true, render: function (x) { return lista.indexOf(x) + 1; } },
        { label: 'Vendedor', render: function (x) { return nome(x); } },
        { label: 'Clientes', num: true, render: function (x) { return formatNum(x.clientes); } },
        { label: 'Pedidos', num: true, render: function (x) { return formatNum(x.pedidos); } },
        { label: 'Faturamento', num: true, render: function (x) { return formatBRLCheio(x.faturamento); } },
        { label: '% do faturamento do mês', num: true, render: function (x) { return formatPct(x.part); } },
        { label: '% acumulada', num: true, render: function (x) { return formatPct(x.acumulado); } },
        { label: 'Ticket médio', num: true, render: function (x) { return formatBRLCheio(x.pedidos > 0 ? x.faturamento / x.pedidos : 0); } }
      ],
      lista
    );
  }

  // Q2 (padrão) — perfis de atuação: 4 quadrantes por mediana de clientes atendidos × pedidos no mês. Cada quadro
  // mostra quantos vendedores há no perfil e a fatia do faturamento deles. Funciona com qualquer número de vendedores.
  function renderVendasPadroesGrade_(data) {
    if (charts.vendasPadroes) { charts.vendasPadroes.destroy(); charts.vendasPadroes = null; }
    const p = data.padroes;
    const visual = document.querySelector('.chart-visual[data-visual="vendas-padroes"]');
    visual.classList.add('chart-visual--auto');
    document.getElementById('chart-vendas-padroes').hidden = true;
    document.getElementById('vendas-padroes-legenda').hidden = true;
    const el = document.getElementById('vendas-padroes-grade');
    el.hidden = false;
    const nomePerfil = function (q) { return q.clientes.toLowerCase() + ' · ' + q.pedidos.toLowerCase(); };
    const legendaPerfis = document.getElementById('vendas-padroes-caption');
    legendaPerfis.textContent = '';
    legendaPerfis.hidden = true;
    const cor = cssVar('--perfil-volume'), corFat = cssVar('--chart-evolucao-bar');
    const barra = function (rotulo, pct, corBarra) {
      return '<div class="quadrante-barra"><span>' + rotulo + '</span><span class="trilho"><span class="preenchimento" style="display:block;width:' + Math.max(pct * 100, pct > 0 ? 2 : 0) + '%;background:' + corBarra + '"></span></span><span class="valor">' + formatPct(pct) + '</span></div>';
    };
    // Duas barras empilhadas (100%): composição dos vendedores × composição do faturamento pelos 4 perfis.
    const corBase = cssVar('--chart-evolucao-bar');
    const alfas = [0.35, 0.6, 0.8, 1];
    const corPerfil = function (i) { return hexParaRgba_(corBase, alfas[i]); };
    const segmentos = function (campo) {
      return '<div class="comparativo-seg">' + p.quadrantes.map(function (q, i) {
        const v = q[campo];
        return '<span style="width:' + (v * 100) + '%;background:' + corPerfil(i) + '" title="' + nomePerfil(q) + ': ' + formatPct(v) + '">' + (v >= 0.07 ? formatPct(v) : '') + '</span>';
      }).join('') + '</div>';
    };
    const comparativo = '<div class="comparativo">' +
      '<div class="comparativo-linha"><span>Vendedores</span>' + segmentos('pctVendedores') + '</div>' +
      '<div class="comparativo-linha"><span>Faturamento</span>' + segmentos('pctFaturamento') + '</div>' +
      '<div class="comparativo-legenda">' + p.quadrantes.map(function (q, i) { return '<span><i style="background:' + corPerfil(i) + '"></i>' + q.clientes + ' · ' + q.pedidos.toLowerCase() + '</span>'; }).join('') + '</div>' +
      '</div>';
    const razaoDe = function (q) { return q.pctVendedores > 0 ? q.pctFaturamento / q.pctVendedores : null; };
    el.innerHTML = comparativo + '<div class="quadrantes">' + p.quadrantes.map(function (q, i) {
      const r = razaoDe(q);
      return '<div class="quadrante">' +
        '<div class="quadrante-nome"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:' + corPerfil(i) + '"></i>' + q.clientes + ' · ' + q.pedidos.toLowerCase() + '</div>' +
        '<div class="quadrante-valor">' + formatNum(q.vendedores) + ' vendedores</div>' +
        barra('Vendedores', q.pctVendedores, cor) + barra('Faturamento', q.pctFaturamento, corFat) +
        '<div class="quadrante-razao">Fatia do faturamento ÷ fatia de vendedores: <b>' + (r == null ? '—' : formatNum(r, 1) + '×') + '</b></div>' +
        '<div class="quadrante-sub">Ticket médio de ' + formatBRLCheio(q.ticket) + ' · ' + formatBRLCheio(q.faturamento) + ' no mês</div>' +
        '</div>';
    }).join('') + '</div>';
    renderTable('table-vendas-padroes',
      [
        { label: 'Perfil', render: function (q) { return q.clientes + ' · ' + q.pedidos.toLowerCase(); } },
        { label: 'Vendedores', num: true, render: function (q) { return formatNum(q.vendedores); } },
        { label: '% dos vendedores', num: true, render: function (q) { return formatPct(q.pctVendedores); } },
        { label: 'Faturamento', num: true, render: function (q) { return formatBRLCheio(q.faturamento); } },
        { label: '% do faturamento', num: true, render: function (q) { return formatPct(q.pctFaturamento); } },
        { label: 'Ticket médio', num: true, render: function (q) { return formatBRLCheio(q.ticket); } },
        { label: 'Faturamento ÷ vendedores (×)', num: true, render: function (q) { return q.pctVendedores > 0 ? formatNum(q.pctFaturamento / q.pctVendedores, 1) + '×' : '—'; } }
      ],
      p.quadrantes
    );
  }

  // Concentração das vendas entre os vendedores: quanto os 10%, 20% e 50% que mais faturam respondem (curva do Q7),
  // sempre visível no Q2. No modo bolhas, mostra também a fatia dos vendedores desenhados.
  function renderVendasPadroesConcentracao_(data) {
    const c = data.concentracao.vendedor;
    const chip = function (rotulo, valor, sub) {
      return '<div class="conc-chip"><span class="conc-chip-rotulo">' + rotulo + '</span><span class="conc-chip-valor">' + valor + '</span><span class="conc-chip-sub">' + sub + '</span></div>';
    };
    let html = chip('Os 10% que mais faturam', formatPct(c.top10), 'do faturamento · distribuição igual: 10%') +
      chip('Os 20% que mais faturam', formatPct(c.top20), 'do faturamento · distribuição igual: 20%') +
      chip('Os 50% que mais faturam', formatPct(c.top50), 'do faturamento · distribuição igual: 50%') +
      chip('Índice de Gini', formatNum(c.gini, 2), '0 = todos iguais · 1 = um só concentra');
    if (vendasPadroesModo === 'bolhas') {
      const pontos = (data.vendedoresPontos || []).slice(0, VENDAS_TOP_VENDEDORES);
      const p = data.padroes;
      const soma = pontos.reduce(function (s, x) { return s + x[2]; }, 0);
      html += chip('Os ' + formatNum(pontos.length) + ' maiores vendedores', formatPct(p.faturamento > 0 ? soma / p.faturamento : 0),
        'do faturamento · ' + formatPct(p.total > 0 ? pontos.length / p.total : 0) + ' dos vendedores');
    }
    document.getElementById('vendas-padroes-conc').innerHTML = html;
  }

  function renderVendasPadroes(data) {
    renderVendasPadroesConcentracao_(data);
    if (vendasPadroesModo === 'bolhas') renderVendasPadroesTop_(data); else renderVendasPadroesGrade_(data);
  }

  // Quadro com células coloridas pela intensidade (mapa de calor em HTML, com o número dentro).
  //   linhas: [{ rotulo, valores: [n…] }], colunas: [rótulo…], formatar(n) → texto, subFn(linha, i, n) → texto pequeno
  function htmlMapaCalor_(linhas, colunas, formatar, subFn, suave) {
    const cor = cssVar('--chart-evolucao-bar');
    let max = 0;
    linhas.forEach(function (l) { l.valores.forEach(function (v) { if (v > max) max = v; }); });
    const cab = '<tr><th></th>' + colunas.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
    const corpo = linhas.map(function (l) {
      return '<tr><th class="linha">' + l.rotulo + '</th>' + l.valores.map(function (v, i) {
        const alfa = v > 0 && max > 0 ? 0.08 + 0.85 * (suave ? Math.sqrt(v / max) : v / max) : 0.04;
        const texto = alfa > 0.5 ? '#ffffff' : cssVar('--text-primary');
        const sub = subFn ? subFn(l, i, v) : '';
        return '<td style="background:' + hexParaRgba_(cor, alfa) + ';color:' + texto + '">' + (v > 0 ? formatar(v) : '·') + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<table class="heatmap"><thead>' + cab + '</thead><tbody>' + corpo + '</tbody></table>';
  }

  // Q4 — comportamento da base: frequência × intervalo médio entre compras (só clientes com 2+ pedidos em 12 meses).
  function renderVendasComportamento(data) {
    const c = data.comportamento;
    document.getElementById('vendas-comportamento-caption').textContent =
      'Últimos 12 meses — ' + formatNum(c.totalClientes) + ' clientes; ' + formatNum(c.unicos) + ' (' + formatPct(c.totalClientes > 0 ? c.unicos / c.totalClientes : 0) +
      ') compraram uma única vez e não têm intervalo entre compras; a matriz mostra os ' + formatNum(c.recorrentes) + ' que compraram mais de uma vez';
    const linhas = c.frequencias.map(function (f, i) { return { rotulo: f, valores: c.matriz[i] }; });
    document.getElementById('vendas-comportamento-visual').innerHTML = htmlMapaCalor_(linhas, c.intervalos, function (n) { return formatNum(n); }, function (l, i, v) {
      return c.recorrentes > 0 && v > 0 ? formatPct(v / c.recorrentes) : '';
    });
  }

    const lista = m[dim].slice().sort(function (a, b) { return b[metrica] - a[metrica]; }).slice(0, 10);

      formatPct(total > 0 ? somaTop / total : 0) + ' do total do mês; considera apenas pedidos entregues/faturados';
    graficoBarrasAgrupadasVendas_({

      ],

    ok: { rotulo: 'Sem alerta', ordem: 3 }
  };
  function statusPorLimiar_(valor, cfg) { return valor >= cfg.atencao ? 'atencao' : (valor >= cfg.monitorar ? 'monitorar' : 'ok'); }
  function statusPorQueda_(delta) {
    if (delta == null) return 'ok';
    return delta <= VENDAS_SINAIS.queda.investigar ? 'investigar' : (delta <= VENDAS_SINAIS.queda.atencao ? 'atencao' : 'ok');
  }

  function montarSinaisVendas_(data) {
    const k = data.kpis, sinais = [];
    const add = function (dimensao, sinal, indicador, referencia, status) { sinais.push({ dimensao: dimensao, sinal: sinal, indicador: indicador, referencia: referencia, status: status }); };
    const soma = function (l) { return l.reduce(function (a, b) { return a + b; }, 0); };

    const top10 = data.percentis[0].pctFaturamento + data.percentis[1].pctFaturamento;
    add('Vendedores', 'Fatia do faturamento gerada pelos 10% de vendedores que mais vendem', formatPct(top10), 'Distribuição igual: 10%', statusPorLimiar_(top10, VENDAS_SINAIS.topVendedores));
    add('Vendedores', 'Vendedores ativos vs. ' + rotuloMesAnt_(), formatMoM(k.vendedores.delta), '' + capMesAnt_() + ': ' + formatNum(k.vendedores.valorAnterior || 0), statusPorQueda_(k.vendedores.delta));
    add('Vendedores', 'Pedidos por vendedor vs. ' + rotuloMesAnt_(), formatMoM(k.pedidosPorVendedor.delta), '' + capMesAnt_() + ': ' + formatNum(k.pedidosPorVendedor.valorAnterior || 0, 1), statusPorQueda_(k.pedidosPorVendedor.delta));

    const c = data.carteira;
    const nCarteira = Math.max(c.vendedores, 1);
    const concentrada = soma(c.matriz.map(function (l) { return l[2]; })) / nCarteira;
    const unico = soma(c.matriz.map(function (l) { return l[3]; })) / nCarteira;
    add('Carteira', 'Vendedores (com 2+ clientes) cujo maior cliente responde por mais de 50% do faturamento', formatPct(concentrada), '12 meses; ' + formatNum(c.vendedores) + ' vendedores', statusPorLimiar_(concentrada, VENDAS_SINAIS.carteiraConcentrada));
    add('Carteira', 'Vendedores com um único cliente', formatPct(unico), 'Mediana de ' + formatNum(c.mediana, 0) + ' clientes por vendedor', statusPorLimiar_(unico, VENDAS_SINAIS.clienteUnico));

    add('Clientes', 'Novos clientes vs. ' + rotuloMesAnt_(), formatMoM(k.novos.delta), '' + capMesAnt_() + ': ' + formatNum(k.novos.valorAnterior || 0), statusPorQueda_(k.novos.delta));
    add('Clientes', 'Clientes recorrentes vs. ' + rotuloMesAnt_(), formatMoM(k.recorrentes.delta), '' + capMesAnt_() + ': ' + formatNum(k.recorrentes.valorAnterior || 0), statusPorQueda_(k.recorrentes.delta));
    const unicos = data.comportamento.totalClientes > 0 ? data.comportamento.unicos / data.comportamento.totalClientes : 0;
    add('Clientes', 'Clientes que compraram uma única vez nos últimos 12 meses', formatPct(unicos), formatNum(data.comportamento.unicos) + ' de ' + formatNum(data.comportamento.totalClientes), statusPorLimiar_(unicos, VENDAS_SINAIS.compraUnica));
    add('Clientes', 'Fatia do faturamento gerada pelos 10% de clientes que mais compram', formatPct(data.concentracao.cliente.top10), 'Distribuição igual: 10%', statusPorLimiar_(data.concentracao.cliente.top10, VENDAS_SINAIS.concentracaoClientes));

    const m = data.mercados;
    const lider = m.estado[0];
    if (lider && m.totalPedidos > 0) {
      const p = lider.pedidos / m.totalPedidos;
      add('Mercado', 'Participação do estado com mais pedidos', lider.nome + ': ' + formatPct(p), formatNum(lider.pedidos) + ' pedidos no mês', statusPorLimiar_(p, VENDAS_SINAIS.estadoLider));
    }
    const catsTotal = soma(m.categoria.map(function (x) { return x.pedidos; }));
    if (catsTotal > 0) {
      const p3 = soma(m.categoria.slice(0, 3).map(function (x) { return x.pedidos; })) / catsTotal;
      add('Mercado', 'Participação das 3 categorias com mais pedidos', formatPct(p3), m.categoria.slice(0, 3).map(function (x) { return x.nome; }).join(', '), statusPorLimiar_(p3, VENDAS_SINAIS.categoriasLideres));
    }
    return sinais.sort(function (a, b) { return VENDAS_STATUS[a.status].ordem - VENDAS_STATUS[b.status].ordem; });
  }

  // Os 6 sinais de maior gravidade viram cards (2 fileiras de 3); a tabela com todos fica em "Ver tabela".
  const VENDAS_SINAIS_CARDS = 6;

  function renderVendasSinais(data) {
    const sinais = montarSinaisVendas_(data);
    const cont = { investigar: 0, atencao: 0, monitorar: 0, ok: 0 };
    sinais.forEach(function (s) { cont[s.status]++; });
    document.getElementById('vendas-sinais-caption').textContent =
      formatMesLabel(data.periodo) + ' — ' + sinais.length + ' sinais: ' + cont.investigar + ' para investigar, ' + cont.atencao + ' em atenção, ' + cont.monitorar +
      ' para monitorar e ' + cont.ok + ' sem alerta; os ' + Math.min(VENDAS_SINAIS_CARDS, sinais.length) + ' de maior gravidade estão nos cards e todos em "Ver tabela" (limiares em VENDAS_SINAIS, no código); mostra onde olhar, não a causa nem o que fazer';
    document.getElementById('vendas-sinais-cards').innerHTML = sinais.slice(0, VENDAS_SINAIS_CARDS).map(function (s) {
      return '<div class="sinal-card sinal-card--' + s.status + '">' +
        '<div class="sinal-card-topo"><span class="sinal-card-dim">' + s.dimensao + '</span><span class="sinal sinal--' + s.status + '">' + VENDAS_STATUS[s.status].rotulo + '</span></div>' +
        '<div class="sinal-card-valor">' + s.indicador + '</div>' +
        '<div class="sinal-card-texto">' + s.sinal + '</div>' +
        '<div class="sinal-card-ref">' + s.referencia + '</div>' +
        '</div>';
    }).join('');
    renderTable('table-vendas-sinais',
      [
        { label: 'Dimensão', render: function (s) { return s.dimensao; } },
        { label: 'Sinal', render: function (s) { return s.sinal; } },
        { label: 'Indicador', num: true, render: function (s) { return s.indicador; } },
        { label: 'Referência', render: function (s) { return s.referencia; } },
        { label: 'Status', render: function (s) { return '<span class="sinal sinal--' + s.status + '">' + VENDAS_STATUS[s.status].rotulo + '</span>'; } }
      ],
      sinais
    );
  }

  function ligarToggleVendas_(toggleId, atributo, definir, redesenhar) {
    document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!vendasAtual) return;
        document.querySelectorAll('#' + toggleId + ' .toggle-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        definir(btn.dataset[atributo]);
        redesenhar(vendasAtual);
      });
    });
  }
  ligarToggleVendas_('vendas-distribuicao-toggle', 'modo', function (v) { vendasDistribuicaoModo = v; }, renderVendasDistribuicao);
  ligarToggleVendas_('vendas-padroes-toggle', 'modo', function (v) { vendasPadroesModo = v; }, renderVendasPadroes);
  ligarToggleVendas_('vendas-mercados-dim-toggle', 'dim', function (v) { vendasMercadoDim = v; }, renderVendasMercados);
  ligarToggleVendas_('vendas-mercados-metrica-toggle', 'metrica', function (v) { vendasMercadoMetrica = v; }, renderVendasMercados);
  ligarToggleVendas_('vendas-perfis-toggle', 'dim', function (v) { vendasPerfilDim = v; }, renderVendasPerfis);
  ligarToggleVendas_('vendas-concentracao-toggle', 'dim', function (v) { vendasConcentracaoDim = v; }, renderVendasConcentracao);

  function carregarVendas(valor) {
    const fimRpc = tempoRpc_("getVendasData");
    google.script.run
      .withSuccessHandler(function (data) {
        fimRpc();
        vendasAtual = data;
        comparacaoAtual = data.comparacao || null;
        renderVendasKpis(data);
        renderVendasDistribuicao(data);
        renderVendasPadroes(data);
        renderVendasCarteira(data);
        renderVendasComportamento(data);
        renderVendasMercados(data);
        renderVendasPerfis(data);
        renderVendasConcentracao(data);
        renderVendasSinais(data);
      })
      .withFailureHandler(function (err) {
        console.error('[dash] getVendasData falhou', err);
        document.getElementById('vendas-kpi-row').innerHTML = '<p class="error">Erro ao carregar vendas: ' + err.message + '</p>';
      })

  // ===== Receita & Performance =====
  // Página de investigação financeira em 6 etapas: evolução financeira → produtos que mudaram →
  // produtos que sustentam (Pareto) → cidades que mudaram → composição por categoria → como as
  // categorias geram receita (pedidos × ticket). Só carrega na primeira vez que a aba é aberta.

  // Custo de frete subir é piora → positiveIsGood: false. "Faturamento" desta página (chave faturamento) é a receita líquida
  // (valor dos produtos); Margem % = receita líquida ÷ faturamento total (produtos + frete).
  const RECEITA_KPI_CONFIG = [
    { key: 'faturamentoTotal', label: 'Faturamento total', format: 'brl', positiveIsGood: true, labelSmall: true },
    { key: 'faturamento', label: 'Receita líquida', format: 'brl', positiveIsGood: true },
    { key: 'custoFrete', label: 'Custo de frete', format: 'brl', positiveIsGood: false },
    { key: 'margemPct', label: 'Margem %', format: 'pct', positiveIsGood: true },

  let receitaAtual = null;
  let receitaCategoriasModo = 'ambos';
  let receitaCategoriasMetrica = 'valor';
  let receitaCidadesModo = 'ambos';
  let receitaCidadesMetrica = 'valor';
  let sparklineChartsReceita = {};

  function formatPP(value) {
    if (value == null) return '—';
    return (value >= 0 ? '+' : '−') + formatNum(Math.abs(value), 1) + ' p.p.';
  }

    sparklineChartsReceita = {};

      const serie = janela.map(function (m) { return m[cfg.key]; });
      criarSparkline('spark-receita-' + cfg.key, cfg.key, rotulos, serie, cfg, data.kpis[cfg.key].delta, sparklineChartsReceita);
    });

  // Faturamento e custo: barra do mês + linha tracejada de variação (mesmo helper das outras evoluções).
  function renderReceitaSerieMoM_(data, o) {
    if (charts[o.chartKey]) charts[o.chartKey].destroy();

    charts[o.chartKey] = renderComboValorMoMChart('chart-' + o.chave, {
      labels: janela.map(function (r) { return formatMesLabel(r.mes); }),
      valores: valores,
      labelBarra: o.rotulo,
      corBarra: cssVar(o.cor),
      mesesRef: janela,
      mesAtivo: data.periodo,
      fontSizeLabels: 9,
      rotacaoRotulo: -90, // 12 barras em card de meia largura: rótulo em pé, acima da barra, sem colisão
      tetoBarra: 2.3
    });
    const mom = mapearSeriePorMes(janela, calcularSerieMoM(valores));
    renderTable('table-' + o.chave,
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: o.rotulo, num: true, render: function (r) { return formatBRLCheio(r[o.campo]); } },
        { label: 'Variação (MoM)', num: true, render: function (r) { return formatMoM(mom[r.mes]); } }
      ],
      janela
    );
  }

  // Evolução de quanto do faturamento total (produtos + frete) é receita líquida (só os produtos). Neste ponto do código
  // `faturamento` = valor_total_produtos (receita líquida) e `custoFrete` = valor_total_frete; o total é a soma dos dois.
  function renderReceitaMargem(data) {
    if (charts.receitaMargem) charts.receitaMargem.destroy();
    const janela = data.janela || [];
    const totais = janela.map(function (r) { return (r.faturamento || 0) + (r.custoFrete || 0); });
    const pct = janela.map(function (r, i) { return totais[i] > 0 ? (r.faturamento || 0) / totais[i] : 0; });
    const dPP = pct.map(function (v, i) { return i === 0 ? null : (v - pct[i - 1]) * 100; });
    const cor = cssVar('--series-2');

    // A linha ocupa a faixa do gráfico com folga acima e abaixo, para os rótulos não colidirem com as bordas.
    const maxP = Math.max.apply(null, pct.concat([0]));
    const minP = Math.min.apply(null, pct.concat([1]));
    const variacaoP = (maxP - minP) || 0.02;

    charts.receitaMargem = new Chart(document.getElementById('chart-receita-margem'), {
      type: 'line',
      data: {
        labels: janela.map(function (r) { return formatMesLabel(r.mes); }),
        datasets: [{
          label: 'Receita líquida ÷ faturamento total',
          data: pct,
          borderColor: cor,
          backgroundColor: cor,
          borderWidth: 2,
          pointRadius: function (ctx) { return janela[ctx.dataIndex] && janela[ctx.dataIndex].mes === data.periodo ? 5 : 3; },
          tension: 0,
          datalabels: {
            display: true, anchor: 'end', align: 'top', offset: 6,
            color: cor, font: { size: 10, weight: '600' },
            formatter: function (value) { return formatPct(value); }
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 22 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const i = ctx.dataIndex;
                const r = janela[i];
                return [
                  'Receita líquida ÷ faturamento total: ' + formatPct(ctx.parsed.y) + (dPP[i] == null ? '' : ' (' + formatPP(dPP[i]) + ' vs. mês anterior)'),
                  'Receita líquida: ' + formatBRLCheio(r.faturamento),
                  'Faturamento total: ' + formatBRLCheio(totais[i])
                ];
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, border: { color: cssVar('--chart-eixo') } },
          y: {
            min: Math.max(0, minP - variacaoP * 0.6), max: Math.min(1.02, maxP + variacaoP * 0.6),
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { display: false },
            ticks: { display: false, count: 4 }
          }
        }
      }
    });

    renderTable('table-receita-margem',
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Faturamento total (produtos + frete)', num: true, render: function (r) { return formatBRLCheio((r.faturamento || 0) + (r.custoFrete || 0)); } },
        { label: 'Receita líquida (produtos)', num: true, render: function (r) { return formatBRLCheio(r.faturamento); } },
        { label: 'Custo de frete', num: true, render: function (r) { return formatBRLCheio(r.custoFrete); } },
        { label: 'Receita líquida ÷ faturamento total', num: true, render: function (r) { return formatPct(pct[janela.indexOf(r)]); } },
        { label: 'Variação (p.p.)', num: true, render: function (r) { return formatPP(dPP[janela.indexOf(r)]); } }
      ],
      janela
    );
  }

  // Colunas divergentes: acima de zero cresceu, abaixo de zero caiu. Rótulos fora das colunas
  // (acima nas positivas, abaixo nas negativas), nomes rotacionados no eixo X.
  //   cfg: chartKey, canvasId, tableId, itens, valor(x), rotulo(x), texto(valor, x), tooltip(x) → {titulo, linhas}, colunas (tabela)
  function renderColunasDivergentes_(cfg) {
    if (charts[cfg.chartKey]) charts[cfg.chartKey].destroy();
    const lista = cfg.itens || [];
    const corPositivo = cssVar('--chart-faturamento-bar');
    const corNegativo = cssVar('--chart-custo-bar');
    const valores = lista.map(cfg.valor);
    const cores = valores.map(function (v) { return v >= 0 ? corPositivo : corNegativo; });
    const maxAbs = Math.max.apply(null, valores.map(Math.abs).concat([1e-9]));
    const folga = maxAbs * 0.35;
    const maxAlta = Math.max.apply(null, valores.concat([0]));
    const maxQueda = Math.abs(Math.min.apply(null, valores.concat([0])));

    charts[cfg.chartKey] = new Chart(document.getElementById(cfg.canvasId), {
      type: 'bar',
      data: {
        labels: lista.map(cfg.rotulo),
        datasets: [{
          data: valores,
          backgroundColor: cores,
          maxBarThickness: 44,
          datalabels: {
            display: true,
            anchor: function (ctx) { return ctx.dataset.data[ctx.dataIndex] < 0 ? 'start' : 'end'; },
            align: function (ctx) { return ctx.dataset.data[ctx.dataIndex] < 0 ? 'bottom' : 'top'; },
            offset: 4,
            clamp: true,
            color: function (ctx) { return cores[ctx.dataIndex]; },
            font: { size: 10, weight: '600' },
            formatter: function (value, ctx) { return cfg.texto(value, lista[ctx.dataIndex]); }
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8, bottom: 4 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return cfg.tooltip(lista[items[0].dataIndex]).titulo; },
              label: function (ctx) { return cfg.tooltip(lista[ctx.dataIndex]).linhas; }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { display: false },
            ticks: {
              minRotation: 35,
              maxRotation: 35,
              autoSkip: false,
              font: { size: 9 },
              color: cssVar('--text-secondary'),
              callback: function (value) {
                const nome = this.getLabelForValue(value);
                return nome.length > 24 ? nome.slice(0, 23) + '…' : nome;
              }
            }
          },
          y: {
            min: -maxQueda - folga,
            max: maxAlta + folga,
            afterBuildTicks: function (scale) {
              if (!scale.ticks.some(function (t) { return t.value === 0; })) {
                scale.ticks.push({ value: 0 });
                scale.ticks.sort(function (a, b) { return a.value - b.value; });
              }
            },
            grid: { color: cssVar('--chart-eixo'), lineWidth: function (ctx) { return ctx.tick.value === 0 ? 1.5 : 0; } },
            border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    renderTable(cfg.tableId, cfg.colunas, lista);
  }

  function linhasVariacaoReceita_(x) {
    return [
      'Faturamento atual: ' + formatBRLCheio(x.atual),
      'Faturamento anterior: ' + formatBRLCheio(x.anterior),
