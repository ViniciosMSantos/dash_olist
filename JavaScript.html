<script>
  document.querySelectorAll('.nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      if (btn.dataset.view === 'vendas') iniciarVendas();
      if (btn.dataset.view === 'receita') iniciarReceita();
      if (btn.dataset.view === 'logistica') iniciarLogistica();
      if (btn.dataset.view === 'satisfacao') iniciarSatisfacao();
    });
  });

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Métrica: positiveIsGood=false = "menor é melhor" (uma alta deve aparecer em vermelho, não verde)
  // serieKey: nome do campo correspondente em janelaMensal, quando diferente de `key`.
  const KPI_CONFIG = [
    { key: 'receitaTotal', serieKey: 'receita', label: 'Faturamento', format: 'brl', positiveIsGood: true },
    { key: 'margemLiquida', label: 'Margem', format: 'pct', positiveIsGood: true },
    { key: 'ticketMedio', label: 'Ticket médio', format: 'brl', positiveIsGood: true },
    { key: 'notaMedia', label: 'Nota média', format: 'nota', positiveIsGood: true },
    { key: 'taxaAtraso', label: 'Taxa de atraso', format: 'pct', positiveIsGood: false, labelSmall: true },
    { key: 'taxaCancelamento', label: 'Taxa de cancelamento', format: 'pct', positiveIsGood: false, labelSmall: true }
  ];

  // Faturamento (receita/produtos) só considera pedidos Entregue/Faturado — deixado explícito no tooltip.
  const NOTA_FATURAMENTO = 'Considera apenas pedidos entregues/faturados';
  const TOOLTIP_FATURAMENTO_CALLBACKS = { footer: function () { return NOTA_FATURAMENTO; } };

  let charts = {};
  let sparklineCharts = {};
  let periodoTipoAtual = 'mes';

  Chart.defaults.font.family = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  Chart.defaults.color = cssVar('--text-secondary');
  Chart.defaults.borderColor = cssVar('--gridline');

  // Plugin de rótulos de dados — registrado uma vez, mas desligado por padrão pra não
  // aparecer nos outros gráficos (donut, ranking, status). Cada gráfico liga explicitamente.
  if (window.ChartDataLabels) {
    Chart.register(ChartDataLabels);
    Chart.defaults.set('plugins.datalabels', { display: false });
  }

  // Desenha, para cada ponto do primeiro dataset, uma linha pontilhada da base do gráfico
  // até o próprio ponto — em vez de uma grade genérica que atravessa a área inteira.
  const hastesAtePontoPlugin = {
    id: 'hastesAtePonto',
    afterDatasetsDraw: function (chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta || !meta.data || !meta.data.length) return;
      const ctx = chart.ctx;
      const bottom = chart.chartArea.bottom;
      ctx.save();
      ctx.strokeStyle = cssVar('--baseline');
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      meta.data.forEach(function (ponto) {
        ctx.beginPath();
        ctx.moveTo(ponto.x, bottom);
        ctx.lineTo(ponto.x, ponto.y);
        ctx.stroke();
      });
      ctx.restore();
    }
  };

  // ===== Formatação =====

  function compactNumber(value, decimals) {
    if (value == null) value = 0;
    const abs = Math.abs(value);
    const d = decimals == null ? 1 : decimals;
    if (abs >= 1e6) return (value / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: d }) + ' mi';
    if (abs >= 1e4) return (value / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: d }) + ' mil';
    return value.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  }
  function formatBRL(value) {
    return 'R$ ' + compactNumber(value);
  }
  function formatBRLCheio(value) {
    if (value == null) value = 0;
    return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function formatPct(value) {
    return (value * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
  }
  // Variação percentual com sinal explícito (+3,2% / -1,8%) — usada nas linhas de MoM dos gráficos.
  function formatMoM(value) {
    if (value == null) return '—';
    return (value >= 0 ? '+' : '') + formatPct(value);
  }
  // Rótulo de variação pro ranking de "principais pontos de atenção": taxas mostram diferença em
  // pontos percentuais, tempo em dias de diferença, o resto em variação relativa (%).
  function formatVariacaoPreocupacao(item) {
    if (item.formato === 'pct') {
      const diffPP = (item.valorAtual - item.valorAnterior) * 100;
      return (diffPP >= 0 ? '+' : '') + formatNum(diffPP, 1) + ' p.p.';
    }
    if (item.formato === 'dias') {
      const diffDias = item.valorAtual - item.valorAnterior;
      return (diffDias >= 0 ? '+' : '') + formatNum(diffDias, 1) + ' dias';
    }
    return formatMoM(item.delta);
  }
  // Frase da tooltip do ranking de pontos de atenção: há quantos períodos essa métrica vem
  // piorando — mesmo texto usado no card e na tabela de acessibilidade, pra não divergir.
  // Termo neutro ("caso") porque também cobre KPIs que não caíram, só desaceleraram (ver `motivo`).
  function textoPersistenciaPreocupacao(persistencia, tipo) {
    const unidade = tipo === 'ano' ? 'ano' : 'mês';
    if (persistencia <= 1) return 'caso isolado, período atípico';
    if (persistencia === 2) return '2º ' + unidade + ' seguido piorando — comece a acompanhar de perto';
    return persistencia + 'º ' + unidade + ' consecutivo piorando — tendência consolidada';
  }

  // Rótulo curto do motivo, usado na tabela "Ver tabela" (todos os KPIs acompanhados, não só o
  // top 5 do ranking).
  function formatMotivoPreocupacao(motivo) {
    if (motivo === 'queda') return 'Caiu';
    if (motivo === 'desaceleracao') return 'Cresceu abaixo do padrão';
    if (motivo === 'piora') return 'Piorou';
    return '—';
  }

  // Linhas da explicação de por que aquele KPI está no ranking: o que variou (queda literal ou
  // crescimento bem abaixo do padrão histórico — `item.motivo`), há quanto tempo vem piorando
  // (persistência) e por que ele importa pro negócio (peso).
  function explicacaoPreocupacao(item, tipo) {
    let linha1;
    if (item.motivo === 'desaceleracao') {
      // Só mostra o número da média histórica pra formatos onde ela está na mesma unidade da
      // variação exibida (% relativo) — formatVariacaoPreocupacao mostra 'pct' em p.p., que não
      // é comparável com a média histórica (calculada em % relativo internamente).
      const mostraMedia = item.formato !== 'pct' && item.mediaHistorica != null;
      linha1 = item.metrica + ' cresceu apenas ' + formatVariacaoPreocupacao(item) +
        ' — bem abaixo do padrão histórico desse KPI' +
        (mostraMedia ? ' (' + formatMoM(item.mediaHistorica) + ' em média)' : '');
    } else {
      const verbo = item.delta >= 0 ? 'subiu' : 'caiu';
      linha1 = item.metrica + ' ' + verbo + ' ' + formatVariacaoPreocupacao(item);
    }
    return [
      linha1,
      textoPersistenciaPreocupacao(item.persistencia, tipo) + '.',
      item.pesoTexto + '.'
    ];
  }

  // Variação mês a mês de uma série; o primeiro ponto fica null (não há mês anterior na janela).
  function calcularSerieMoM(serie) {
    return serie.map(function (v, i, arr) {
      if (i === 0) return null;
      const anterior = arr[i - 1];
      return anterior ? (v - anterior) / anterior : null;
    });
  }
  function formatNum(value, decimals) {
    if (value == null) value = 0;
    return value.toLocaleString('pt-BR', { maximumFractionDigits: decimals || 0 });
  }
  // Usada nos eixos/tooltips dos gráficos, onde compactar ajuda a caber.
  function formatValor(value, format) {
    if (format === 'brl') return formatBRL(value);
    if (format === 'pct') return formatPct(value);
    if (format === 'dias') return formatNum(value, 1) + ' dias';
    if (format === 'nota') return formatNum(value, 2) + ' / 5';
    if (format === 'dec') return formatNum(value, 2);
    if (format === 'num') return compactNumber(value);
    return formatNum(value);
  }
  // Valor completo (com casas decimais), sem abreviar — usado no tooltip do KPI.
  function formatValorCompleto(value, format) {
    if (format === 'brl') return formatBRLCheio(value);
    if (format === 'dec') return formatNum(value, 2);
    if (format === 'pct') return formatPct(value);
    if (format === 'dias') return formatNum(value, 1) + ' dias';
    if (format === 'nota') return formatNum(value, 2) + ' / 5';
    return formatNum(value);
  }
  // Valor exibido no card de KPI: compacta em mil/mi acima de R$ 10 mil (pra sempre caber),
  // o valor exato continua disponível no tooltip (title) do elemento.
  function formatValorKpi(value, format) {
    if (format === 'brl' && Math.abs(value) >= 10000) return formatBRL(value);
    return formatValorCompleto(value, format);
  }
  function formatMesLabel(mes) {
    const partes = mes.split('-');
    const nomes = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    return nomes[parseInt(partes[1], 10) - 1] + '/' + partes[0];
  }
  function formatDataHora(isoString) {
    const d = new Date(isoString);
    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth() + 1).padStart(2, '0');
    const hora = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return dia + '/' + mes + ' ' + hora + ':' + min;
  }

  // Tooltip flutuante em HTML (fora do canvas) para as sparklines — o tooltip nativo do Chart.js
  // é desenhado dentro do próprio canvas, então num gráfico de 34px de altura ele fica cortado.
  let sparklineTooltipEl = null;
  function getSparklineTooltipEl() {
    if (!sparklineTooltipEl) {
      sparklineTooltipEl = document.createElement('div');
      sparklineTooltipEl.className = 'kpi-spark-tooltip';
      document.body.appendChild(sparklineTooltipEl);
    }
    return sparklineTooltipEl;
  }
  function sparklineExternalTooltip(cfg) {
    return function (context) {
      const tooltipModel = context.tooltip;
      const el = getSparklineTooltipEl();
      if (tooltipModel.opacity === 0) {
        el.style.opacity = '0';
        return;
      }
      const titulo = (tooltipModel.title && tooltipModel.title[0]) || '';
      const ponto = tooltipModel.dataPoints && tooltipModel.dataPoints[0];
      const valor = ponto ? formatValorCompleto(ponto.parsed.y, cfg.format) : '';
      el.innerHTML = '<div class="kpi-spark-tooltip-title">' + titulo + '</div>' +
        '<div class="kpi-spark-tooltip-value">' + valor + '</div>';

      const rect = context.chart.canvas.getBoundingClientRect();
      el.style.left = (rect.left + tooltipModel.caretX) + 'px';
      el.style.top = (rect.top + tooltipModel.caretY) + 'px';
      el.style.opacity = '1';
    };
  }

  // Encolhe a fonte do valor do KPI até caber na largura do card, sem nunca vazar.
  function ajustarTamanhosKpi(containerId) {
    document.querySelectorAll('#' + containerId + ' .kpi-value').forEach(function (el) {
      let fontSize = 22;
      el.style.fontSize = fontSize + 'px';
      while (el.scrollWidth > el.clientWidth && fontSize > 13) {
        fontSize -= 1;
        el.style.fontSize = fontSize + 'px';
      }
    });
  }

  // ===== KPIs (stat tiles + sparkline) =====

  function deltaInfo(delta, positiveIsGood) {
    if (delta === null || delta === undefined) return { cls: 'neutral', arrow: '—' };
    const isUp = delta > 0;
    const isGood = isUp === positiveIsGood;
    return {
      cls: delta === 0 ? 'neutral' : (isGood ? 'up' : 'down'),
      arrow: isUp ? '▲' : (delta < 0 ? '▼' : '—')
    };
  }

  // Comparação da página em exibição: com mês aberto, o mês anterior vem cortado no mesmo dia (dados.comparacao do backend).
  let comparacaoAtual = null;
  function rotuloMesAnt_() { return comparacaoAtual && comparacaoAtual.parcial ? 'dias 1–' + comparacaoAtual.dia + ' do mês anterior' : 'mês anterior'; }
  function capMesAnt_() { const s = rotuloMesAnt_(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function sufixoParcial_(comp) { return comp && comp.parcial ? ' (dias 1–' + comp.dia + ')' : ''; }

  // Para KPIs que já são uma taxa (%), a variação é a diferença em pontos percentuais (6% → 8,4% = +2,4 p.p., não "+40%").
  function renderDeltaHtml(delta, positiveIsGood, cfg, entry) {
    const rotulo = periodoTipoAtual === 'ano' ? 'vs. ano anterior' : (comparacaoAtual && comparacaoAtual.parcial ? 'vs. dias 1–' + comparacaoAtual.dia + ' mês ant.' : 'vs. ' + rotuloMesAnt_());
    if (delta === null || delta === undefined) {
      return '<div class="kpi-delta neutral">sem período anterior p/ comparar</div>';
    }
    if (cfg && cfg.format === 'pct' && entry && entry.valorAnterior != null) {
      const pp = (entry.valor - entry.valorAnterior) * 100;
      const infoPP = deltaInfo(Math.abs(pp) < 0.05 ? 0 : pp, positiveIsGood);
      return '<div class="kpi-delta ' + infoPP.cls + '">' + infoPP.arrow + ' ' + formatNum(Math.abs(pp), 1) + ' p.p. ' + rotulo + '</div>';
    }
    const info = deltaInfo(delta, positiveIsGood);
    return '<div class="kpi-delta ' + info.cls + '">' + info.arrow + ' ' + formatPct(Math.abs(delta)) + ' ' + rotulo + '</div>';
  }

  // Card de KPI (label + sparkline à direita, valor, variação) — usado na Visão Geral e em Vendas.
  const KPI_DICAS = {
    receitaTotal: ['Quanto entrou de receita no período?', 'Soma do valor total dos pedidos entregues ou faturados no período: produtos + frete cobrado do cliente. A seta compara com o período anterior.'],
    margemLiquida: ['Quanto do faturamento é receita líquida?', 'Receita líquida (valor dos produtos) ÷ faturamento total (produtos + frete). Quanto menor, mais o frete pesa no que o cliente paga. Não é margem de lucro: os dados não trazem o custo do produto.'],
    ticketMedio: ['Quanto cada pedido vale, em média?', 'Faturamento ÷ número de pedidos. Sobe com produtos mais caros ou mais itens por pedido.'],
    notaMedia: ['Como o cliente avalia a compra?', 'Média das notas de 1 a 5 das avaliações dos pedidos do período.'],
    pctPositivas: ['Quantos clientes saem satisfeitos?', 'Avaliações com nota 4 ou 5 ÷ total de avaliações dos pedidos do mês. A meta é ficar acima de 95%.'],
    pctInsatisfeitas: ['Quantos clientes saem insatisfeitos?', 'Avaliações com nota 1, 2 ou 3 ÷ total de avaliações dos pedidos do mês. Menor é melhor.'],
    clientesInsatisfeitos: ['Quantos clientes tiveram uma experiência ruim?', 'Clientes únicos com ao menos uma avaliação de nota 1 a 3 nos pedidos do mês.'],
    avaliadores: ['Quantos clientes avaliaram?', 'Clientes únicos que avaliaram algum pedido do mês. É a base de todas as taxas desta página.'],
    pctComentario: ['Quantos clientes explicam a nota por escrito?', 'Avaliações com comentário ÷ total de avaliações. Mais comentários dão mais base para entender os motivos.'],
    taxaAtraso: ['Quantas entregas chegam depois do prometido?', 'Pedidos entregues após a data estimada ÷ pedidos entregues. Menor é melhor.'],
    taxaCancelamento: ['Quantos pedidos são cancelados?', 'Pedidos cancelados ÷ total de pedidos do período. Menor é melhor.'],
    faturamento: ['Quanto vendemos no mês?', 'Receita de produtos dos pedidos entregues ou faturados, sem descontar frete.'],
    pedidos: ['Quantos pedidos foram feitos?', 'Número de pedidos do período. É o efeito "volume" do faturamento.'],
    clientes: ['Quantos clientes compraram?', 'Clientes únicos com ao menos um pedido no período.'],
    itensPorPedido: ['Quantos itens vão em cada pedido?', 'Itens vendidos ÷ pedidos. Ajuda a explicar variações de ticket.'],
    vendedores: ['Quantos vendedores estão ativos?', 'Vendedores com ao menos uma venda no período.'],
    concentracaoTop3: ['O faturamento depende de poucas categorias?', 'Participação das 3 maiores categorias no faturamento. Menor indica receita mais distribuída.'],
    avaliacoesNegativas: ['Quantos clientes saíram insatisfeitos?', 'Avaliações com nota 1 ou 2 ÷ total de avaliações. Menor é melhor.'],
    novos: ['Quantos clientes compraram pela primeira vez?', 'Clientes ativos no mês cujo primeiro pedido faturado (em todo o histórico) foi neste mês.'],
    recorrentes: ['Quantos clientes já tinham comprado antes?', 'Clientes ativos no mês menos os novos: quem já tinha pedido faturado em meses anteriores.'],
    pedidosPorVendedor: ['Quantos pedidos cada vendedor atende, em média?', 'Pedidos do mês ÷ vendedores ativos. Um pedido com vendedores diferentes conta uma vez no total.'],
    clientesPorVendedor: ['Quantos clientes cada vendedor atende, em média?', 'Pares vendedor × cliente distintos no mês ÷ vendedores ativos.'],
    entregues: ['Quantos pedidos chegaram ao cliente?', 'Pedidos do mês com status Entregue. É a base dos tempos e do cumprimento desta página.'],
    pctNoPrazo: ['Quantos pedidos chegaram na data estimada ou antes?', 'Pedidos entregues na data estimada ou antes ÷ pedidos entregues. Maior é melhor.'],
    tempoMediano: ['Em quantos dias metade dos pedidos chega?', 'Mediana de dias entre o pedido e a entrega ao cliente, nos pedidos entregues. Metade dos pedidos chega mais rápido que isso.'],
    tempoP90: ['Em quantos dias 9 em cada 10 pedidos chegam?', 'P90 de dias entre o pedido e a entrega ao cliente, nos pedidos entregues. Mostra a cauda: os pedidos mais demorados.'],
    freteMedio: ['Quanto o cliente paga de frete por pedido?', 'Frete médio cobrado do cliente por pedido do mês. Não é o custo real de operação da logística.'],
    emAndamento: ['Quantos pedidos do mês ainda não foram entregues?', 'Pedidos do mês com status Enviado, Processando, Faturado, Aprovado ou Criado.'],
    custoFrete: ['Quanto gastamos com frete?', 'Soma do frete dos pedidos entregues ou faturados no período. É o único custo que os dados trazem; menor é melhor.'],
    faturamentoTotal: ['Quanto faturamos no total?', 'Valor total dos pedidos entregues ou faturados: produtos (receita líquida) + frete cobrado do cliente.'],
    margemPct: ['Que fatia do faturamento é receita líquida?', 'Receita líquida ÷ faturamento total (produtos + frete). A variação exibida é a diferença em pontos percentuais vs. o mês anterior.'],
    avaliacoesCincoEstrelas: ['Quantos clientes saíram muito satisfeitos?', 'Avaliações com nota 5 ÷ total de avaliações.']
  };

  function htmlKpiTip(chave) {
    const d = KPI_DICAS[chave];
    if (!d) return '';
    return '<div class="info-tip-panel kpi-tip"><div class="tip-pergunta">' + d[0] + '</div><div class="tip-texto">' + d[1] + '</div></div>';
  }

  function htmlKpiCard(cfg, entry, canvasId) {
    return '<div class="kpi-card">' + htmlKpiTip(cfg.key) +
      '<div class="kpi-card-header">' +
      '<div class="kpi-label' + (cfg.labelSmall ? ' kpi-label--small' : '') + '" title="' + cfg.label + '">' + cfg.label + '</div>' +
      '<div class="kpi-spark-wrap"><canvas id="' + canvasId + '"></canvas></div>' +
      '</div>' +
      '<div class="kpi-value" title="' + formatValorCompleto(entry.valor, cfg.format) + '">' + formatValorKpi(entry.valor, cfg.format) + '</div>' +
      renderDeltaHtml(entry.delta, cfg.positiveIsGood, cfg, entry) +
      '</div>';
  }

  function renderKpis(data) {
    const kpis = data.kpis;
    document.getElementById('kpi-row').innerHTML = KPI_CONFIG.map(function (cfg) {
      return htmlKpiCard(cfg, kpis[cfg.key], 'spark-' + cfg.key);
    }).join('');

    ajustarTamanhosKpi('kpi-row');

    Object.keys(sparklineCharts).forEach(function (k) { sparklineCharts[k].destroy(); });
    sparklineCharts = {};

    const serieDados = (periodoTipoAtual === 'ano' ? data.janelaAnual : data.janelaMensal) || [];
    const rotulosPeriodo = serieDados.map(function (m) {
      return periodoTipoAtual === 'ano' ? m.ano : formatMesLabel(m.mes);
    });

    KPI_CONFIG.forEach(function (cfg) {
      const serie = serieDados.map(function (m) { return m[cfg.serieKey || cfg.key]; });
      criarSparkline('spark-' + cfg.key, cfg.key, rotulosPeriodo, serie, cfg, kpis[cfg.key].delta);
    });
  }

  // Sparkline de um KPI: linha cinza discreta, com só o ponto final colorido pela direção da
  // variação (verde/vermelho conforme positiveIsGood). Usada nos cards do topo e no resumo por área.
  function criarSparkline(canvasId, chaveGrafico, rotulos, serie, cfg, delta, registro) {
    const info = deltaInfo(delta, cfg.positiveIsGood);
    const corPonta = info.cls === 'up' ? cssVar('--delta-up-good') : (info.cls === 'down' ? cssVar('--status-critical') : cssVar('--text-muted'));
    const pointColors = serie.map(function (_, i) { return i === serie.length - 1 ? corPonta : 'transparent'; });

    (registro || sparklineCharts)[chaveGrafico] = new Chart(document.getElementById(canvasId), {
      type: 'line',
      data: {
        labels: rotulos,
        datasets: [{
          data: serie,
          borderColor: cssVar('--baseline'),
          borderWidth: 1.5,
          pointRadius: 3,
          pointHoverRadius: 4,
          pointBackgroundColor: pointColors,
          pointBorderWidth: 0,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: sparklineExternalTooltip(cfg)
          }
        },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  }

  // ===== Fechamento: onde investigar agora (resumo por área + sinais do ranking) =====

  // Os dois números de cada área NÃO estão na fileira de KPIs do topo. A sparkline acompanha a primeira.
  // "breve" = área cuja página ainda não existe (aparece esmaecida, sem clique).
  const AREAS_RESUMO = [
    {
      view: 'receita', nome: 'Receita',
      metricas: [
        { key: 'receitaProdutos', serieKey: 'receitaProdutos', label: 'Receita líquida', format: 'brl', positiveIsGood: true },
        { key: 'custoFrete', label: 'Custo de frete', format: 'brl', positiveIsGood: false }
      ]
    },
    {
      view: 'vendas', nome: 'Vendas',
      metricas: [
        { key: 'totalPedidos', serieKey: 'pedidos', label: 'Pedidos', format: 'num', positiveIsGood: true },
        { key: 'receitaPorCliente', label: 'Receita por cliente', format: 'brl', positiveIsGood: true }
      ]
    },
    {
      view: 'logistica', nome: 'Logística',
      metricas: [
        { key: 'tempoMedioEntrega', label: 'Prazo de entrega', format: 'dias', positiveIsGood: false },
        { key: 'tempoAteEnvio', label: 'Tempo até envio', format: 'dias', positiveIsGood: false }

    },
    {

      ]
    }
  ];

  // A qual área pertence cada métrica do ranking de pontos de atenção (rótulos de PREOCUPACOES_CONFIG).
  const AREA_POR_METRICA = {
    'Receita total': 'receita', 'Faturamento (produtos)': 'receita', 'Margem': 'receita',
    'Custo de frete': 'receita', 'Frete / receita': 'receita',
    'Total de pedidos': 'vendas', 'Ticket médio': 'vendas', 'Receita por cliente': 'vendas', 'Taxa de recompra': 'vendas',
    'Taxa de cancelamento': 'logistica', 'Taxa de atraso': 'logistica', 'Prazo médio de entrega': 'logistica', 'Tempo até envio': 'logistica',
    'Nota média': 'satisfacao', 'Avaliações negativas': 'satisfacao'
  };

  function sinaisPorArea(data) {
    const sinais = {};
    (data.preocupacoesTodos || []).forEach(function (p) {
      const view = AREA_POR_METRICA[p.metrica];
      if (!p.piorou || !view) return;
      const s = sinais[view] || (sinais[view] = { n: 0, critico: false });
      s.n++;
      if (p.severidade === 'critico') s.critico = true;
    });
    return sinais;
  }

  function renderAreasResumo(data) {
    const kpis = data.kpis;
    const serieDados = (periodoTipoAtual === 'ano' ? data.janelaAnual : data.janelaMensal) || [];
    const rotulos = serieDados.map(function (m) {
      return periodoTipoAtual === 'ano' ? m.ano : formatMesLabel(m.mes);

    const sinais = sinaisPorArea(data);

    document.getElementById('area-resumo-lista').innerHTML = AREAS_RESUMO.map(function (area) {
      const s = sinais[area.view];
      const classeSinal = !s ? 'ok' : (s.critico ? 'critico' : 'atencao');
      const textoSinal = !s ? 'Sem sinais de atenção' : s.n + (s.n === 1 ? ' sinal de atenção' : ' sinais de atenção');
      return '<button class="area-resumo' + (area.breve ? ' area-resumo--breve' : '') + '" data-view="' + area.view + '" title="' + (area.breve ? area.nome + ' (página em breve)' : 'Abrir ' + area.nome) + '">' +

          '<div class="kpi-label">' + area.nome + (area.breve ? ' · em breve' : ' →') + '</div>' +
          '<div class="kpi-spark-wrap"><canvas id="spark-area-' + area.view + '"></canvas></div>' +
        '</div>' +
        '<div class="area-sinais area-sinais--' + classeSinal + '">' + textoSinal + '</div>' +
        '<div class="area-resumo-metricas">' + area.metricas.map(function (cfg) {
          const entry = kpis[cfg.key];

            '<div class="area-resumo-rotulo">' + cfg.label + '</div>' +
            '<div class="kpi-value" title="' + formatValorCompleto(entry.valor, cfg.format) + '">' + formatValorKpi(entry.valor, cfg.format) + '</div>' +
            renderDeltaHtml(entry.delta, cfg.positiveIsGood, cfg, entry) +

    AREAS_RESUMO.forEach(function (area) {
      const principal = area.metricas[0];

      criarSparkline('spark-area-' + area.view, 'area-' + area.view, rotulos, serie, principal, kpis[principal.key].delta);
    });

  // Etapa 06: os 3 números de satisfação ao lado do gráfico atraso × nota.
  const CLIENTE_KPI_CONFIG = [
    { key: 'notaMedia', label: 'Nota média', format: 'nota', positiveIsGood: true },

    });
  }

  // Etapa 05: tempo até envio e prazo de entrega (barras, dias) com a taxa de atraso em linha por cima.
  // A variação MoM de cada série fica na tooltip.
  function renderOperacaoChart(data) {

    const corAtraso = cssVar('--chart-custo-bar');

          { type: 'bar', label: 'Prazo de entrega', data: entrega, backgroundColor: cssVar('--chart-evolucao-bar'), maxBarThickness: 24, yAxisID: 'y', order: 2,
            datalabels: { display: true, anchor: 'end', align: 'top', offset: 3, color: cssVar('--text-primary'), font: { size: 9, weight: '600' }, formatter: rotuloBarra } },
          { type: 'line', label: 'Taxa de atraso', data: atraso, borderColor: corAtraso, backgroundColor: corAtraso, borderWidth: 2, pointRadius: 3,
            pointBackgroundColor: corAtraso, tension: 0, yAxisID: 'y1', order: 1,
            datalabels: { display: true, anchor: 'end', align: 'top', offset: 5, color: corAtraso, font: { size: 9, weight: '600' }, formatter: function (v) { return formatPct(v); } } }

      },

  // ===== Tabelas (twin de acessibilidade de cada gráfico) =====

  function renderTable(containerId, headers, rows) {
    const container = document.getElementById(containerId);
    const thead = '<thead><tr>' + headers.map(function (h) {
      return '<th class="' + (h.num ? 'num' : '') + '">' + h.label + '</th>';
    }).join('') + '</tr></thead>';
    const tbody = '<tbody>' + rows.map(function (row) {
      return '<tr>' + headers.map(function (h) {
        return '<td class="' + (h.num ? 'num' : '') + '">' + h.render(row) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
    container.innerHTML = '<table class="data-table">' + thead + tbody + '</table>';
  }

  document.querySelectorAll('.table-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const key = btn.dataset.chart;
      const visual = document.querySelector('.chart-visual[data-visual="' + key + '"]');
      const tableWrap = document.getElementById('table-' + key);
      const showingTable = !tableWrap.hidden;
      tableWrap.hidden = showingTable;
      visual.hidden = !showingTable;
      btn.textContent = showingTable ? 'Ver tabela' : 'Ver gráfico';
    });
  });

  // ===== Gráficos =====

  // Legenda customizada clicável: clicar numa categoria isola só aquela série no gráfico
  // (esconde as outras); clicar de novo na mesma categoria isolada volta a mostrar todas.
  // Genérico — funciona em qualquer chart-legend com itens `data-dataset-index` + `chartKey`
  // apontando pra uma entrada de `charts`. Registrado uma única vez (os elementos da legenda são
  // fixos no DOM; só o Chart.js por trás é recriado a cada troca de período).
  function habilitarLegendaClicavel_(legendContainerId, chartKey) {
    const container = document.getElementById(legendContainerId);
    if (!container) return;
    const itens = Array.prototype.slice.call(container.querySelectorAll('[data-dataset-index]'));
    itens.forEach(function (item) {
      item.addEventListener('click', function () {
        const chart = charts[chartKey];
        if (!chart) return;
        const indiceClicado = parseInt(item.dataset.datasetIndex, 10);
        const jaIsolado = item.classList.contains('chart-legend-item--ativo');
        itens.forEach(function (it) {
          const idx = parseInt(it.dataset.datasetIndex, 10);
          const visivel = jaIsolado || idx === indiceClicado;
          chart.setDatasetVisibility(idx, visivel);
          it.classList.toggle('chart-legend-item--ativo', !jaIsolado && idx === indiceClicado);
          it.classList.toggle('chart-legend-item--inativo', !jaIsolado && idx !== indiceClicado);
        });
        chart.update();
      });
    });
  }

  // Depois de recriar o gráfico (troca de período), volta a legenda pro estado "tudo visível" —
  // um Chart.js novo sempre nasce com todos os datasets ligados, então o estado isolado de uma
  // renderização anterior ficaria visualmente errado se não resetar as classes aqui.
  function resetarLegendaClicavel_(legendContainerId) {
    const container = document.getElementById(legendContainerId);
    if (!container) return;
    container.querySelectorAll('[data-dataset-index]').forEach(function (item) {
      item.classList.remove('chart-legend-item--ativo', 'chart-legend-item--inativo');
    });
  }

  // Evolução mensal de faturamento, custo e margem — faturamento e custo como barras (valor em
  // R$, eixo esquerdo), margem como linha sobreposta (%, eixo direito) — mesmo padrão "barra(s) +
  // linha" do resto do dash (renderComboValorMoMChart), só que aqui com 2 barras. A variação (MoM)
  // de cada série não vai mais no rótulo do gráfico — fica só na tooltip, pra não competir por
  // espaço com o valor absoluto (testamos rótulo de variação em cima: barras/linhas coladas
  // quando os valores ficam parecidos entre si; valor absoluto não tem esse problema porque
  // faturamento e custo são ordens de grandeza diferentes).
  function renderEvolucaoFaturamentoCustoMargemChart(data) {
    if (charts.evolucaoMargem) charts.evolucaoMargem.destroy();
    if (!data.janelaMensal) return;
    const labels = data.janelaMensal.map(function (r) { return formatMesLabel(r.mes); });
    const faturamento = data.janelaMensal.map(function (r) { return r.receitaProdutos || 0; });
    const custo = data.janelaMensal.map(function (r) { return r.custoFrete || 0; });
    const margem = data.janelaMensal.map(function (r) { return r.margemLiquida || 0; });

    const momFaturamento = calcularSerieMoM(faturamento);
    const momCusto = calcularSerieMoM(custo);
    const momMargem = calcularSerieMoM(margem);
    const momPorDataset = [momFaturamento, momCusto, momMargem];

    const corFaturamento = cssVar('--chart-faturamento-bar');
    const corCusto = cssVar('--chart-custo-bar');
    const corMargem = cssVar('--brand');

    // Mesma técnica do renderComboValorMoMChart pra linha nunca cruzar a área das barras: a barra
    // ganha um teto bem acima do seu máximo real (fica "espremida" embaixo) e a linha ganha um
    // piso bem abaixo do seu mínimo real (fica "espremida" numa fatia só no topo, ~22% do eixo).
    const maxBarra = Math.max.apply(null, faturamento.concat(custo).concat([0]));

    const margemValidos = margem.filter(function (v) { return v != null; });
    const margemMaxReal = margemValidos.length ? Math.max.apply(null, margemValidos) : 1;
    const margemMinReal = margemValidos.length ? Math.min.apply(null, margemValidos) : 0;
    const variacaoMargem = (margemMaxReal - margemMinReal) || 0.02;
    const y1Max = margemMaxReal + variacaoMargem * 0.15;
    const y1Min = y1Max - variacaoMargem / 0.22; // a margem real ocupa ~22% do topo do eixo y1

    charts.evolucaoMargem = new Chart(document.getElementById('chart-evolucao-margem'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            type: 'bar',
            label: 'Faturamento (produtos)',
            data: faturamento,
            backgroundColor: corFaturamento,
            maxBarThickness: 24,
            yAxisID: 'y',
            order: 2, // maior order = desenhado antes = fica atrás da linha de margem
            datalabels: {
              display: true,
              anchor: 'end', align: 'top', offset: 4,
              color: cssVar('--text-primary'), font: { size: 9, weight: '600' },
              formatter: function (value) { return formatValor(value, 'brl'); }
            }
          },
          {
            type: 'bar',
            label: 'Custo (frete)',
            data: custo,
            backgroundColor: corCusto,
            maxBarThickness: 24,
            yAxisID: 'y',
            order: 2,
            datalabels: {
              display: true,
              anchor: 'end', align: 'top', offset: 4,
              color: cssVar('--text-primary'), font: { size: 9, weight: '600' },
              formatter: function (value) { return formatValor(value, 'brl'); }
            }
          },
          {
            type: 'line',
            label: 'Margem',
            data: margem,
            borderColor: corMargem,
            backgroundColor: corMargem,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: corMargem,
            tension: 0,
            yAxisID: 'y1',
            order: 1, // menor order = desenhado por último = fica na frente das barras
            datalabels: {
              display: true,
              anchor: 'end', align: 'top', offset: 6,
              color: corMargem, font: { size: 9, weight: '600' },
              formatter: function (value) { return formatPct(value); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: Object.assign({}, TOOLTIP_FATURAMENTO_CALLBACKS, {
              label: function (ctx) {
                const mom = momPorDataset[ctx.datasetIndex][ctx.dataIndex];
                const valorFormatado = ctx.datasetIndex === 2 ? formatPct(ctx.parsed.y) : formatValor(ctx.parsed.y, 'brl');
                return ctx.dataset.label + ': ' + valorFormatado + ' (variação: ' + formatMoM(mom) + ')';
              }
            })
          }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') }
          },
          y: {
            position: 'left',
            beginAtZero: true,
            max: maxBarra * 1.7,
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { color: cssVar('--chart-eixo') },
            ticks: { display: false, count: 3 }
          },
          y1: {
            type: 'linear',
            position: 'right',
            min: y1Min,
            max: y1Max,
            grid: { display: false },
            border: { display: false },
            ticks: { display: false }
          }
        }
      }
    });

    resetarLegendaClicavel_('evolucao-margem-legend');

    const momFaturamentoPorMes = mapearSeriePorMes(data.janelaMensal, momFaturamento);
    const momCustoPorMes = mapearSeriePorMes(data.janelaMensal, momCusto);
    const momMargemPorMes = mapearSeriePorMes(data.janelaMensal, momMargem);
    renderTable('table-evolucao-margem',
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Faturamento (produtos)', num: true, render: function (r) { return formatBRLCheio(r.receitaProdutos); } },
        { label: 'Variação faturamento (MoM)', num: true, render: function (r) { return formatMoM(momFaturamentoPorMes[r.mes]); } },
        { label: 'Custo (frete)', num: true, render: function (r) { return formatBRLCheio(r.custoFrete); } },
        { label: 'Variação custo (MoM)', num: true, render: function (r) { return formatMoM(momCustoPorMes[r.mes]); } },
        { label: 'Margem', num: true, render: function (r) { return formatPct(r.margemLiquida); } },
        { label: 'Variação margem (MoM)', num: true, render: function (r) { return formatMoM(momMargemPorMes[r.mes]); } }
      ],
      data.janelaMensal
    );
  }

  // (Ver a linha que segue) evolução mensal em R$ da série de receita, usada na Visão Geral.
  function renderEvolucaoChart(data) {
    if (charts.receitaMes) charts.receitaMes.destroy();
    const titulo = document.getElementById('evolucao-titulo');
    titulo.textContent = 'Evolução mensal de receita líquida de frete — últimos 12 meses';
    const labels = data.janelaMensal.map(function (r) { return formatMesLabel(r.mes); });
    const receitaLiquidaSerie = data.janelaMensal.map(function (r) { return (r.receitaProdutos || 0) - (r.custoFrete || 0); });

    charts.receitaMes = renderComboValorMoMChart('chart-receita-mes', {
      labels: labels,
      valores: receitaLiquidaSerie,
      labelBarra: 'Receita líquida de frete',
      corBarra: cssVar('--chart-evolucao-bar'),
      corBarraAtiva: cssVar('--brand'),
      mesesRef: data.janelaMensal,
      mesAtivo: data.periodo
    });

    const momPorMes = mapearSeriePorMes(data.janelaMensal, calcularSerieMoM(receitaLiquidaSerie));
    renderTable('table-receita-mes',
      [
        { label: 'Mês', render: function (r) { return formatMesLabel(r.mes); } },
        { label: 'Receita líquida de frete', num: true, render: function (r) { return formatBRLCheio((r.receitaProdutos || 0) - (r.custoFrete || 0)); } },
        { label: 'Variação (MoM)', num: true, render: function (r) { return formatMoM(momPorMes[r.mes]); } },
        { label: 'Receita de produtos', num: true, render: function (r) { return formatBRLCheio(r.receitaProdutos); } },
        { label: 'Frete', num: true, render: function (r) { return formatBRLCheio(r.custoFrete); } },
        { label: 'Pedidos', num: true, render: function (r) { return formatNum(r.pedidos); } }
      ],
      data.janelaMensal
    );
  }

  // Associa cada valor de uma série (na mesma ordem/tamanho de `meses`) ao mês correspondente,
  // pra buscar por `r.mes` nas colunas de tabela sem depender de índice posicional.
  function mapearSeriePorMes(meses, serie) {
    const mapa = {};
    meses.forEach(function (r, i) { mapa[r.mes] = serie[i]; });
    return mapa;
  }

  // Gráfico compartilhado pelas 3 evoluções mensais (valor total, faturado, frete):
  // barra com o valor do mês + linha com a variação mensal (MoM), verde se subiu, vermelho se caiu.
  function renderComboValorMoMChart(canvasId, opts) {
    const corPositivo = cssVar('--status-good');
    const corNegativo = cssVar('--status-critical');
    const corLinha = cssVar('--chart-evolucao-linha');
    const momSerie = calcularSerieMoM(opts.valores);
    const coresBarras = opts.mesesRef.map(function (r) {
      return (opts.corBarraAtiva && r.mes === opts.mesAtivo) ? opts.corBarraAtiva : opts.corBarra;
    });

    // Cada série tem sua própria escala (y para o valor, y1 para a variação %). Se as duas escalas
    // cobrirem só o range real dos dados, ambas acabam ocupando a altura toda do gráfico e a linha
    // atropela as barras. Por isso a barra ganha um teto bem acima do seu máximo (fica "espremida"
    // embaixo) e a linha ganha um piso bem abaixo do seu mínimo (fica "espremida" em cima) — a
    // variação real do MoM passa a ocupar só uma fatia no topo, sem cruzar a área das barras.
    const maxBarra = Math.max.apply(null, opts.valores);
    const momValidos = momSerie.filter(function (v) { return v != null; });
    const maxMom = momValidos.length ? Math.max.apply(null, momValidos.concat([0])) : 0.05;
    const minMom = momValidos.length ? Math.min.apply(null, momValidos.concat([0])) : -0.05;
    const variacaoMom = (maxMom - minMom) || 0.02;
    const y1Max = maxMom + variacaoMom * 0.15;
    const y1Min = y1Max - variacaoMom / 0.22; // a variação real ocupa ~22% do topo do eixo y1
    const tamanhoFonte = opts.fontSizeLabels || 10;

    return new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: opts.labels,
        datasets: [
          {
            type: 'bar',
            label: opts.labelBarra,
            data: opts.valores,
            backgroundColor: coresBarras,
            maxBarThickness: 64,
            yAxisID: 'y',
            datalabels: {
              display: opts.rotuloSoMesAtivo
                ? function (ctx) { return opts.mesesRef[ctx.dataIndex].mes === opts.mesAtivo; }
                : true,
              anchor: 'end',
              align: 'top',
              rotation: opts.rotacaoRotulo || 0,
              offset: opts.rotacaoRotulo ? 2 : 4,
              color: cssVar('--text-primary'),
              font: { size: tamanhoFonte, weight: '600' },
              formatter: function (value) { return formatValor(value, 'brl'); }
            }
          },
          {
            type: 'line',
            label: 'Variação mensal (MoM)',
            data: momSerie,
            borderColor: corLinha,
            borderWidth: 2,
            borderDash: [5, 4],
            pointRadius: 0,
            tension: 0,
            fill: false,
            spanGaps: false,
            yAxisID: 'y1',
            datalabels: {
              display: true,
              anchor: 'end',
              align: 'top',
              color: function (ctx) {
                const v = ctx.dataset.data[ctx.dataIndex];
                return v == null ? cssVar('--text-muted') : (v >= 0 ? corPositivo : corNegativo);
              },
              font: { size: tamanhoFonte, weight: '600' },
              formatter: function (value) { return formatMoM(value); }
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: TOOLTIP_FATURAMENTO_CALLBACKS }
        },
        scales: {
          x: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') }
          },
          y: {
            position: 'left',
            beginAtZero: true,
            max: maxBarra * (opts.tetoBarra || 1.7),
            grid: { color: cssVar('--gridline'), borderDash: [4, 4] },
            border: { color: cssVar('--chart-eixo') },
            ticks: { display: false, count: 3 }
          },
          y1: {
            type: 'linear',
            position: 'right',
            min: y1Min,
            max: y1Max,
            grid: { display: false },
            border: { display: false },
            ticks: { display: false, count: 3 }
          }
        }
      }
    });
  }

  // Formata o período (mês 'yyyy-MM' ou ano 'yyyy') pra exibição humana.
  function formatPeriodoLabel(tipo, valor) {
    return tipo === 'ano' ? valor : formatMesLabel(valor);
  }

  // Ranking das métricas que pioraram vs. o período anterior — barra maior = piora relativa maior,
  // cor = severidade (posição no ranking, não direção). Lista de tamanho variável: se nada piorou,
  // mostra um estado vazio em vez de gráfico em branco.
  function renderPreocupacoesChart(data) {
    if (charts.preocupacoes) { charts.preocupacoes.destroy(); charts.preocupacoes = null; }
    const lista = data.preocupacoes || [];
    // Todos os 15 KPIs candidatos, não só quem entrou no top 5 — "Ver tabela" acompanha o
    // conjunto inteiro, o gráfico de barras continua mostrando só o ranking.
    const todos = data.preocupacoesTodos || [];
    const visual = document.querySelector('.chart-visual[data-visual="preocupacoes"]');
    const vazio = document.getElementById('preocupacoes-vazio');
    const caption = document.getElementById('preocupacoes-caption');

    if (caption) {
      caption.textContent = formatPeriodoLabel(data.tipo, data.periodo) + ' vs. ' + formatPeriodoLabel(data.tipo, data.periodoAnterior) + sufixoParcial_(data.comparacao) +
        ' — considera apenas pedidos entregues/faturados';
    }

    renderTable('table-preocupacoes',
      [
        { label: 'Métrica', render: function (p) { return p.metrica; } },
        { label: 'Variação', num: true, render: function (p) { return p.delta == null ? 'Sem período anterior' : formatVariacaoPreocupacao(p); } },
        { label: 'Motivo', render: function (p) { return formatMotivoPreocupacao(p.motivo); } },
        { label: 'Persistência', render: function (p) { return p.piorou ? textoPersistenciaPreocupacao(p.persistencia, data.tipo) : '—'; } },
        { label: 'Por que importa', render: function (p) { return p.pesoTexto; } },
        {
          label: 'Status',
          render: function (p) {
            if (p.severidade === 'critico') return 'Crítico';
            if (p.severidade === 'atencao') return 'Atenção';
            return p.piorou ? 'Fora do ranking' : 'Normal';
          }
        }
      ],
      todos
    );

    if (lista.length === 0) {
      visual.hidden = true;
      vazio.hidden = false;
      return;
    }
    visual.hidden = false;
    vazio.hidden = true;

    const corCritico = cssVar('--chart-custo-bar');
    const corAtencao = cssVar('--preocupacao-atencao');
    // Tamanho da barra = magnitude (não delta bruto): num item "desaceleração" o delta pode ser
    // um número pequeno e positivo (ainda cresceu), quem representa a severidade é o desvio vs.
    // padrão histórico daquele KPI.
    const valores = lista.map(function (p) { return p.magnitude; });
    const cores = lista.map(function (p) { return p.severidade === 'critico' ? corCritico : corAtencao; });
    const maxValor = Math.max.apply(null, valores.concat([0.01]));

    charts.preocupacoes = new Chart(document.getElementById('chart-preocupacoes'), {
      type: 'bar',
      data: {
        labels: lista.map(function (p) { return p.metrica; }),
        datasets: [{
          data: valores,
          backgroundColor: cores,
          borderRadius: 0,
          maxBarThickness: 28,
          datalabels: {
            display: true,
            anchor: 'end', align: 'end', offset: 6,
            color: cssVar('--text-primary'), font: { size: 11, weight: '600' },
            formatter: function (value, ctx) { return formatVariacaoPreocupacao(lista[ctx.dataIndex]); }
          }
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 56 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return lista[items[0].dataIndex].metrica; },
              label: function (ctx) { return 'Variação: ' + formatVariacaoPreocupacao(lista[ctx.dataIndex]); },
              footer: function (items) { return explicacaoPreocupacao(lista[items[0].dataIndex], data.tipo).slice(1); }
            }
          }
        },
        scales: {
          x: { display: false, grid: { display: false }, max: maxValor * 1.35 },
          y: {
            grid: { display: false },
            border: { color: cssVar('--chart-eixo') },
            ticks: { color: cssVar('--text-secondary'), font: { size: 12 } }
          }
        }
      }
    });
  }

  // Eixo que posiciona a série numa faixa vertical do gráfico (0 = base, 1 = topo). Mesma ideia do
  // "espremer a linha no topo" do renderComboValorMoMChart, generalizada: com duas séries em eixos
  // separados, cada uma ganha sua faixa e as linhas nunca se atropelam.
  function escalaEmFaixa_(serie, faixaInicio, faixaFim) {
    const validos = serie.filter(function (v) { return v != null; });
    if (!validos.length) return { min: 0, max: 1 };
    const menor = Math.min.apply(null, validos);
    const maior = Math.max.apply(null, validos);
    const amplitude = (maior - menor) || (Math.abs(maior) * 0.1) || 0.1;
    const span = amplitude / (faixaFim - faixaInicio);
    const min = menor - faixaInicio * span;
    return { min: min, max: min + span };
  }

  // Volume e retenção: pedidos (barras, escala esquerda) + taxa de recompra (linha por cima, escala
  // direita). A variação MoM de cada série fica só na tooltip. Recompra = clientes com mais de 1
  // pedido faturado dentro do próprio mês (ver nota em PREOCUPACOES_CONFIG no Code.gs).
  function renderVolumeRetencaoChart(data) {
    if (charts.volumeRetencao) charts.volumeRetencao.destroy();
    if (!data.janelaMensal) return;
    // Meia largura: 'Mar/25' em vez de 'Mar/2025' pra os 12 meses caberem sem girar o texto.
    const labels = data.janelaMensal.map(function (r) { return formatMesLabel(r.mes).replace('/20', '/'); });
    const pedidos = data.janelaMensal.map(function (r) { return r.pedidos || 0; });
    const recompra = data.janelaMensal.map(function (r) { return r.taxaRecompra || 0; });
    const momPorDataset = [calcularSerieMoM(pedidos), calcularSerieMoM(recompra)];

    const corPedidos = cssVar('--chart-evolucao-bar');
    const corRecompra = cssVar('--series-2');
